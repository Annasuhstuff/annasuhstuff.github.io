</style><style>/* ==========================================================================
   STUDIO · первое занятие с Катей.
   Поверхность серии, ещё не занятая другими уроками: светлый розовый
   с кислотным лаймом, крупные скругления и пилюли — абонемент фитнес-студии,
   а не тетрадь и не приборная панель. Шрифты Rubik (дисплей) + Manrope (текст).
   Сцена рассчитана на 1280 × 720: базовый кегль 13,5 px, хром 72 px.
   ========================================================================== */

:root{
  --paper:#fff6fa; --card:#ffffff; --ink:#1c1018; --muted:#87707e;
  --pink:#ff3d8b; --pink-deep:#d8004f; --pink-soft:#ffe3ef; --pink-line:#ffc9e0;
  --lime:#c8f425; --lime-soft:#effbbd; --lime-deep:#6f8a00;
  --line:#f3dde8; --good:#3f8f4e; --bad:#c62f3e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:13.5px/1.5 Manrope,'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button,a,summary{touch-action:manipulation}

/* ---------- типографика ---------- */
h1,h2,h3{font-family:Rubik,Manrope,sans-serif;font-weight:800;margin:0 0 9px;
  line-height:1.12;letter-spacing:-.025em}
h1{font-size:25px;max-width:900px}
h2{font-size:16px}
h3{font-size:13px;margin-top:11px}
p{margin:0 0 8px}p:last-child{margin-bottom:0}
a{color:var(--pink-deep);font-weight:700;text-decoration-thickness:1px;text-underline-offset:4px}
ol,ul{padding-left:18px;margin:7px 0}li{margin-bottom:4px}
.lead{font-size:12.5px;max-width:880px;color:var(--muted);margin-bottom:12px}
.small{font-size:11px;color:var(--muted)}
.ru{font-size:11px;color:var(--muted);font-style:normal}
.eyebrow{font-family:Rubik,sans-serif;font-size:9.5px;letter-spacing:.16em;font-weight:600;
  margin-bottom:7px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;text-transform:uppercase}
.badge{letter-spacing:0;text-transform:none;border:1px solid var(--pink-line);
  padding:1px 9px;border-radius:20px;background:var(--pink-soft);font-size:9.5px;font-weight:700}
.tag{font-family:Rubik,sans-serif;font-size:9px;letter-spacing:.14em;font-weight:600;
  display:block;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- кнопки ---------- */
button{cursor:pointer;border:1.5px solid var(--pink-line);border-radius:999px;
  background:var(--card);color:var(--ink);padding:6px 14px;font-weight:700;line-height:1.4;
  transition:transform .15s,background .15s,border-color .15s}
button:hover{background:var(--pink-soft);transform:translateY(-2px)}
button:disabled{opacity:.42;cursor:default;transform:none}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff}
button.primary:hover{background:var(--pink-deep);border-color:var(--pink-deep)}
button.lime{background:var(--lime);border-color:var(--lime);color:#243000}
button.lime:hover{background:var(--lime-soft);border-color:var(--lime-deep)}
button.active{background:var(--lime);border-color:var(--lime-deep)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.buttons{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:9px 0 4px}
.smallbuttons button{font-size:10px;padding:4px 10px}

/* ---------- хром: полоса сверху, подвал, прогресс ---------- */
.controlbar{display:flex;align-items:center;justify-content:space-between;gap:14px;
  height:38px;padding:0 26px;background:var(--ink);color:#fff}
.controlbar strong{font-family:Rubik,sans-serif;font-size:9.5px;letter-spacing:.2em;
  font-weight:600;color:var(--lime);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctools{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.ctools>button{background:transparent;border-color:#4a3644;color:#fff;font-size:10px;padding:3px 10px}
.ctools>button:hover{background:#3a2634;transform:none}
.levels{display:flex;background:#2e1e2a;padding:2px;border-radius:999px;gap:2px;border:1px solid #4a3644}
.levels button{border:0;background:transparent;color:#fff;font-size:10px;padding:3px 13px}
.levels button:hover{background:#43303d;transform:none}
.levels .active{background:var(--lime);color:#243000}
.stage{padding:16px 26px 14px;min-height:0;animation:arrive .26s ease}
.footer{height:34px;border-top:1px solid var(--line);padding:0 26px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--card)}
.footer p{margin:0;font-size:10.5px;color:var(--muted);letter-spacing:.3px}
.footer b{font-size:11px;color:var(--ink)}
.footer .buttons{margin:0;gap:6px}
.footer button{padding:3px 15px;font-size:12px;line-height:1.2}
.progressline{height:3px;background:var(--pink-soft)}
.progressline i{display:block;height:100%;background:var(--pink);transition:width .25s}

/* ---------- сетки и карточки ---------- */
.grid{display:grid;gap:12px}.grid>*{min-width:0}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.spaced{margin-top:10px}
.card{padding:13px 15px;background:var(--card);border:1.5px solid var(--line);border-radius:18px}
.card.pink{background:var(--pink-soft);border-color:var(--pink-line)}
.card.limecard{background:var(--lime-soft);border-color:#d8ee8a}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.dark .tag,.card.dark .small{color:#d9c3d0}
.note{padding:8px 12px;border-left:3px solid var(--pink);background:var(--pink-soft);
  border-radius:0 12px 12px 0;font-size:11.5px;margin:9px 0}
.note:last-child{margin-bottom:0}
.note.limenote{border-left-color:var(--lime-deep);background:var(--lime-soft)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.pills span{border:1px solid var(--pink-line);background:var(--card);border-radius:999px;
  padding:2px 10px;font-size:10.5px}
.pills button{font-size:10.5px;padding:2px 10px;border-radius:999px}
.split2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.hidden{display:none!important}

/* ---------- поля ввода ---------- */
input,textarea,select{border:1.5px solid var(--pink-line);border-radius:11px;background:var(--card);
  color:var(--ink);padding:6px 10px;width:100%;min-width:0;max-width:100%;line-height:1.45}
textarea{resize:vertical;display:block;margin:7px 0;border-radius:14px}
input[type=checkbox]{width:15px;height:15px;flex:0 0 auto;margin:3px 8px 0 0;accent-color:var(--pink)}
.checklist{margin:9px 0 5px}
.checklist label{display:flex;align-items:flex-start;font-size:11.5px;margin-bottom:5px}
.good{background:#eaf7ec!important;border-color:var(--good)!important}
.bad{background:#fdeaec!important;border-color:var(--bad)!important}
.feedback{margin:8px 0;font-size:11.5px}.feedback:empty{margin:0}
.feedback b{font-size:12.5px}
.gapline{display:flex;gap:9px;align-items:center;margin-bottom:6px}
.gapline .cue{font-size:11.5px;flex:1 1 auto}
.gapline input{flex:0 0 132px;width:132px}
.task{padding:0 0 9px;margin:0 0 9px;border-bottom:1px solid var(--line)}
.task:last-of-type,.split2>.task:nth-last-child(-n+2),.split3>.task:nth-last-child(-n+3){
  border-bottom:0;margin-bottom:0;padding-bottom:0}
.choice{display:block;text-align:left;width:100%;margin:3px 0;font-size:11.5px;
  border-radius:13px;padding:5px 12px;font-weight:500}
.choice.picked{border-color:var(--pink);background:var(--pink-soft);font-weight:700}
.choice.right{border-color:var(--good);background:#eaf7ec}
.choice.wrong{border-color:var(--bad);background:#fdeaec}

/* ---------- тест на уровень ---------- */
.testhead{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.testq{border-bottom:1px solid var(--line);padding:5px 0;display:grid;
  grid-template-columns:20px minmax(0,1fr) 148px;gap:9px;align-items:center;font-size:11.5px}
.testq:last-child{border-bottom:0}
.testq>i{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.testq select{padding:4px 8px;border-radius:9px;font-size:11px}
.testq.done>span:first-of-type::after{content:''}
.band{font-family:Rubik,sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.1em;
  border-radius:999px;padding:1px 7px;border:1px solid var(--pink-line);color:var(--muted)}
.scorewrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.bigscore{font-family:Rubik,sans-serif;font-size:54px;font-weight:800;letter-spacing:-.04em;
  line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:17px;letter-spacing:0;color:var(--muted)}
.cefr{font-family:Rubik,sans-serif;font-size:31px;font-weight:800;letter-spacing:-.03em;
  background:var(--lime);border-radius:14px;padding:4px 16px;display:inline-block;margin:6px 0 4px}
.bar{margin:7px 0}
.bar>span{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:3px}
.bar>div{height:8px;background:var(--pink-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:999px;transition:width .4s}
.bar.limebar i{background:var(--lime-deep)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0 4px}
.scale div{border:1.5px solid var(--line);border-radius:11px;padding:6px 8px;font-size:10px;text-align:center}
.scale div b{font-family:Rubik,sans-serif;display:block;font-size:13px;margin-bottom:2px}
.scale div.here{background:var(--lime);border-color:var(--lime-deep)}

/* ---------- словарь ---------- */
.searchrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.searchrow input{max-width:420px}
.catrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.wordgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.wordcard{border:1.5px solid var(--line);border-radius:15px;padding:9px 11px;background:var(--card);
  text-align:left;width:100%;display:flex;flex-direction:column;min-height:74px;font-weight:400}
.wordcard:hover{background:var(--pink-soft);transform:translateY(-2px)}
.wordcard:nth-child(5n+2){background:var(--pink-soft);border-color:var(--pink-line)}
.wordcard:nth-child(5n+4){background:var(--lime-soft);border-color:#e0f2a6}
.wordcard strong{font-family:Rubik,sans-serif;font-size:14px;line-height:1.15;letter-spacing:-.02em;
  display:block;margin-bottom:3px}
.wordcard .ru{display:block;line-height:1.3}
.wordcard .def{font-size:10.5px;line-height:1.35}
.wordcard .tag{margin-top:auto;padding-top:5px;font-size:8px}
.known{outline:2.5px solid var(--lime-deep)}

/* ---------- игра 1 · фигура ---------- */
.mirror{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px 16px;align-items:start;
  grid-template-areas:"fig cue" "fig say"}
.mirror>.figure{grid-area:fig}
.mirror>.cuecard{grid-area:cue}
.mirror>.saycard{grid-area:say}
.figure{background:var(--lime-soft);border-radius:18px;border:1.5px solid #e0f2a6;padding:6px}
.figure svg{display:block;width:100%;height:auto}
.zone{fill:rgba(255,61,139,.55);stroke:#fff;stroke-width:2;cursor:pointer;
  transition:fill .15s,stroke-width .15s}
.zone:hover{fill:rgba(255,61,139,.92)}
.zone.hit{fill:rgba(111,138,0,.5);stroke:var(--lime-deep);stroke-width:2.5}
.zone.miss{fill:rgba(198,47,62,.45);stroke:var(--bad);stroke-width:2.5}
.body .torso{fill:#2e1e2a;stroke:none}
.body .limb{fill:none;stroke:#2e1e2a;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
.body .limb.leg{stroke-width:21}
.body .foot{fill:none;stroke:#2e1e2a;stroke-width:9;stroke-linecap:round}
.cuebig{font-family:Rubik,sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.dots{display:flex;gap:5px;margin:9px 0}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--pink-soft);border:1.5px solid var(--pink-line)}
.dots i.ok{background:var(--lime);border-color:var(--lime-deep)}
.dots i.no{background:#fdeaec;border-color:var(--bad)}
.dots i.now{box-shadow:0 0 0 3px rgba(255,61,139,.25)}

/* ---------- игра 2 · спринт ---------- */
.sprint{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:start}
.timer{font-family:Rubik,sans-serif;font-size:42px;font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1.05}
.timer.low{color:var(--pink-deep)}
.repbar{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.repbar i{width:9px;height:14px;border-radius:3px;background:var(--pink-soft)}
.repbar i.done{background:var(--lime)}
.prompt{font-family:Rubik,sans-serif;font-size:23px;font-weight:800;letter-spacing:-.02em;
  line-height:1.2;margin-bottom:4px}
.promptdef{font-size:13px;line-height:1.4;margin-bottom:8px}

/* ---------- игры 4–6 ---------- */
.oddgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:9px 0}
.oddbtn{padding:13px 10px;border-radius:15px;font-size:13.5px;font-weight:700;line-height:1.25;text-align:center}
.oddbtn.right{background:#eaf7ec;border-color:var(--good)}
.oddbtn.wrong{background:#fdeaec;border-color:var(--bad)}
.pairgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pairgrid>div{display:grid;gap:7px;align-content:start}
.pairbtn{padding:10px 9px;border-radius:14px;font-size:12.5px;font-weight:700;line-height:1.2;text-align:center}
.pairbtn.ru{font-weight:500;background:var(--lime-soft);border-color:#d8ee8a}
.pairbtn.picked{background:var(--pink);border-color:var(--pink);color:#fff}
.pairbtn.solved{opacity:.35;text-decoration:line-through}
.saysit{font-size:14.5px;line-height:1.35;font-weight:700;margin:6px 0 9px}

/* ---------- игра 3 · собери фразу ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--pink-line);background:var(--card);border-radius:999px;
  padding:5px 13px;font-size:12.5px;font-weight:600}
.chip:hover{background:var(--pink-soft)}
.builtline{min-height:42px;border:2px dashed var(--pink-line);border-radius:14px;
  padding:6px 9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card)}
.builtline .chip{background:var(--lime-soft);border-color:#d8ee8a}
.builtline.right{border-style:solid;border-color:var(--good);background:#f2fbf3}
.builtline.wrong{border-style:solid;border-color:var(--bad)}
.builtline .placeholder{color:var(--muted);font-size:11.5px}

/* ---------- карта модальных ---------- */
.maprow{display:grid;grid-template-columns:124px minmax(0,1.1fr) minmax(0,1.3fr);gap:10px;
  padding:3px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.38;align-items:baseline}
.maprow:last-child{border-bottom:0}
.maprow b.modal{font-family:Rubik,sans-serif;font-size:13.5px;font-weight:800;letter-spacing:-.02em;
  background:var(--lime);border-radius:8px;padding:1px 8px;display:inline-block}
.maprow .ex{color:var(--ink)}
.maprow s{opacity:.55}
.traprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.traprow:last-child{border-bottom:0}
.traprow .opts{display:flex;gap:4px;flex:0 0 auto}
.traprow .opts button{font-size:10px;padding:3px 10px}
.clientgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.clientgrid .card{padding:10px 12px}
.clientgrid b{font-family:Rubik,sans-serif;font-size:12.5px;display:block}
.must{display:inline-block;background:var(--lime);border-radius:7px;padding:0 7px;
  font-family:Rubik,sans-serif;font-weight:700;font-size:11px;margin:4px 0}

/* ---------- чтение ---------- */
.passage{font-size:12.5px;line-height:1.55}
.passage p{margin:0 0 7px}
.passage.twocol{columns:2;column-gap:20px}
.passage.twocol p{break-inside:avoid}
.tfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:4px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.tfrow:last-child{border-bottom:0}
.tfrow .opts{display:flex;gap:4px}
.tfrow .opts button{font-size:10px;padding:3px 11px}
.matchgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.classcard{border:1.5px solid var(--line);border-radius:13px;padding:7px 10px;margin-bottom:6px;
  font-size:11px;background:var(--card)}
.classcard b{font-family:Rubik,sans-serif;font-size:11px;letter-spacing:.04em;display:block;margin-bottom:2px}
.clientrow{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:9px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.clientrow:last-child{border-bottom:0}
.clientrow select{padding:4px 8px;border-radius:9px;font-size:11px}

/* ---------- ролевые, письмо, домашка ---------- */
.rolecard{border:1.5px solid var(--pink-line);border-radius:16px;padding:11px 13px;background:var(--card)}
.rolecard h3{font-family:Rubik,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  margin:0 0 6px;color:var(--pink-deep)}
.rolecard ol{font-size:11.5px;margin:0 0 7px}
.wordcount{display:inline-block;font-size:10.5px;padding:2px 10px;border:1px solid var(--pink-line);
  border-radius:999px;background:var(--card)}
.homeworkbanner{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:6px 15px;background:var(--lime);border-radius:14px;margin:6px 0 9px}
.homeworkbanner b{font-family:Rubik,sans-serif;letter-spacing:.14em;font-size:11px}
.hwgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.hwgrid .card{padding:10px 12px}
.hwgrid .traprow{padding:3px 0;font-size:10.5px;gap:7px}
.hwgrid .traprow .opts button{font-size:9.5px;padding:2px 8px}
.resource{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px}
.resource h2{font-size:13px;margin-bottom:4px;line-height:1.2}
.resource p{margin:0 0 5px;font-size:11px}
.resource a{margin-top:auto;font-size:11.5px}
.resultrow{display:flex;gap:14px;justify-content:space-between;padding:4px 0;
  border-bottom:1px solid var(--line);font-size:11px}
.resultrow:last-child{border-bottom:0}
.reportpreview{font:10.5px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-word;margin:6px 0;padding:8px 10px;background:var(--card);
  border:1.5px solid #d8ee8a;border-radius:12px;max-height:168px;overflow:auto}

/* ---------- маршрут урока ---------- */
.roadmap{position:relative;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));padding:7px 0 3px}
.rm-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:0;border-radius:13px;padding:0 4px 7px;text-align:center;
  font-family:inherit;font-weight:400;color:inherit;line-height:1.25}
.rm-step:hover{background:var(--pink-soft);transform:none}
.rm-step:not(:last-child):after{content:'';position:absolute;top:22px;height:3px;border-radius:3px;
  left:calc(50% + 22px);right:calc(-50% + 22px);background:var(--line)}
.rm-step.done:not(:last-child):after{background:var(--lime-deep)}
.rm-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);
  border:2px solid var(--pink-line);font-family:Rubik,sans-serif;font-size:13px;font-weight:800;
  line-height:1;font-variant-numeric:tabular-nums}
.rm-step.done .rm-dot{background:var(--lime);border-color:var(--lime-deep)}
.rm-step.here .rm-dot{background:var(--pink);border-color:var(--pink);color:#fff;
  box-shadow:0 0 0 4px rgba(255,61,139,.22)}
.rm-name{font-size:11.5px;font-weight:800;letter-spacing:-.01em;min-height:2.5em;
  display:flex;align-items:center}
.rm-meta{font-size:9px;color:var(--muted);letter-spacing:.3px;font-variant-numeric:tabular-nums}
.rm-weight{width:66%;height:4px;border-radius:3px;background:var(--pink-soft);overflow:hidden}
.rm-weight span{display:block;height:100%;background:var(--pink);border-radius:3px}

/* ---------- обложка ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:center}
.covertitle{font-family:Rubik,sans-serif;font-size:62px;font-weight:800;letter-spacing:-.05em;
  line-height:.92;margin:0 0 10px}
.covertitle em{font-style:normal;color:var(--pink)}
.coverart{border-radius:22px;overflow:hidden;background:var(--lime-soft);border:1.5px solid #e0f2a6}
.coverart svg{display:block;width:100%;height:auto}

/* ---------- вспомогательное ---------- */
.drawer{position:fixed;top:0;bottom:0;left:0;width:330px;max-width:90vw;background:var(--card);
  padding:20px;z-index:50;box-shadow:12px 0 60px rgba(28,16,24,.2);transform:translateX(-115%);
  transition:transform .2s;overflow:auto}
.drawer.open{transform:none}
.drawer nav{display:grid;gap:4px;margin-top:18px}
.drawer nav button{text-align:left;border:0;background:transparent;padding:6px 11px;font-size:11.5px;
  border-radius:11px;font-weight:500}
.drawer nav button.active{background:var(--lime);font-weight:700}
.drawer nav span{font-size:10px;display:inline-block;width:26px;color:var(--muted)}
.toast{position:absolute;bottom:46px;left:50%;transform:translate(-50%,20px);opacity:0;
  pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:7px 15px;
  z-index:80;max-width:80%;text-align:center;font-size:11.5px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-15px;width:9px;height:14px;z-index:99;border-radius:2px;
  animation:fall 1.5s forwards;pointer-events:none}
body.still *,body.still *:before,body.still *:after{animation:none!important;transition:none!important}
body.still .confetti{display:none}
@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(105vh) rotate(430deg);opacity:0}}

/* ---------- узкий экран: слой презентации разворачивает сцену в страницу ---------- */
@media(max-width:850px){
  .controlbar{height:auto;flex-wrap:wrap;gap:8px;padding:8px 16px}
  /* на телефоне подсказка должна быть над фигурой, иначе до неё надо
     прокручивать, а потом возвращаться наверх, чтобы ткнуть в зону */
  .mirror{display:flex;flex-direction:column}
  .mirror>.cuecard{order:1}
  .mirror>.figure{order:2;width:100%;max-width:215px;margin:0 auto}
  .mirror>.saycard{order:3}
  .stage{padding:14px 16px}.footer{padding:0 16px}
  .two,.three,.four,.mirror,.sprint,.matchgrid,.scorewrap,.cover{grid-template-columns:1fr}
  .wordgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clientgrid,.hwgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .passage.twocol{columns:1}
  .testq{grid-template-columns:20px minmax(0,1fr);row-gap:5px}
  .testq select{grid-column:2}
  .covertitle{font-size:40px}
  .roadmap{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:12px}
  .rm-step:not(:last-child):after{display:none}
}
@media(max-width:480px){
  .wordgrid,.clientgrid,.hwgrid{grid-template-columns:1fr}
  .gapline{flex-wrap:wrap}.gapline input{flex:1 1 100%;width:100%}
  .tfrow,.traprow{grid-template-columns:1fr;row-gap:5px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ---------- Present Simple и if 0/1 ---------- */
.spellrow{display:grid;grid-template-columns:150px 54px minmax(0,1fr);gap:10px;align-items:baseline;
  padding:5px 0;border-bottom:1px solid var(--pink-line);font-size:12px}
.spellrow:last-child{border-bottom:0}
.spellrow:has(>:nth-child(2):last-child){grid-template-columns:190px minmax(0,1fr)}
.freqrow{display:grid;grid-template-columns:96px minmax(0,1fr) 128px;gap:10px;align-items:center;padding:4px 0}
.freqrow b{font-family:Rubik,sans-serif;font-size:13.5px}
.freqbar{height:14px;border-radius:999px;background:var(--pink-soft);border:1.5px solid var(--pink-line);overflow:hidden}
.freqbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lime));border-radius:999px}
.gossip{padding:6px 0;border-bottom:1px solid var(--pink-line);font-size:13px;line-height:1.7}
.gossip:last-of-type{border-bottom:0}
.gossip .small{display:block;line-height:1.35}
.slotchip{margin:0 4px;padding:1px 12px;font-weight:800;background:var(--card);border-color:var(--pink)}
.slotchip.empty{color:var(--pink);border-style:dashed}
.gossip.right .slotchip{background:#eaf7ec;border-color:var(--good)}
.gossip.wrong .slotchip{background:#fdeaec;border-color:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:9px 0}
.week span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:13px;
  background:var(--card);border:1.5px solid var(--pink-line)}
.week span.on{background:var(--lime-soft);border-color:var(--lime-deep)}
.week i{font-style:normal;font-size:9.5px;color:var(--muted);font-weight:700}
.week b{font-size:21px;line-height:1.1;min-height:23px;color:var(--muted)}
.saysit u{text-decoration:none;color:var(--pink-deep);border-bottom:2px solid var(--pink)}
.advchip{display:inline-block;margin:6px 0 8px;padding:4px 16px;border-radius:999px;background:var(--lime);
  font-family:Rubik,sans-serif;font-weight:800;font-size:15px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.still .advchip{animation:none}
.slotline{display:flex;flex-wrap:wrap;align-items:center;gap:3px 2px;font-size:16px;font-weight:700;margin:4px 0 8px}
.slotline .w{padding:2px 1px}
.gapbtn{padding:0;width:24px;height:24px;font-size:13px;line-height:1;border-style:dashed;color:var(--pink-deep);background:var(--card)}
.dropped{color:var(--good);background:#eaf7ec;padding:1px 8px;border-radius:999px}
.dropped.miss{color:var(--bad);background:#fdeaec}
.reels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0}
.reel{display:flex;flex-direction:column;align-items:stretch;gap:5px}
.reel>button{padding:3px 0}
.reelwin{min-height:76px;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 11px;
  border-radius:16px;background:var(--card);border:2px solid var(--pink);font-size:14px;font-weight:700;line-height:1.3}
.reelwin i{font-style:normal;color:var(--pink-deep);margin-right:4px}
.factlist{margin:6px 0;font-size:11.5px}
.factlist p{margin:0 0 3px;color:var(--good)}
.domino{display:flex;flex-direction:column;gap:6px;margin:0 0 9px}
.tile{position:relative;padding:7px 12px 7px 30px;border-radius:12px;background:var(--card);
  border:1.5px solid var(--pink-line);font-size:12px;font-weight:600}
.tile:before{content:'⁘';position:absolute;left:11px;top:6px;color:var(--pink)}
.tile.last{border-color:var(--pink);box-shadow:3px 3px 0 var(--pink-line)}
.bugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.bug{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:14px;
  padding:7px 11px;font-size:12px;font-weight:600;line-height:1.35;background:var(--card)}
.bug.hit{background:#fff0c7;border-color:#e0a800}
.bug.right{background:#eaf7ec;border-color:var(--good)}
.bug.wrong{background:#fdeaec;border-color:var(--bad)}
.bug .small{color:var(--good);font-weight:700}
.resultgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.resultgrid .resultrow{font-size:11px}
/* ---------- меню ---------- */
.menubtn{background:var(--lime);border-color:var(--lime);color:#243000;font-weight:800}
.shade{position:fixed;inset:0;background:rgba(28,16,24,.38);z-index:49;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.open{opacity:1;pointer-events:auto}
.drawerhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-20px;
  margin:-20px -20px 0;padding:14px 20px 10px;background:var(--card);border-bottom:1.5px solid var(--line);z-index:1}
.drawerhead b{font-family:Rubik,sans-serif;font-size:16px}
.drawerhead button{width:34px;height:34px;padding:0;font-size:18px;line-height:1}
.drawer nav{gap:10px}
.menugroup{display:grid;gap:2px;padding:6px;border-radius:14px}
.menugroup.here{background:var(--pink-soft)}
.menuhead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 11px 4px}
.menuhead b{font-family:Rubik,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink-deep)}
.menuhead .small{white-space:nowrap}
.rulebtn{margin-left:auto;padding:2px 11px;font-size:10px;letter-spacing:0;text-transform:none;font-weight:700;
  background:var(--lime);border-color:var(--lime-deep)}
.practicecard{background:var(--ink);border-color:var(--ink)}
.practicecard .tag{color:#d9c3d0}
.practicecard .buttons{margin-bottom:0}
.practicecard button{font-size:11px;padding:4px 12px}
.practicecard{padding:8px 12px}
.practicecard .buttons{margin:0;gap:5px}
.practicecard .tag{margin-right:4px}
.practicecard button{font-size:10.5px;padding:3px 10px}
/* ---------- отправка Ане ---------- */
.tgbtn{background:#229ed9;border-color:#229ed9;color:#fff;font-weight:800}
.tgbtn:hover{background:#1b86b8;border-color:#1b86b8}
.sendrow{justify-content:flex-end;margin-top:8px}
/* ==========================================================================
   Вертикальный кадр 420 × 910. Правила висят на классе portrait, а не на
   медиазапросе: медиазапрос смотрит на окно браузера, а кадр остаётся узким
   и в широком окне. Оглавление слева в такую ширину не помещается, сетки
   в две-четыре колонки превращаются в кашу — то и другое чинится здесь.
   ========================================================================== */
.portrait .deck-stage{grid-template-columns:minmax(0,1fr)}
.portrait .deck-rail{display:none}
.portrait .stage{padding:14px 16px 12px}
.portrait .controlbar{padding:0 16px}
.portrait .footer{padding:0 16px}
.portrait h1{font-size:23px}
.portrait .two,.portrait .three,.portrait .four,
.portrait .mirror,.portrait .sprint,.portrait .matchgrid,
.portrait .scorewrap,.portrait .cover,.portrait .clientgrid,.portrait .hwgrid{
  display:block}
.portrait .grid>*+*,.portrait .clientgrid>*+*{margin-top:11px}

LK", "en": "This is too heavy for me.", "ru": "Это слишком тяжело.", "def": "Your client says this. It is about the weight, not about giving up."}, {"cat": "TALK", "en": "Let’s take a short break.", "ru": "Давай сделаем небольшой перерыв.", "def": "You say this between sets, or when the client is losing form."}, {"cat": "TALK", "en": "You’re doing great.", "ru": "У тебя отлично получается.", "def": "You say this to keep a tired client going."}], "cats": {"MOVE": "Movement", "HOLD": "Hold & breathe", "BODY": "Body", "KIT": "Kit & class", "TALK": "Coach talk"}, "test": {"grammar": [["I ___ a fitness trainer.", ["am", "is", "are"], 0, "A1", "I → am. Вторая форма be, самая частая ошибка в первой же фразе о себе."], ["She ___ to the gym every morning.", ["go", "goes", "going"], 1, "A1", "He / she / it в Present Simple забирает -s: she goes."], ["There are two ___ on the floor.", ["mat", "mats", "matses"], 1, "A1", "two → множественное число, просто -s: mats."], ["___ you swim?", ["Do", "Can", "Are"], 1, "A1", "Про умение спрашиваем через can: Can you swim?"], ["This is ___ mat, not yours.", ["my", "me", "mine"], 0, "A1", "Перед существительным стоит my. Mine — без существительного: This mat is mine."], ["The class starts ___ 7 o’clock.", ["in", "on", "at"], 2, "A1", "С точным временем — at: at 7 o’clock, at half past six."], ["Yesterday we ___ for forty minutes.", ["run", "ran", "runned"], 1, "A2", "Run — неправильный глагол: run – ran – run. Формы runned не существует."], ["Look! She ___ a very heavy kettlebell.", ["lifts", "is lifting", "lift"], 1, "A2", "Look! — действие прямо сейчас, значит Present Continuous: is lifting."], ["This dumbbell is ___ than that one.", ["heavy", "heavier", "more heavy"], 1, "A2", "Короткие прилагательные получают -er: heavier. More heavy не говорят."], ["How ___ water do you drink a day?", ["many", "much", "lot"], 1, "A2", "Water не считают по штукам, поэтому much."], ["I ___ start a new programme next week.", ["am going to", "go to", "wi
