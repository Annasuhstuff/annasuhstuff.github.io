lves", "wrists"], 0, "A1", "Abs — пресс. Calves — икры, wrists — запястья."], ["You ___ your knees when you squat.", ["straighten", "bend", "swing"], 1, "A1", "В приседе колени сгибаются: bend."], ["A strong rubber band that makes a movement harder is a ___.", ["resistance band", "treadmill", "locker"], 0, "A2", "Resistance band — резинка, эспандер."], ["Easy movement at the start of a session is a ___.", ["cool-down", "warm-up", "set"], 1, "A2", "Warm-up — разминка. Cool-down — заминка в конце."], ["“Stay in this position and don’t move.” The coach says: ___", ["Hold it.", "Drop it.", "Push it."], 0, "A2", "Hold it — задержись, не двигайся."], ["A group of repetitions done one after another is a ___.", ["rep", "set", "session"], 1, "A2", "Rep — одно повторение, set — подход из нескольких повторений."], ["After sitting all day my lower ___ hurts.", ["back", "arm", "hand"], 0, "B1", "Lower back — поясница."], ["You should ___ your muscles after a hard session.", ["stretch", "stress", "strengthen"], 0, "B1", "После тяжёлой тренировки мышцы тянут: stretch."]], "reading": {"title": "A Monday at the studio", "text": ["Marta has worked at a small studio in Lisbon for six years. She teaches four groups a day and takes two private clients in the evening. “The hardest part is not the training,” she says. “It is explaining the same movement for the tenth time in a way that finally works for this particular person.”", "Her Monday group is made up of office workers. Most of them sit at a desk for eight hours, so Marta starts every session on the floor, with the spine and the hips, and only then moves on to weights. Nobody in that group lifts a barbell in the first three months.", "Two years ago Marta began teaching in English as well. Half of her clients are foreigners who have moved to Portugal for work. She says her English is still far from perfect, but her clients understand her, because she uses short sentences and shows every movement herself."], "items": [["How many private clients does Marta take in the evening?", ["Four", "Two", "Six"], 1], ["Why does she start the Monday session on the floor?", ["Because the group has no equipment", "Because those clients sit down all day", "Because the group is made up of beginners who are afraid of weights"], 1], ["What does Marta find hardest about her job?", ["Teaching four groups a day", "Working in the evening", "Finding an explanation that works for one particular person"], 2], ["Why do her foreign clients understand her English?", ["Her English is perfect", "She speaks simply and demonstrates everything", "They all speak Portuguese too"], 1]]}, "speaking": {"prompts": ["Tell me about your work: who your clients are and what a normal day looks like.", "Explain one exercise to me as if I were a complete beginner. I will do exactly what you say.", "A client says a movement hurts. What do you ask and what do you do?"], "cando": ["I can say a few sentences about myself and my work.", "I can describe a simple action step by step.", "I can ask a question when I do not understand.", "I can keep talking for a minute without stopping.", "I can explain why I do something, not only what I do."]}, "bands": [[0, 12, "A1", "Beginner / Elementary", "Знакомые слова узнаются, но фраза пока собирается с трудом. Начинаем с настоящего времени, вопросов и базовой лексики зала.", 0], [13, 19, "A2", "Pre-Intermediate", "Школьная база жива: простые фразы получаются, сложности начинаются во временах и в модальных. Это самый частый результат.", 0], [20, 26, "A2+ → B1", "Pre-Intermediate strong", "Простое даётся уверенно, длинная фраза пока разваливается. Работаем над временами, модальными и связками.", 1], [27, 32, "B1", "Intermediate", "Хватает на реальный разговор с клиентом. Дальше — точность, оттенки модальных и беглость.", 1], [33, 36, "B1+ / B2", "Intermediate strong", "Грамматика в целом на месте. Основная работа — лексика, естественность и скорость.", 2]]}, "zones": [["shoulder", "shoulder", "плечо", 64, 104, 14], ["elbow", "elbow", "локоть", 46, 166, 13], ["wrist", "wrist", "запястье", 34, 226, 12], ["spine", "spine", "позвоночник", 110, 120, 14], ["abs", "abs", "пресс", 110, 172, 14], ["core", "core", "мышцы кора", 110, 214, 14], ["lowerback", "lower back", "поясница", 140, 194, 13], ["hip", "hip", "бедро (сустав)", 142, 258, 13], ["glutes", "glutes", "ягодичные", 110, 268, 14], ["hamstring", "hamstrings", "задняя поверхность бедра", 86, 318, 14], ["knee", "knee", "колено", 86, 360, 13], ["calf", "calves", "икры", 86, 400, 13]], "mirror": [{"cues": [["Touch your shoulder.", "shoulder"], ["Bend your knee.", "knee"], ["Keep your back straight — show me your spine.", "spine"], ["Tighten your abs.", "abs"], ["This joint is your elbow.", "elbow"], ["Where are your calves?", "calf"], ["Point to your wrist.", "wrist"], ["Squeeze your glutes.", "glutes"]]}, {"cues": [["Don’t lock this joint when you straighten your leg.", "knee"], ["Engage this before you lift anything heavy.", "core"], ["Office workers feel pain here after eight hours at a desk.", "lowerback"], ["Pull your shoulder blades down and back — show me the joint.", "shoulder"], ["These muscles are at the back of your thigh.", "hamstring"], ["Keep this joint straight when you hold a plank, not bent.", "elbow"], ["This one takes the weight when you stand up from a squat.", "glutes"], ["If you hold the bar badly, this small joint hurts first.", "wrist"]]}, {"cues": [["A runner who never stretches will feel these tighten first.", "calf"], ["If the client rounds this, stop the set immediately.", "spine"], ["Without this working, every heavy lift goes into the lower back.", "core"], ["The joint that opens when you lunge forward.", "hip"], ["These are the muscles a cyclist uses to pull the pedal up.", "hamstring"], ["Where a desk worker holds all the tension from a bad week.", "shoulder"], ["The area that hurts when someone lifts with the legs straight.", "lowerback"], ["The joint you must keep soft, never fully locked.", "knee"]]}], "sprint": [{"seconds": 90, "cats": ["MOVE", "BODY"], "mode": "ru"}, {"seconds": 75, "cats": ["MOVE", "HOLD", "BODY", "KIT"], "mode": "def"}, {"seconds": 60, "cats": ["MOVE", "HOLD", "BODY", "KIT", "TALK"], "mode": "def"}], "build": [{"lines": ["Keep your back straight", "You must warm up first", "Hold it for five seconds", "You can use a lighter weight", "Don’t hold your breath", "We should stop for today"]}, {"lines": ["You have to book the first session", "You mustn’t lock your knees", "You don’t have to buy your own mat", "You should feel this in your glutes", "Could you slow down a little", "You need to breathe out on the effort"]}, {"lines": ["You’d better stop if it hurts", "After six weeks you’ll be able to hold a plank", "Your lower back might hurt tomorrow", "You don’t have to finish the last set", "Members have to wear indoor shoes in the studio", "You shouldn’t train the same muscle two days running"]}], "map": {"rule": "Модальный глагол не меняется по лицам и не берёт to: he must, she can, it might. После него — голый инфинитив: <b>must warm up</b>, а не <s>must to warm up</s>. Вопрос — перестановкой: <b>Can you hold it?</b>", "rows": [["must", "сильная необходимость, правило от меня самого", "You <b>must</b> warm up before you lift.", "Я так решила, это моё требование."], ["have to", "необходимость снаружи: правила зала, врач, расписание", "Members <b>have to</b> wear indoor shoes.", "Не я придумала — таковы правила."], ["need to", "это нужно сделать, мягче чем must", "You <b>need to</b> bend your knees a bit more.", "Самая частая фраза тренера."], ["don’t have to", "не обязательно, но можно", "You <b>don’t have to</b> buy your own mat.", "Свобода, а не запрет."], ["mustn’t", "нельзя, запрещено", "You <b>mustn’t</b> hold your breath.", "Запрет. Полная противоположность don’t have to."], ["should / shouldn’t", "совет", "You <b>should</b> drink more water.", "Я советую, но решаешь ты."], ["can / can’t", "умение и разрешение", "She <b>can</b> hold a plank for two minutes.", "Умею / можно."], ["could", "умел раньше, или вежливая просьба", "<b>Could</b> you slow down a bit?", "Вежливее, чем can."], ["may / might", "возможно, но не точно", "Your legs <b>might</b> hurt tomorrow.", "Might — меньше уверенности, чем may."], ["had better (’d better)", "серьёзное предупреждение", "You’<b>d better</b> stop if it hurts.", "Сильнее совета: иначе будет плохо."], ["be able to", "то же умение, но в любом времени", "In six weeks you’ll <b>be able to</b> do ten push-ups.", "Там, где can не поставить: will be able to, have been able to."]]}, "mgap": [{"bank": ["must", "can", "can’t", "should", "shouldn’t", "need to", "have to", "mustn’t"], "items": [["You ___ warm up before every session.", "must/need to/have to", "Разминка обязательна — любая форма необходимости подходит."], ["She ___ hold a plank for two minutes. She trains every day.", "can", "Умение — can."], ["You ___ drink more water during the session.", "should/need to", "Это совет."], ["I ___ lift this. It’s too heavy for me.", "can’t", "Не могу физически."], ["You ___ hold your breath when you lift.", "mustn’t/shouldn’t", "Запрет или сильный совет."], ["In this gym you ___ wear indoor shoes.", "have to/must", "Правило зала."], ["___ you show me that movement again?", "Can/Could", "Просьба."], ["You ___ train with a sore knee.", "mustn’t/shouldn’t", "Нельзя тренироваться на больном колене."], ["We ___ stop for today — you look exhausted.", "should/must/need to", "Совет, который почти решение."], ["He ___ swim, but he ___ run very well.", "can’t|can", "Два умения в одном предложении: не умеет — умеет."]]}, {"bank": ["must", "have to", "don’t have to", "mustn’t", "should", "shouldn’t", "need to", "could", "might"], "items": [["Members ___ book a place in the group class.", "have to/must/need to", "Правило студии."], ["You ___ bring your own mat — we have plenty.", "don’t have to", "Не обязательно, но можно."], ["You ___ eat a big meal right before training.", "mustn’t/shouldn’t", "Запрет или сильный совет."], ["Your legs ___ ache tomorrow. That’s normal.", "might/may/could", "Возможно, но не точно."], ["___ you hold the bar a bit wider, please?", "Could/Can", "Вежливая просьба."], ["You ___ pay for the first session. It’s free.", "don’t have to", "Бесплатно — значит не обязаны платить."], ["If you want results, you ___ come twice a week.", "need to/have to/must", "Необходимое условие."], ["You ___ train the same muscle two days running.", "shouldn’t/mustn’t", "Совет: мышце нужен отдых."], ["She ___ do a single push-up last year. Now she does twelve.", "couldn’t", "Не умела раньше — couldn’t."], ["We ___ change the programme if your knee still hurts.", "might/may/should", "Возможность или совет."]]}, {"bank": [], "items": [["You’d ___ stop now — your form has gone completely.", "better", "Had better: серьёзное предупреждение."], ["After three months she was ___ to lift her own body weight.", "able", "В прошлом времени can не ставится: was able to."], ["You ___ have told me about the knee before we started.", "should", "Should have + V3: упрёк о прошлом."], ["Clients ___ to sign a health form before the first session.", "have", "Правило: have to."], ["You ___ worry — a little muscle ache is normal.", "needn’t/don’t have to/shouldn’t", "Незачем волноваться."], ["He ___ be a beginner — look how he moves.", "can’t", "Уверенность в обратном: не может быть, чтобы он новичок."], ["She ___ be about forty, but she moves like a twenty-year-old.", "must/might/may", "Предположение о возрасте."], ["By June you’ll ___ able to run ten kilometres.", "be", "Will be able to."], ["You ___ not lift with a rounded spine. Ever.", "must", "Must not — категорический запрет."], ["I ___ train at six every morning, but now I prefer evenings.", "used to", "Регулярно в прошлом, сейчас нет."]]}], "mchoice": [{"items": [["The gym has a rule about shoes. You tell a new client:", ["You have to wear indoor shoes.", "You should wear indoor shoes.", "You can wear indoor shoes."], 0, "Правило зала, не твоё мнение → have to."], ["Your client never drinks during a session. You think it is a bad idea:", ["You mustn’t drink water.", "You should drink some water.", "You have to drink water."], 1, "Это твой совет → should."], ["A client asks if she can bring a friend. It is allowed:", ["You can bring a friend.", "You must bring a friend.", "You should bring a friend."], 0, "Разрешение → can."], ["The client’s knees go past her toes in a squat. You want it changed now:", ["You might sit back a little.", "You need to sit back a little.", "You could sit back a little."], 1, "Нужно сейчас и по делу → need to."], ["The doctor told your client not to lift heavy weights:", ["She shouldn’t lift heavy weights.", "She can’t lift heavy weights.", "She mustn’t lift heavy weights."], 2, "Запрет от врача → mustn’t."], ["Your client asks whether she needs a personal mat:", ["You don’t have to bring one.", "You mustn’t bring one.", "You shouldn’t bring one."], 0, "Не обязательно → don’t have to."], ["You want your client to speed up, politely:", ["You must go faster.", "Could you go a bit faster?", "You have to go faster."], 1, "Вежливая просьба → could."], ["The client has done twelve reps and is shaking:", ["You can do one more.", "We should stop here.", "You don’t have to be tired."], 1, "Форма поплыла — совет остановиться."]]}, {"items": [["A client with high blood pressure asks about heavy lifting:", ["You mustn’t lift very heavy weights.", "You don’t have to lift very heavy weights.", "You shouldn’t be able to lift very heavy weights."], 0, "Медицинское противопоказание — запрет, не рекомендация."], ["The studio booking system is full for Tuesday:", ["You can come on Tuesday.", "You could come on Tuesday.", "You can’t come on Tuesday."], 2, "Мест нет — невозможно."], ["A beginner wants to train six days a week:", ["You mustn’t train six days a week.", "You shouldn’t train six days a week at the beginning.", "You don’t have to train six days a week."], 1, "Не запрет, а совет для новичка."], ["Your client asks if the first session is paid:", ["You mustn’t pay for it.", "You don’t have to pay for it.", "You shouldn’t pay for it."], 1, "Бесплатно → не обязана платить."], ["You are not sure whether the ache is normal:", ["It must be normal.", "It might be normal, but let’s check tomorrow.", "It has to be normal."], 1, "Неуверенность → might."], ["You are completely sure the client is exhausted, you can see it:", ["She might be tired.", "She must be tired.", "She should be tired."], 1, "Уверенное предположение → must be."], ["The client keeps holding her breath under the bar:", ["You don’t have to hold your breath.", "You mustn’t hold your breath.", "You couldn’t hold your breath."], 1, "Опасно → запрет."], ["A client wants to stop the last set. Nothing hurts, she is just tired:", ["You mustn’t stop.", "You don’t have to finish it, but I think you can.", "You shouldn’t be tired."], 1, "Выбор за ней, но тренер поддерживает."]]}, {"items": [["A client returns after a knee operation. The surgeon allowed light work only:", ["She doesn’t have to do heavy squats.", "She mustn’t do heavy squats yet.", "She shouldn’t have done heavy squats."], 1, "Ограничение врача, действующее сейчас → mustn’t."], ["Your client trained through sharp pain last week. You comment on it now:", ["You mustn’t train through sharp pain.", "You shouldn’t have trained through sharp pain.", "You didn’t have to train through sharp pain."], 1, "Событие в прошлом, которого не стоило делать → shouldn’t have + V3."], ["A client paid for ten sessions but came only to eight. The other two do not expire:", ["She mustn’t use them later.", "She doesn’t have to use them this month.", "She shouldn’t use them this month."], 1, "Нет обязанности успеть → doesn’t have to."], ["Looking at her form, you are almost certain she has done Pilates before:", ["She must have done Pilates before.", "She had to do Pilates before.", "She should have done Pilates before."], 0, "Уверенное предположение о прошлом → must have + V3."], ["Warning a client who insists on one more heavy rep:", ["You’d better stop there.", "You don’t have to stop there.", "You may stop there."], 0, "Серьёзное предупреждение → had better."], ["Talking about what will be possible in three months:", ["You can run ten kilometres.", "You will be able to run ten kilometres.", "You must run ten kilometres."], 1, "Умение в будущем → will be able to."], ["A client asks whether protein powder is necessary for her goal:", ["You mustn’t take it.", "You don’t need to take it — food is enough.", "You shouldn’t be able to take it."], 1, "Не нужно, но не запрещено."], ["She managed one difficult set yesterday, despite the doubt:", ["She could finish it.", "She was able to finish it.", "She must finish it."], 1, "Единичный успех в прошлом → was able to, не could."]]}], "mtrap": [{"note": "Русское «не надо» — это две разные вещи. <b>mustn’t</b> = нельзя, запрещено. <b>don’t have to</b> = не обязательно, можно не делать.", "items": [["You ___ come tomorrow — the class is cancelled.", 1], ["You ___ hold your breath under the bar. It’s dangerous.", 0], ["You ___ buy special clothes for the first session.", 1], ["You ___ touch that machine — it’s broken.", 0], ["You ___ pay today, you can pay at the end of the month.", 1], ["You ___ eat right before a heavy session.", 0], ["You ___ stay until the end if you feel unwell.", 1], ["Children ___ use the weights room alone.", 0]]}, {"note": "Русское «не надо» — это две разные вещи. <b>mustn’t</b> = нельзя, запрещено. <b>don’t have to</b> = не обязательно, можно не делать. Третий вариант — <b>shouldn’t</b>: не запрет, а совет.", "items": [["You ___ lift with a rounded back. Never.", 0], ["You ___ book the open gym — you can just come in.", 1], ["You ___ train the same muscle group two days running.", 2], ["You ___ use your phone in the changing room.", 0], ["You ___ do the last set if your form has gone.", 1], ["You ___ compare yourself with the person next to you.", 2], ["You ___ drink alcohol before a session. It’s a safety rule here.", 0], ["You ___ be able to do everything on day one.", 1]]}, {"note": "Три уровня отрицания: <b>mustn’t</b> — запрет, <b>don’t have to</b> — не обязательно, <b>shouldn’t</b> — не советую. Выбирай по тому, кто решает: правило, свобода или мнение.", "items": [["Members ___ bring outdoor shoes into the studio. It’s in the contract.", 0], ["You ___ apologise for needing a longer break.", 1], ["You ___ ignore pain that gets worse during the movement.", 0], ["You ___ tell me about every ache — but it helps if you do.", 1], ["You ___ start with the heaviest weight you can manage.", 2], ["Under sixteens ___ train here without an adult.", 0], ["You ___ finish the programme in exactly eight weeks.", 1], ["You ___ skip the cool-down just because you’re in a hurry.", 2]]}], "mcoach": [{"clients": [["Olga, 34", "First time in a gym. Very nervous.", "should"], ["Pavel, 19", "Strong, but lifts far too fast.", "need to"], ["Irina, 52", "Her doctor said: no jumping.", "mustn’t"], ["Dima, 28", "Asks if he has to buy a membership today.", "don’t have to"], ["Lena, 41", "Wants to know the rules of the studio.", "have to"]]}, {"clients": [["Olga, 34", "First time in a gym. Afraid of the weights room.", "should"], ["Pavel, 19", "Lifts fast and holds his breath every rep.", "mustn’t"], ["Irina, 52", "Knee replacement two years ago. Cleared for light work.", "can / can’t"], ["Dima, 28", "Missed two weeks. Wants to go straight back to his old weights.", "had better"], ["Lena, 41", "Worried she will never keep up with the group.", "will be able to"], ["Sergey, 60", "Asks whether he has to come twice a week to see results.", "don’t have to"]]}, {"clients": [["Olga, 34", "Trains well with you, but does nothing between sessions.", "need to"], ["Pavel, 19", "Trained through a sharp shoulder pain last week.", "shouldn’t have"], ["Irina, 52", "Cleared for light work, but keeps adding weight when you look away.", "mustn’t"], ["Dima, 28", "Convinced that protein powder is compulsory.", "don’t have to"], ["Lena, 41", "Moves like someone with years of Pilates behind her.", "must have"], ["Sergey, 60", "Nervous about what he will manage in three months.", "will be able to"]]}], "listen1": [{"title": "A new client at the desk", "script": [["A", "Hi, good morning. Is this the right place for the beginner class?"], ["B", "Good morning! Yes, it is. Have you been here before?"], ["A", "No, never. It’s my first time in a gym, actually."], ["B", "That’s fine. The beginner class is at six on Monday and Thursday. It lasts fifty minutes."], ["A", "Do I have to bring anything?"], ["B", "No, you don’t. We have mats and small weights. Just bring water and clean indoor shoes."], ["A", "And what about the price?"], ["B", "The first session is free. After that it’s twelve euros, or eighty for ten sessions."], ["A", "Great. Can I start on Monday?"], ["B", "Of course. But you must book it — we only take eight people."]], "items": [["When is the beginner class?", ["Monday and Thursday", "Monday and Friday", "Every day"], 0], ["How long does it last?", ["Forty minutes", "Fifty minutes", "An hour"], 1], ["What must she bring?", ["A mat and weights", "Water and indoor shoes", "Nothing"], 1], ["How much is one session after the first one?", ["Eight euros", "Twelve euros", "Eighty euros"], 1], ["Why must she book the class?", ["It is free", "The group is small", "It is very popular on Monday"], 1], ["Has she trained in a gym before?", ["Yes, years ago", "No, never", "Only at home"], 1]]}, {"title": "A first consultation", "script": [["B", "So, before we start, tell me a little about yourself. What do you do?"], ["A", "I work in an office. I sit at a desk for about nine hours a day."], ["B", "Nine hours. And do you do any sport at the moment?"], ["A", "I used to swim twice a week, but I stopped about two years ago."], ["B", "Any injuries I should know about?"], ["A", "My lower back hurts sometimes. Not always — mostly after a long week."], ["B", "Right. Then we won’t do anything heavy today. We’ll start on the floor and see how your hips move."], ["A", "I was hoping to lose some weight, to be honest."], ["B", "You will, but not from one session. You need to come twice a week and sleep properly. The training is the easy part."], ["A", "That’s fair. How soon will I see something?"], ["B", "Six to eight weeks, if you’re consistent. Your clothes will tell you before the scales do."]], "items": [["How long does she sit at a desk every day?", ["About seven hours", "About nine hours", "About eleven hours"], 1], ["What sport did she do in the past?", ["Running", "Swimming", "Nothing at all"], 1], ["When does her lower back hurt?", ["Every morning", "After a long week", "Only when she trains"], 1], ["Why won’t they do anything heavy today?", ["Because she is a complete beginner", "Because of her back", "Because there is no equipment free"], 1], ["What does the trainer say is the easy part?", ["Sleeping properly", "Coming twice a week", "The training itself"], 2], ["How will she notice the first results?", ["On the scales", "From her clothes", "From her photos"], 1]]}, {"title": "A difficult conversation", "script": [["A", "I want to be honest with you. I’ve been training for four months and I look exactly the same."], ["B", "You don’t look the same to me, but I understand the feeling. Can I ask you something first?"], ["A", "Go ahead."], ["B", "In those four months, how many sessions have you actually done?"], ["A", "I don’t know. Maybe twenty? I missed a lot in January."], ["B", "Twenty in four months is about one a week. With one session a week you can get stronger, and you have — your squat has gone up by fifteen kilos. But the shape of your body is mostly built in the kitchen and in bed."], ["A", "So you’re saying it’s my fault."], ["B", "No. I’m saying the plan we made assumed three sessions a week, and life gave you one. That’s not a failure, that’s information. We should change the plan, not the person."], ["A", "What would that look like?"], ["B", "Two short sessions here, twenty minutes of walking on the other days, and we stop weighing you every Monday. You might hate the last part."], ["A", "I definitely will."]], "items": [["How many sessions has she done in four months?", ["About twelve", "About twenty", "About forty"], 1], ["What has clearly improved?", ["Her weight", "Her squat", "Her sleep"], 1], ["What does the trainer say builds the shape of the body?", ["The training", "Food and sleep", "Walking"], 1], ["How does the trainer react to “it’s my fault”?", ["He agrees carefully", "He blames the plan, not her", "He changes the subject"], 1], ["What is the new plan?", ["Three sessions a week", "Two short sessions and walking", "One long session and a diet"], 1], ["Which part will she hate?", ["The walking", "The short sessions", "Not weighing herself"], 2]]}], "listen2": [{"title": "Follow the instruction", "script": [["B", "Right, let’s do this one together. First, stand with your feet under your shoulders. Then bend your knees a little and keep them soft. Now put your hands on your hips. Breathe in, and slowly lean forward from the hips, not from the back. Hold it there for five seconds. And finally, come back up slowly and breathe out. Don’t round your back at any point. And don’t lock your knees when you come up."]], "steps": ["Stand with your feet under your shoulders.", "Bend your knees a little.", "Put your hands on your hips.", "Breathe in and lean forward from the hips.", "Hold it for five seconds.", "Come back up slowly and breathe out."], "forbidden": [["Round your back.", true], ["Lock your knees on the way up.", true], ["Look at the floor.", false], ["Hold your breath.", false]]}, {"title": "Follow the instruction", "script": [["B", "OK, this one is a bit harder, so listen to the whole thing first. Start on all fours, with your wrists under your shoulders and your knees under your hips. Tuck your chin in slightly, so your neck stays long. Now engage your core — imagine someone is about to poke you in the stomach. Breathe out and slowly reach your right arm forward and your left leg back, until they are in line with your body. Hold it for three seconds, and feel it in your glutes, not in your lower back. Then come back down with control and change sides. You mustn’t let your hips turn to one side. And don’t rush it — two slow reps are worth ten fast ones."]], "steps": ["Start on all fours, wrists under shoulders.", "Tuck your chin in so the neck stays long.", "Engage your core.", "Breathe out and reach the opposite arm and leg out.", "Hold for three seconds.", "Come back down with control and change sides."], "forbidden": [["Let your hips turn to one side.", true], ["Rush through the reps.", true], ["Keep your neck long.", false], ["Feel it in your glutes.", false]]}, {"title": "Follow the instruction", "script": [["B", "This is the version I give to people who already know what they’re doing, so I’ll say it once. Set the bar at about hip height and stand close enough to touch it with your shins. Take a breath, brace as if you’re holding that breath behind a belt, and push the floor away — don’t pull the bar with your arms. Keep the bar travelling in a straight line up the front of your legs. Lock out at the top by squeezing your glutes, not by leaning back. Then lower it under control, with the hips going back first, not the knees bending first. You mustn’t lose that brace halfway up, and you’d better not drop the bar from the top in this studio — the neighbours downstairs have complained twice already."]], "steps": ["Set the bar at hip height and stand close to it.", "Take a breath and brace your core.", "Push the floor away instead of pulling with the arms.", "Keep the bar travelling in a straight line.", "Lock out at the top by squeezing the glutes.", "Lower it with the hips going back first."], "forbidden": [["Lose the brace halfway up.", true], ["Drop the bar from the top.", true], ["Squeeze your glutes at the top.", false], ["Keep the bar close to your legs.", false]]}], "reading1": [{"title": "The trainer nobody photographs", "opts": ["True", "False"], "text": ["Ben works in a small gym in Manchester. He is fifty-one, he has never posted a photo of himself on the internet, and he has more clients than any other trainer in the building.", "Most of his clients are over forty. Some of them come to him after an injury, others simply because their doctor told them to move more. Ben always starts in the same way: he asks them what they want to be able to do in a year. Nobody answers with a number on the scales. They say things like “carry my shopping up three floors” or “play with my grandchildren on the floor and get up again”.", "He writes every programme by hand in a paper notebook. He says a phone in the hand makes people train worse. His clients train twice a week, and he never gives them more than six exercises in one session."], "items": [["Ben is more than fifty years old.", 0, "Первый абзац: he is fifty-one."], ["Ben posts photos of his training on the internet.", 1, "He has never posted a photo of himself."], ["Most of Ben’s clients are young.", 1, "Most of his clients are over forty."], ["Some clients come to Ben because a doctor advised it.", 0, "…others simply because their doctor told them to move more."], ["His clients mostly talk about their weight.", 1, "Nobody answers with a number on the scales."], ["Ben uses an app to write programmes.", 1, "He writes every programme by hand in a paper notebook."], ["His clients train twice a week.", 0, "His clients train twice a week."]]}, {"title": "The trainer nobody photographs", "opts": ["True", "False", "Not given"], "text": ["Ben works in a small gym in Manchester. He is fifty-one, he has never posted a photo of himself on the internet, and he has more clients than any other trainer in the building. He does not advertise. New people arrive because somebody at work or at the school gate told them about him.", "Most of his clients are over forty. Some come to him after an injury, others because their doctor told them to move more. Ben always starts in the same way: he asks them what they want to be able to do in a year. Nobody answers with a number on the scales. They say things like “carry my shopping up three floors” or “play with my grandchildren on the floor and get up again”. Ben writes the answer at the top of the first page and shows it to them again when they want to give up.", "He writes every programme by hand in a paper notebook. He says a phone in the hand makes people train worse: the set becomes something to get through between messages. His clients train twice a week, and he never gives them more than six exercises in one session. “If you can’t remember your own programme,” he says, “it isn’t your programme.”", "He has never worked in a big chain gym and says he would not be able to. There, he explains, a trainer has to sell a package before the client has taken a single step."], "items": [["Ben spends money on advertising.", 1, "He does not advertise — новые клиенты приходят по рекомендации."], ["Ben earns more than the other trainers in his gym.", 2, "Сказано, что клиентов у него больше всех, о деньгах — ни слова."], ["His clients’ goals are usually about everyday actions.", 0, "Примеры целей: донести покупки, встать с пола."], ["Ben reminds clients of their goal when they lose motivation.", 0, "…shows it to them again when they want to give up."], ["Ben thinks phones make training worse.", 0, "He says a phone in the hand makes people train worse."], ["Ben gives his clients seven or eight exercises per session.", 1, "Never more than six."], ["Ben used to work in a big chain gym.", 1, "He has never worked in a big chain gym."]]}, {"title": "What a trainer is actually paid for", "opts": ["True", "False", "Not given"], "text": ["Ask ten people what a personal trainer does and nine will describe the same scene: someone counting repetitions while another person suffers. The counting is the visible part, and it is the least valuable one. An app can count.", "What the client is really paying for is a series of decisions taken in real time. Should this person add weight today, or has she slept four hours and come straight from a difficult meeting? Is that shaking in the last rep normal fatigue or the beginning of an injury? The same exercise, with the same client, can be exactly right on Tuesday and a bad idea on Thursday.", "There is a second, quieter part of the job that nobody puts on a certificate. Trainers hear things. A client who has been coming for two years will eventually say something about her marriage, her illness or her fear of getting old, usually somewhere between the second and third set. Knowing what to do with that — and what not to repeat — is not taught on any course.", "The industry is not comfortable with this. Qualifications are built around anatomy and programming, because those can be examined. The rest is called “soft skills”, as if it were a decoration. Experienced trainers tend to describe it the other way round: the anatomy is the entry ticket, and everything difficult starts after it."], "items": [["Counting repetitions is the most valuable thing a trainer does.", 1, "…it is the least valuable one."], ["A trainer’s decisions depend on the client’s state that day.", 0, "Пример со сном и тяжёлой встречей — про решение в моменте."], ["The same exercise can be right one day and wrong two days later.", 0, "…exactly right on Tuesday and a bad idea on Thursday."], ["Most clients talk about personal problems in the first month.", 2, "Сказано «after two years», про первый месяц — ничего."], ["Certificates include a section on handling personal conversations.", 1, "…nobody puts on a certificate; not taught on any course."], ["The author thinks “soft skills” is a good name for this part of the job.", 1, "«as if it were a decoration» — автор с названием не согласен."], ["Experienced trainers earn more than newly qualified ones.", 2, "О заработке в тексте не говорится."]]}], "reading2": [{"classes": [["A · MORNING MOBILITY", "45 minutes on the mat. Slow work for hips, spine and shoulders. No weights, no jumping. 7:30 a.m., before work."], ["B · STRONG START", "For complete beginners. Small groups of six. You learn five basic movements with very light weights."], ["C · LUNCH EXPRESS", "30 minutes, 12:30. Fast, sweaty, no equipment. Showers available. Come as you are."], ["D · POWER HOUR", "Heavy barbell work for experienced lifters. You must know the basic lifts already."], ["E · AFTER FIFTY", "Balance, bone strength and getting up off the floor. Gentle pace, friendly group, Tuesday afternoons."], ["F · KIDS & PARENTS", "Saturday mornings. Children from six years old train with one parent."]], "clients": [["Nina, 29", "Has never been to a gym. Wants someone to show her what to do, in a small group.", 1], ["Artem, 35", "Works in an office and has only a short break at midday. Needs a shower afterwards.", 2], ["Vera, 63", "Fell last winter and is afraid of falling again. Free during the day.", 4], ["Kirill, 26", "Has trained for five years and wants to lift heavy again.", 3], ["Masha, 38", "Sits all day, has a stiff back, and can only train before work.", 0]]}, {"classes": [["A · MORNING MOBILITY", "45 minutes on the mat at 7:30 a.m. Hips, spine and shoulders. No weights and no jumping at all — suitable after most injuries."], ["B · STRONG START", "Absolute beginners only, groups of six. Five basic movements, very light weights, lots of explanation. Evenings."], ["C · LUNCH EXPRESS", "30 minutes at 12:30. High intensity, bodyweight only, showers available. Not recommended in the first month of training."], ["D · POWER HOUR", "Barbell work for experienced lifters. Entry test required: you must show a correct squat, press and deadlift."], ["E · AFTER FIFTY", "Balance, bone strength and floor work. Tuesday and Friday afternoons. Doctor’s note needed after an operation."], ["F · RETURN", "For people coming back after a long break or an injury. One trainer for every three people. Saturday mornings."]], "clients": [["Nina, 29", "Has never trained. Works until six, so only evenings are possible. Wants to be told exactly what to do.", 1], ["Artem, 35", "Trains regularly, but has only 30 minutes at lunch. Needs to shower before going back to the office.", 2], ["Vera, 63", "Had a hip operation eighteen months ago, now cleared by her doctor. Afraid of falling.", 4], ["Kirill, 26", "Five years of lifting behind him, confident with a barbell, wants to go heavy.", 3], ["Masha, 38", "Stiff lower back from sitting. Starts work at nine. Was told to avoid jumping.", 0]]}, {"classes": [["A · MORNING MOBILITY", "7:30 a.m., 45 minutes on the mat. No weights, no impact. Often used as a second session in the same week."], ["B · STRONG START", "Absolute beginners, groups of six, evenings. Five movements, very light weights. You cannot join after week two of the block."], ["C · LUNCH EXPRESS", "12:30, 30 minutes, bodyweight, showers. High intensity — not for the first month, and not on a day when you also lift heavy."], ["D · POWER HOUR", "Barbell work. Entry test required. Places are released to the waiting list on Fridays."], ["E · AFTER FIFTY", "Balance, bone strength, floor work. Tuesday and Friday afternoons. Doctor’s note needed after an operation."], ["F · RETURN", "Coming back after a break or injury. One trainer per three people, Saturday mornings. Maximum eight weeks, then you move on to another class."]], "clients": [["Nina, 29", "Complete beginner. Free in the evenings, but the current beginner block started three weeks ago.", 5], ["Artem, 35", "Trains at lunch on Tuesdays and Thursdays. On Wednesdays he does his heavy barbell session.", 2], ["Vera, 63", "Hip operation eighteen months ago, doctor’s note in hand. Wants two sessions a week, one of them gentle and early.", 4], ["Kirill, 26", "Passed the entry test but the class was full. Checks the waiting list every week.", 3], ["Masha, 38", "Already does one mat session on Monday. Wants a second easy session, no impact, before work.", 0]]}], "roleplay": [{"setup": "You are the trainer. I am a new client. I speak English and I know nothing about the gym.", "cards": [["THE FIRST MINUTE", ["Greet me and ask my name.", "Ask two questions about my health.", "Tell me what we are going to do today."], ["Hi, I’m … . And you are…?", "Have you got any injuries?", "Today we’re going to …"]], ["ONE EXERCISE", ["Explain a squat to me step by step.", "Use at least three verbs from the word bank.", "Tell me one thing I must not do."], ["First, stand with your feet …", "Then bend …", "You mustn’t …"]], ["SOMETHING HURTS", ["I say my knee hurts. Ask me three questions.", "Decide what we do next.", "Say it kindly, but clearly."], ["Where exactly does it hurt?", "Does it hurt when you …?", "Let’s stop this one and …"]]], "swaps": ["Now you are the client and I am the trainer.", "Now do it again without looking at the phrases."]}, {"setup": "You are the trainer. I am a new client: polite, a bit anxious, and full of questions I read on the internet.", "cards": [["THE FIRST MINUTE", ["Greet me and take a short health history.", "Find out what I actually want in a year, not on the scales.", "Explain the plan for today in three sentences."], ["What would you like to be able to do in a year?", "Any injuries or operations I should know about?", "Today we’ll start with … , then … , and finish with …"]], ["ONE EXERCISE", ["Teach me a hip hinge or a lunge.", "Give one instruction with <b>need to</b> and one with <b>mustn’t</b>.", "Correct me twice without being rude."], ["You need to …", "You mustn’t …", "Almost — try it once more, nice and slow."]], ["THE INTERNET QUESTION", ["I ask whether I have to take protein powder.", "Answer with <b>don’t have to</b> and give a reason.", "I ask if I should train every day. Disagree politely."], ["You don’t have to … , because …", "I wouldn’t, and here’s why …", "It’s not dangerous, it’s just not necessary."]]], "swaps": ["Swap roles: I am the trainer and you are the client with the internet questions.", "Repeat card two with your phone face down."]}, {"setup": "You are the trainer. I am a client who has trained for a year, knows a lot, and is not always right.", "cards": [["THE DISAGREEMENT", ["I tell you that I trained through a sharp pain last week and it was fine.", "React with <b>shouldn’t have</b> — without making me defensive.", "Agree on one rule for next time."], ["I understand why you did, but you shouldn’t have …", "Here’s what worries me about it: …", "Can we agree that next time you …?"]], ["THE BAD NEWS", ["I want to go back to my old weights after three weeks off.", "Say no, using <b>had better</b> or <b>mustn’t</b>.", "Offer something instead, so I don’t leave disappointed."], ["You’d better …", "What I’d rather do today is …", "In two weeks you’ll be able to …"]], ["THE HONEST ANSWER", ["I ask why I look the same after four months.", "Give an honest answer without blaming me.", "Change the plan out loud, in three steps."], ["The plan assumed … , and life gave you …", "That’s not a failure, that’s information.", "So from Monday we’ll …"]]], "swaps": ["Swap roles and make the client harder than I did.", "Do one card again, but you have only sixty seconds."]}], "writing": [{"task": "Write a short message to a new client before her first session.", "must": ["say hello and when the session is", "say what she must bring", "say what she doesn’t have to bring", "finish in a friendly way"], "words": "40–60 words", "model": "Hi Anna! Just a quick reminder — our first session is on Tuesday at 6 p.m. You must bring clean indoor shoes and some water. You don’t have to bring a mat, we have everything here. See you on Tuesday! Kate"}, {"task": "Write a message to a client who has missed two weeks and wants to come back to her old programme.", "must": ["welcome her back", "explain with <b>have to</b> or <b>need to</b> what you will change", "use <b>don’t have to</b> once", "use <b>should</b> or <b>had better</b> once", "end with something encouraging"], "words": "60–80 words", "model": "Hi Anna, good to have you back! After two weeks off we need to start a little lighter — the body forgets faster than the head does. You don’t have to repeat the whole first block, but you’d better not go straight back to your old weights on Monday. Two easier sessions this week and we’ll be back where we were. See you at six! Kate"}, {"task": "Write to a client who trained through a sharp shoulder pain while you were away, and is proud of it.", "must": ["acknowledge the effort before the correction", "use <b>shouldn’t have</b> once", "use <b>mustn’t</b> or <b>had better</b> once", "give one clear rule for the future", "offer a specific next step"], "words": "80–100 words", "model": "Hi Anna, I saw your message — and honestly, I like that you kept going while I was away. But I have to be straight with you: you shouldn’t have finished those sets with a sharp pain in the shoulder. Tired is fine. Sharp is information. From now on, if a movement hurts in one small point, you mustn’t push through it — stop the set and message me. Let’s meet on Thursday and test the shoulder properly before we plan the next block. Kate"}], "homework": [{"words": ["bend", "straighten", "squat", "stretch", "hold", "tighten", "relax", "breathe out", "knee", "shoulder", "mat", "warm-up"], "quiz": [["You ___ warm up before you lift. It’s a rule in this gym.", ["have to", "don’t have to"], 0], ["You ___ bring a mat, we have some.", ["mustn’t", "don’t have to"], 1], ["You ___ hold your breath.", ["mustn’t", "don’t have to"], 0], ["___ you hold a plank for one minute?", ["Can", "Must"], 0], ["You ___ drink more water — that’s my advice.", ["should", "have to"], 0], ["She ___ lift that, it’s too heavy for her.", ["can’t", "mustn’t"], 0], ["___ you show me again, please?", ["Could", "Must"], 0], ["You ___ train with a sore knee.", ["shouldn’t", "don’t have to"], 0]], "speak": "Record 60 seconds: explain a squat to a complete beginner. Use at least five words from the list.", "write": "Write a 40–60 word message to a new client before her first session."}, {"words": ["lunge", "engage", "tuck in", "lean", "pace yourself", "core", "hamstrings", "lower back", "resistance band", "rep", "set", "cool-down"], "quiz": [["Members ___ book a place in the group class.", ["have to", "don’t have to"], 0], ["You ___ pay today — you can pay at the end of the month.", ["mustn’t", "don’t have to"], 1], ["Your legs ___ ache tomorrow, that’s normal.", ["might", "must"], 0], ["You ___ train the same muscle two days running.", ["shouldn’t", "don’t have to"], 0], ["She ___ do one push-up last year. Now she does twelve.", ["couldn’t", "mustn’t"], 0], ["He looks exhausted — he ___ be tired.", ["must", "might"], 0], ["You ___ lock your knees at the top.", ["mustn’t", "don’t have to"], 0], ["In six weeks you ___ be able to hold a plank for two minutes.", ["will", "must"], 0]], "speak": "Record 90 seconds: a client says her lower back hurts after squats. Ask three questions and decide what to do.", "write": "Write a 60–80 word message to a client coming back after two weeks off."}, {"words": ["pace yourself", "engage", "brace", "lock out", "under control", "glutes", "spine", "form", "block", "deload", "consistent", "progress"], "quiz": [["She ___ done Pilates before — look at the way she moves.", ["must have", "should have"], 0], ["You ___ trained through that pain last week.", ["shouldn’t have", "mustn’t have"], 0], ["She ___ finish the last set, even though it was hard.", ["was able to", "could"], 0], ["You’d ___ stop there — your form has gone.", ["better", "rather"], 0], ["She ___ use the remaining sessions this month.", ["doesn’t have to", "mustn’t"], 0], ["Under sixteens ___ train here alone.", ["mustn’t", "don’t have to"], 0], ["By June you’ll ___ able to run ten kilometres.", ["be", "can"], 0], ["You ___ apologise for needing a longer break.", ["don’t have to", "mustn’t"], 0]], "speak": "Record two minutes: a client has trained for four months and sees no change. Give an honest answer and a new plan.", "write": "Write an 80–100 word message to a client who trained through a sharp pain and is proud of it."}], "odd": [{"rounds": [[["knee", "elbow", "shoulder", "squat"], 3, "Squat — это движение. Остальные три — суставы."], [["dumbbell", "kettlebell", "barbell", "mat"], 3, "Mat — коврик. Остальное — отягощения."], [["bend", "lift", "lower", "mat"], 3, "Mat — существительное. Остальные — глаголы движения."], [["abs", "glutes", "calves", "wrist"], 3, "Wrist — сустав. Остальные — мышцы."], [["warm-up", "cool-down", "stretch", "treadmill"], 3, "Treadmill — тренажёр, а не часть занятия."], [["breathe in", "breathe out", "hold", "squat"], 3, "Squat — приседание. Остальное — дыхание и удержание."], [["rep", "set", "session", "spine"], 3, "Spine — часть тела. Остальное — про структуру тренировки."], [["hip", "knee", "elbow", "core"], 3, "Core — мышцы. Остальные — суставы."]]}, {"rounds": [[["tighten", "engage", "squeeze", "relax"], 3, "Relax — расслабить. Остальные три — напрячь."], [["bend", "lower", "lean", "straighten"], 3, "Straighten — выпрямить. Остальные — согнуть, опустить, наклонить."], [["hamstrings", "glutes", "calves", "spine"], 3, "Spine — кость. Остальные — мышцы."], [["rest", "pace yourself", "take a break", "one more rep"], 3, "«One more rep» — про усилие. Остальное — про восстановление."], [["resistance band", "dumbbell", "kettlebell", "locker room"], 3, "Locker room — помещение, а не инвентарь."], [["reach", "swing", "twist", "keep still"], 3, "Keep still — не двигаться. Остальные — движения."], [["hold", "keep still", "tuck in", "step"], 3, "Step — шаг. Остальное — статика и удержание."], [["warm-up", "session", "cool-down", "rep"], 3, "Rep — одно повторение. Остальное — отрезки занятия по времени."]]}, {"rounds": [[["Keep your back straight.", "Don’t lock your knees.", "Nice and slow.", "It hurts here."], 3, "«It hurts here» говорит клиент. Остальные три — команды тренера."], [["One more rep.", "You’re doing great.", "That’s it — well done.", "This is too heavy for me."], 3, "Опять реплика клиента среди фраз поддержки от тренера."], [["must", "have to", "need to", "don’t have to"], 3, "Don’t have to — отсутствие необходимости. Остальные три её выражают."], [["mustn’t", "can’t", "shouldn’t", "may"], 3, "May — разрешение. Остальные — запрет или невозможность."], [["glutes", "hamstrings", "calves", "hip"], 3, "Hip — сустав. Остальные — мышцы."], [["engage", "tighten", "brace", "exhale"], 3, "Exhale — выдох. Остальные — про напряжение."], [["Take a deep breath.", "Feel the stretch.", "Hold it for five seconds.", "Let’s take a short break."], 3, "Перерыв — между подходами. Остальное говорят прямо во время упражнения."], [["could", "might", "may", "must"], 3, "Must — уверенность. Остальные три выражают сомнение."]]}], "saywhat": [{"items": [["Клиентка округляет спину, поднимая штангу.", ["Keep your back straight.", "Nice and slow.", "One more rep."], 0], ["Клиент делает упражнение рывками, слишком быстро.", ["Nice and slow.", "Feel the stretch.", "Take a deep breath."], 0], ["Последний подход, силы ещё есть.", ["One more rep.", "Let’s take a short break.", "Keep your back straight."], 0], ["Клиентка тянет заднюю поверхность бедра.", ["Feel the stretch.", "Don’t lock your knees.", "One more rep."], 0], ["Клиент наконец сделал движение правильно.", ["That’s it — well done.", "Nice and slow.", "Take a deep breath."], 0], ["Перед тяжёлым подходом клиент нервничает.", ["Take a deep breath.", "One more rep.", "Feel the stretch."], 0], ["Клиентка тяжело дышит между подходами.", ["Let’s take a short break.", "One more rep.", "Keep your back straight."], 0], ["Клиент выпрямил ноги до упора в верхней точке.", ["Don’t lock your knees.", "Feel the stretch.", "Nic /* ---------- таймер и диктофон ---------- */
function timeString(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function timerHTML(seconds,label='Practice'){timeLeft=seconds;timerInitial=seconds;timerLabel=label;
 return `<div class="timer" id="timer">${timeString(seconds)}</div><div id="timerStatus" class="small">${esc(label)} · ready</div>
 <div class="buttons smallbuttons"><button class="primary" onclick="startTimer()">▶ Start</button><button onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset</button></div>`}
function startTimer(){if(!$('timer'))return;clearInterval(clockInt);if(timeLeft<=0)timeLeft=timerInitial;
 timeEnd=Date.now()+timeLeft*1000;timerRunning=true;$('timerStatus').textContent=timerLabel;
 clockInt=setInterval(()=>{timeLeft=Math.max(0,Math.ceil((timeEnd-Date.now())/1000));
  if(!$('timer'))return clearInterval(clockInt);
  $('timer').textContent=timeString(timeLeft);
  if(!timeLeft){clearInterval(clockInt);timerRunning=false;$('timerStatus').textContent='Time!';toast('Time is up.')}},250)}
function pauseTimer(){if(timerRunning)timeLeft=Math.max(0,Math.ceil((timeEnd-Date.now())/1000));
 clearInterval(clockInt);timerRunning=false;if($('timerStatus'))$('timerStatus').textContent='Pause'}
function resetTimer(){pauseTimer();timeLeft=timerInitial;
 if($('timer')){$('timer').textContent=timeString(timeLeft);$('timerStatus').textContent=timerLabel+' · ready'}}
function recorderButton(){return `<button onclick="openRecorder()">● Record an answer</button>`}
function openRecorder(){$('recorderPanel').classList.remove('hidden')}
function closeRecorder(){stopRecord();$('recorderPanel').classList.add('hidden')}
async function startRecord(){
 if(recordPending||recorder?.state==='recording')return;
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  $('recordStatus').textContent='The recorder is not available here. Use the voice recorder on your phone.';return}
 recordPending=true;$('recStart').disabled=true;
 try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){recordPending=false;$('recStart').disabled=false;
  $('recordStatus').textContent='No microphone access. Allow it in the browser, or record on your phone.';return}
 recordPending=false;
 const chunks=[];recorder=new MediaRecorder(recordStream);
 recorder.ondataavailable=e=>chunks.push(e.data);
 recorder.onstop=()=>{
  const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
  if(recordURL)URL.revokeObjectURL(recordURL);
  recordURL=URL.createObjectURL(blob);
  const p=$('playback'),d=$('recordDownload');
  p.src=recordURL;p.classList.remove('hidden');
  d.href=recordURL;d.download='kate-speaking.webm';d.classList.remove('hidden');
  d.textContent='Download ↓';
  recordStream.getTracks().forEach(t=>t.stop());
  $('recStart').disabled=false;$('recStop').disabled=true;
  $('recordStatus').textContent='Listen to it. Would you understand yourself?'};
 recorder.start();$('recStop').disabled=false;
 $('recordStatus').innerHTML='<span class="recdot"></span>Recording…';}
function stopRecord(){if(recorder?.state==='recording')recorder.stop()}

const TEST_SECTIONS=[['grammar','Grammar'],['vocab','Vocabulary'],['reading','Reading']];
const tval=(sec,i)=>S.test[sec+':'+i]??'';
function testItems(sec){return sec==='reading'?D.test.reading.items:D.test[sec]}
function isRight(sec,i){
 const it=testItems(sec)[i],key=sec==='reading'?it[2]:it[2];
 return tval(sec,i)!==''&&+tval(sec,i)===key}
function testDone(){return TEST_SECTIONS.reduce((n,[sec])=>
 n+testItems(sec).filter((_,i)=>tval(sec,i)!=='').length,0)}
function testTotal(){return TEST_SECTIONS.reduce((n,[sec])=>n+testItems(sec).length,0)}
function testScore(){return TEST_SECTIONS.reduce((n,[sec])=>
 n+testItems(sec).filter((_,i)=>isRight(sec,i)).length,0)}
function testProgress(){const el=$('testCount');if(el)el.textContent=testDone()+' / '+testTotal()}

function testRow(sec,i,item,shown){
 const [q,opts,key]=item,band=item[3]||'';
 const picked=tval(sec,i),ok=picked!==''&&+picked===key;
 const cls=shown&&picked!==''?(ok?'good':'bad'):'';
 return `<div class="testq">
  <i class="num">${i+1}</i>
  <span>${q.replace('___','<b>___</b>')}${shown&&picked!==''&&!ok?'<br><span class="small">✓ '+esc(opts[key])+' — '+item[4]+'</span>':''}${shown&&ok?'<br><span class="small">'+item[4]+'</span>':''}</span>
  <select data-test="${sec}:${i}" class="${cls}" aria-label="Question ${i+1}">
   <option value="">—</option>
   ${opts.map((o,k)=>`<option value="${k}" ${String(picked)===String(k)?'selected':''}>${esc(o)}</option>`).join('')}
  </select></div>`}

function testSheet(sec,from,to,tag,title,desc){
 const items=testItems(sec).slice(from,to),shown=!!S.test['show:'+sec+':'+from];
 const right=items.filter((_,k)=>isRight(sec,from+k)).length,answered=items.filter((_,k)=>tval(sec,from+k)!=='').length;
 return header(tag,title,desc)
 +`<div class="card">${items.map((it,k)=>testRow(sec,from+k,it,shown)).join('')}</div>
   <div class="buttons">
    <button class="primary" onclick="revealTest('${sec}',${from})">${shown?'Hide the answers':'Check this page'}</button>
    <span class="small">Answered: <b id="testCount">${testDone()} / ${testTotal()}</b>${shown?' · on this page: <b>'+right+' / '+items.length+'</b>':''}</span>
   </div>
   ${answered<items.length?'<p class="small">Не знаешь — ставь прочерк и иди дальше. Пропуск здесь честнее угадывания: он показывает, где мы начнём.</p>':''}`}

function bandStats(){
 const res={A1:[0,0],A2:[0,0],B1:[0,0]};
 for(const sec of ['grammar','vocab'])
  testItems(sec).forEach((it,i)=>{const b=it[3];if(!res[b])return;res[b][1]++;if(isRight(sec,i))res[b][0]++});
 return res}

 return header('WORD STUDIO','60 words you already use — in Russian.',
  'Нажми на карточку: она перевернётся на английское определение. Группы по двенадцать — бери по одной, а не все шестьдесят сразу.')
 +`<div class="searchrow">
   <input id="wsearch" value="${esc(wordSearch)}" placeholder="Search · поиск по слову, переводу или определению" oninput="wordSearch=this.value.toLowerCase();wordPage=0;render();const f=$('wsearch');f.focus();f.setSelectionRange(f.value.length,f.value.length)">

/* =========================================================================

   ========================================================================= */
function sprintPool(){

function nextSprint(){
 const cfg=D.sprint[level],pool=sprintPool();
 const right=pool[Math.floor(Math.random()*pool.length)];
 const others=shuffle(pool.filter(v=>v.en!==right.en)).slice(0,2);
 sprintItem={right,opts:shuffle([right,...others]),mode:cfg.mode}}
function sheetSprint(){
 const cfg=D.sprint[level],best=S.scores[level+':sprint'];
 const body=!sprintOn

     ${best?`<p class="small">Your best: <b class="num">${best.n} reps</b></p>`:''}

  :`<div class="card">

    </div>`;
 return header('GAME 2 · REP SPRINT','',
  'Лексический спринт на время. Ошибка не заканчивает подход — просто теряется секунда.')
 +`<div class="sprint">
   <div class="card dark">
    <span class="tag">Timer</span>
    <div class="timer${sprintLeft<=10&&sprintOn?' low':''}" id="sprintClock">${timeString(sprintOn?sprintLeft:cfg.seconds)}</div>

 sprintOn=true;sprintReps=0;sprintMiss=0;sprintLeft=cfg.seconds;sprintEnd=Date.now()+cfg.seconds*1000;

 clearInterval(sprintTimer);

function sprintPick(en){

function pairPool(){
 const cats=D.sprint[level].cats;

 return fresh.length>=6?fresh:pool}
function pairDeal(){
 pairSet=shuffle(pairPool()).slice(0,6);

 pairPick=null;pairDone=[];pairMiss=0}
function sheetPairs(){
 if(!pairSet.length)pairDeal();

   <div class="pairgrid">
    <div>${pairSet.map(v=>{
      const solved=pairDone.includes(v.i);

       onclick="pairLeft(${v.i})" ${solved?'disabled':''}>${esc(v.en)}</button>`}).join('')}</div>
    <div>${pairRight.map(i=>{
      const v=D.vocab[i],solved=pairDone.includes(i);
      return `<button class="pairbtn ru${solved?' solved':''}"

   </div>
   <div class="buttons smallbuttons">

  </div>`}
function pairLeft(i){if(pairDone.includes(i))return;pairPick=pairPick===i?null:i;render()}
function pairMatch(i){
 if(pairPick===null){toast('Сначала нажми английское слово.');return}

   saveScore('pairs',pairSet.length-pairMiss,pairSet.length);
   if(!pairMiss)award('pairs',10);celebrate()}

function sheetGap(from=0,to=99){

 +`<div class="card"><div class="split2">

function gapOk(ans,given){

 d.items.forEach((it,i)=>{

function reelDeal(){const n=D.reels[level].pairs.length;
 reelL=shuffle([...Array(n).keys()]);reelR=shuffle([...Array(n).keys()]);
 if(reelL[0]===reelR[0])reelR.push(reelR.shift());
 reelPosL=0;reelPosR=0;reelSolved=[];reelMiss=0}
function sheetReels(){
 if(!reelL.length&&!reelSolved.length)reelDeal();
 const P=D.reels[level].pairs,done=reelSolved.length===P.length;
 const L=reelL[reelPosL],R=reelR[reelPosR];
 return header('GAME 10 · BODY FACTS','',
  'Zero conditional — факты о теле. Крути две катушки, пока не получится правда, и жми Lock. Ерунду читай вслух — так смешнее.')
 +`<div class="card pink">${done?`<div class="cuebig">All facts found · ${reelMiss} wrong locks</div>`
  :`<div class="reels">
    <div class="reel"><button onclick="reelSpin('L',-1)">▲</button><div class="reelwin"><i>If</i> ${esc(P[L][0])},</div><button onclick="reelSpin('L',1)">▼</button></div>
    <div class="reel"><button onclick="reelSpin('R',-1)">▲</button><div class="reelwin">${esc(P[R][1])}.</div><button onclick="reelSpin('R',1)">▼</button></div>
   </div>
   <div class="buttons"><button class="primary" onclick="reelLock()">Lock it 🔒</button>
    <span class="small num">${reelSolved.length} / ${P.length}${reelMiss?' · misses '+reelMiss:''}</span></div>`}
  ${reelSolved.length?`<div class="factlist">${reelSolved.map(i=>`<p>✓ If ${esc(P[i][0])}, ${esc(P[i][1])}.</p>`).join('')}</div>`:''}
  <div class="buttons smallbuttons"><button onclick="reelDeal();render()">Play again</button></div></div>`}
function reelSpin(side,d){
 if(side==='L')reelPosL=(reelPosL+d+reelL.length)%reelL.length;
 else reelPosR=(reelPosR+d+reelR.length)%reelR.length;render()}
function reelLock(){
 const P=D.reels[level].pairs,L=reelL[reelPosL],R=reelR[reelPosR];
 if(L===R){reelSolved.push(L);reelL.splice(reelPosL,1);reelR.splice(reelPosR,1);
  reelPosL=reelL.length?reelPosL%reelL.length:0;reelPosR=reelR.length?(reelPosR+1)%reelR.length:0;
  if(reelL.length&&reelL[reelPosL]===reelR[reelPosR])reelPosR=(reelPosR+1)%reelR.length;
  toast('True fact. 💪');
  if(reelSolved.length===P.length)finish('reels',Math.max(0,P.length-reelMiss),P.length,12)}
 else{reelMiss++;toast('😂 If '+esc(P[L][0])+', '+esc(P[R][1])+'? Not a fact.')}
 render()}

 const chain=[d.start,...S_.slice(0,domIndex+(shown?1:0)).map(s=>s[0][s[1]])];
 const tiles=(PORTRAIT&&!done?chain.slice(-2):chain).map((t,i,a)=>`<div class="tile${i===a.length-1?' last':''}">${esc(t)}</div>`).join('');
 return header('GAME 11 · DOMINO OF DOOM','',

function testLines(){
 const done=testDone(),total=testTotal();
 if(!done)return ['ТЕСТ не пройден'];
 const score=testScore(),band=currentBand(score),bands=bandStats();
 const ru={grammar:'грамматика',vocab:'лексика',reading:'чтение'};
 const secs=TEST_SECTIONS.map(([sec])=>{
  const items=testItems(sec);
  return ru[sec]+' '+items.filter((_,i)=>isRight(sec,i)).length+'/'+items.length}).join(' · ');
 const byBand=['A1','A2','B1'].map(b=>b+' '+bands[b][0]+'/'+bands[b][1]).join(' · ');
 const wrong=TEST_SECTIONS.flatMap(([sec])=>testItems(sec)
   .map((_,i)=>i).filter(i=>tval(sec,i)!==''&&!isRight(sec,i))
   .map(i=>sec[0].toUpperCase()+(i+1)));
 const blank=total-done;
 return ['ТЕСТ '+score+'/'+total+' → '+band[2],
         '  '+secs, '  '+byBand,
         wrong.length?'  ошибки: '+wrong.join(' '):'  ошибок нет',
         blank?'  без ответа: '+blank:null].filter(Boolean)}

function lessonLines(){
 const names={mirror:'фигура',sprint:'спринт',gap:'форма',choice:'выбор',trap:'отрицания',
              gossip:'сплетни',diary:'дневник',slot:'наречие',reels:'факты',domino:'домино',
              bugs:'охота на will',promises:'обещания',reading1:'чтение T/F',reading2:'подбор'};
 const out=[];
 for(let lv=0;lv<3;lv++){
  const rows=Object.entries(names)
   .map(([k,name])=>{const s=S.scores[lv+':'+k];return s?name+' '+s.n+(s.total?'/'+s.total:' повт.'):null})
   .filter(Boolean);
  if(rows.length)out.push('  '+LEVELS[lv]+': '+rows.join(' · '));
 }
 return out.length?['УРОК',...out]:[]}

function buildReport(kind){
 const L=['STUDIO · Катя · урок 1 · '+reportDate(),''];
 L.push(...testLines());
 if(kind!=='test'){
  const lesson=lessonLines();
  if(lesson.length){L.push('',...lesson)}
  L.push('','слов отмечено '+S.known.length+'/60 · XP '+xp()+' · листов открыто '+S.seen.length+'/'+titles.length);
  const closing=(S.answers[level+':closing']||'').trim();
  if(closing)L.push('','её фраза: '+closing);
 }
 return L.join('\n')}

/* ---------- сцена 1280×720 ---------- */
const viewport=document.createElement('div');viewport.className='deck-viewport';
const stage=document.createElement('div');stage.className='deck-stage';
const col=document.createElement('div');col.className='deck-main';
for(const node of [...BODY.childNodes]){
 if(node.nodeType===1&&(node.tagName==='SCRIPT'||node.tagName==='DIALOG'))continue;
 if(node.nodeType===3&&!node.textContent.trim()){node.remove();continue}
 col.appendChild(node);
}
paint.forEach(([p,v])=>{if(v)stage.style.setProperty(p,v)});
stage.style.setProperty('--deck-rail-bg',theme.bg);
stage.style.setProperty('--deck-rail-fg',theme.fg);
stage.style.setProperty('--deck-rail-edge',theme.edge);
stage.style.setProperty('--deck-rail-hover',theme.hover);
stage.style.setProperty('--deck-rail-active-bg',theme.abg);
stage.style.setProperty('--deck-rail-active-fg',theme.afg);
viewport.style.setProperty('--deck-backdrop',theme.back);

/* ---------- оглавление ---------- */
const ownRail=!col.querySelector('aside.sidebar nav');   /* у career-lab колонка уже своя */
const arr=(typeof titles!=='undefined'&&Array.isArray(titles))?titles:null;
const map=(!arr&&typeof titles!=='undefined'&&titles&&typeof titles==='object')?titles:null;
let rail=null,listEl=null,footNow=null;

if(ownRail){
 rail=document.createElement('nav');rail.className='deck-rail';
 rail.setAttribute('aria-label','Lesson contents');
 const name=(document.title.split('·')[0]||'Lesson').trim();
 let rows='',total=0;
 if(arr){
  const pre=t=>{const k=t.indexOf(' · ');return k>0?t.slice(0,k):''};
  const seen={};arr.forEach(t=>{const k=pre(t);if(k)seen[k]=(seen[k]||0)+1});
  let last=null;
  arr.forEach((t,i)=>{
   const k=pre(t),grouped=k&&seen[k]>1;
   if(grouped&&k!==last){rows+='<li class="deck-group">'+esc(k)+'</li>';last=k}
   if(!grouped)last=null;
   rows+='<li><button type="button" class="deck-item" data-page="'+i+'"><i>'+
     String(i+1).padStart(2,'0')+'</i><span>'+esc(grouped?t.slice(k.length+3):t)+'</span></button></li>';
  });
  total=arr.length;
 }else{
  const views=[];
  col.querySelectorAll('[data-nav]').forEach(b=>{const v=b.dataset.nav;if(v&&!views.includes(v))views.push(v)});
  views.forEach(v=>{
   const label=(map&&map[v])||v;
   rows+='<li><button type="button" class="deck-item" data-view="'+esc(v)+'"><span>'+esc(label)+'</span></button></li>';
  });
  total=views.length;
  col.querySelectorAll('.game-header nav').forEach(n=>n.classList.add('deck-hide'));
 }
 rail.innerHTML='<div class="deck-rail-head"><b>Contents</b><span>'+esc(name)+'</span></div>'+
  '<ol class="deck-rail-list">'+rows+'</ol>'+
  '<div class="deck-rail-foot"><span id="deckNow"></span><span>PgUp / PgDn</span></div>';
 stage.appendChild(rail);
 listEl=rail.querySelector('.deck-rail-list');
 footNow=rail.querySelector('#deckNow');
 footNow.textContent=total?'1 / '+total:'';
 listEl.addEventListener('click',e=>{
  const b=e.target.closest('.deck-item');if(!b)return;
  if(b.dataset.page!==undefined&&typeof go==='function')go(+b.dataset.page);
  else if(b.dataset.view&&typeof navigate==='function')navigate(b.dataset.view);
 });
 /* кнопки, открывавшие оглавление, теперь лишние */
 col.querySelectorAll('button[onclick*="contents"],button[onclick*="drawer"]').forEach(b=>{
  if(!b.closest('#drawer'))b.classList.add('deck-hide');
 });
}else{
 /* у урока уже своя колонка слева — сцена отдаёт ей всю ширину */
 stage.style.gridTemplateColumns='minmax(0,1fr)';
}

stage.appendChild(col);
viewport.appendChild(stage);
BODY.appendChild(viewport);
BODY.classList.add('deck-on');

/* ---------- лист прокручивается внутри сцены ---------- */
const sheet=col.querySelector('main');
if(sheet){
 for(let n=sheet.parentElement;n&&n!==col;n=n.parentElement)n.classList.add('deck-flexcol');
 sheet.classList.add('deck-scroll');
 /* уроки, где поля листа держались на центрировании по широкому экрану,
    внутри сцены остались бы без отступа от оглавления */
 const pad=getComputedStyle(sheet);
 if(parseFloat(pad.paddingLeft)<18){sheet.style.paddingLeft='30px';sheet.style.paddingRight='30px'}
}

/* ---------- вписывание сцены в окно ---------- */
let scale=1;
function fit(){
 const vw=window.innerWidth,vh=window.innerHeight,flow=false;
 BODY.classList.toggle('deck-flow',flow);
 ROOT.style.overflow=flow?'':'hidden';
 if(flow){scale=1;stage.style.transform='';return}
 scale=Math.min(vw/W,vh/H);
 stage.style.transform='translate('+Math.round((vw-W*scale)/2)+'px,'+
   Math.round((vh-H*scale)/2)+'px) scale('+scale+')';
}
window.addEventListener('resize',()=>{fit();fitSheet()},{passive:true});
window.addEventListener('orientationchange',fit);
fit();

/* ---------- синхронизация оглавления с текущим листом ---------- */
function reveal(el){
 if(!listEl||BODY.classList.contains('deck-flow'))return;
 const r=el.getBoundingClientRect(),b=listEl.getBoundingClientRect();
 if(r.top<b.top)listEl.scrollTop-=(b.top-r.top)/scale+10;
 else if(r.bottom>b.bottom)listEl.scrollTop+=(r.bottom-b.bottom)/scale+10;
}
function sync(){
 if(!listEl)return;
 if(arr){
  const n=(typeof current==='number')?current:null;
  if(n===null)return;
  listEl.querySelectorAll('.deck-item[data-page]').forEach(b=>{
   if(+b.dataset.page===n){b.setAttribute('aria-current','true');reveal(b)}
   else b.removeAttribute('aria-current');
  });
  if(footNow)footNow.textContent=(n+1)+' / '+arr.length;
 }else{
  /* игра переключает разделы по имени, а не по номеру листа */
  const view=BODY.dataset.view||(location.hash||'').replace('#','');
  let at=0,total=0;
  listEl.querySelectorAll('.deck-item[data-view]').forEach((b,k)=>{
   total++;
   if(b.dataset.view===view){b.setAttribute('aria-current','true');reveal(b);at=k+1}
   else b.removeAttribute('aria-current');
  });
  if(footNow)footNow.textContent=(at||1)+' / '+total;
 }
}
function top(){if(sheet)sheet.scrollTop=0}

/* ---------- лист всегда помещается в слайд ----------
   Сначала лист показывается в натуральную величину. Если содержимое выше сцены,
   масштаб уменьшается шагами: zoom меняет перенос строк, поэтому одного деления
   мало и результат уточняется в несколько проходов. */
const FIT_MIN=0.82;
function fitSheet(){
 if(!sheet)return;
 if(BODY.classList.contains('deck-flow')){sheet.style.removeProperty('--deck-fit');return}
 sheet.style.setProperty('--deck-fit','1');
 let z=1;
 for(let pass=0;pass<8;pass++){
  const over=sheet.scrollHeight-sheet.clientHeight;
  if(over<=0)break;
  let next=Math.max(FIT_MIN,z*(sheet.clientHeight-1)/sheet.scrollHeight);
  /* когда не хватает пары пикселей, деление даёт шаг меньше округления:
     в этом случае лист уменьшается на фиксированную долю, иначе полоса остаётся */
  if(next>=z-0.002)next=Math.max(FIT_MIN,z-0.006);
  if(next>=z)break;
  z=next;sheet.style.setProperty('--deck-fit',z.toFixed(3));
 }
}
for(const fn of ['go','navigate','setLevel','render']){
 const orig=window[fn];
 if(typeof orig!=='function')continue;
 window[fn]=function(){const r=orig.apply(this,arguments);top();sync();fitSheet();return r};
}
sync();

/* ---------- листание с клавиатуры ---------- */
window.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const t=e.target;
 if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
 if(typeof go!=='function'||typeof current!=='number')return;
 if(e.key==='PageDown'){e.preventDefault();go(current+1)}
 else if(e.key==='PageUp'){e.preventDefault();go(current-1)}
 else if(e.key==='Home'){e.preventDefault();go(0)}
 else if(e.key==='End'&&arr){e.preventDefault();go(arr.length-1)}
},true);

fitSheet();
window.__deckLayer={fit:fit,sync:sync,fitSheet:fitSheet,stage:stage};
})();
</script></body></html>
