/* Olympiad Shelf · две страницы-полки для Юли.
   Бумага, чернила и цветные корешки: у каждой полки свой цвет. */
:root{
  --paper:#f5f0e6; --card:#fffdf8; --ink:#1f2740; --muted:#5d6478; --line:#ddd4c2;
  --soft:#ebe4d4; --ok:#2f7d4f; --ok-bg:#e3f1e6; --bad:#b23a2b; --bad-bg:#f8e3df;
  --accent:#27365f; --accent-ink:#fff; --spine:#27365f;
  --serif:'Literata',Georgia,serif; --sans:'Onest',system-ui,sans-serif;
  --r:14px;
}
body[data-hub="country"]{--accent:#1e4d3b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
b,strong{font-weight:700}
.en{font-style:normal}

/* ---------- верхняя панель ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:10px 24px;background:var(--accent);color:var(--accent-ink)}
.switch{display:flex;gap:4px;margin-right:auto}
.switch a{color:inherit;text-decoration:none;padding:7px 14px;border-radius:999px;font-weight:600;opacity:.75}
.switch a:hover{opacity:1;background:rgba(255,255,255,.1)}
.switch a.on{opacity:1;background:var(--paper);color:var(--accent)}
.switch .brand{font-family:var(--serif);font-weight:700;opacity:1;padding-left:0;font-size:18px}
.levels,.countries{display:flex;gap:2px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.countries:empty{display:none}
.levels button,.countries button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;color:inherit;opacity:.8}
.levels button:hover,.countries button:hover{opacity:1}
.levels button.on,.countries button.on{background:var(--paper);color:var(--accent);opacity:1}
.levels small{display:block;font-size:10.5px;font-weight:500;opacity:.8;line-height:1.1}
.total{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- каркас ---------- */
.frame{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 62px)}
.shelves{border-right:1px solid var(--line);padding:18px 14px 40px;position:sticky;top:62px;
  height:calc(100vh - 62px);overflow:auto}
.shelves h2{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 8px}
.book{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;width:100%;
  text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;margin-bottom:2px}
.book:hover{background:var(--soft)}
.book.on{background:var(--card);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.book i{width:8px;height:34px;border-radius:3px;background:var(--c)}
.book span{font-weight:600;font-size:15px;line-height:1.25}
.book span em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--muted)}
.book .meter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:44px}
.book .meter b{display:block;height:4px;border-radius:2px;background:var(--soft);margin-top:4px;overflow:hidden}
.book .meter b::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--c)}
.reset{margin:22px 10px 0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}

.shelf{padding:28px 40px 80px;outline:none;max-width:1240px}
.head{display:flex;gap:18px;align-items:flex-end;border-bottom:3px solid var(--c);padding-bottom:14px;margin-bottom:18px}
.head h1{font:700 34px/1.1 var(--serif);margin:0}
.head p{margin:6px 0 0;color:var(--muted);max-width:760px}
.head .num{font:700 15px var(--sans);color:var(--c);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:6px;margin:0 0 22px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 18px;border-radius:999px;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs button small{font-weight:500;opacity:.7;margin-left:6px}
.tools{display:flex;gap:10px;align-items:center;margin:-8px 0 18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px}
.tools button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- теория ---------- */
.theory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;border-top:4px solid var(--c)}
.note.wide{grid-column:1/-1}
.note h3{font:700 19px/1.25 var(--serif);margin:0 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.note p{margin:0 0 10px}.note p:last-child{margin-bottom:0}
.note ul,.note ol{margin:0 0 10px;padding-left:20px}.note li{margin:3px 0}
.note table{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0 8px}
.note th{text-align:left;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 8px}
.note td{border-bottom:1px solid var(--soft);padding:6px 8px;vertical-align:top}
.note tr:last-child td{border-bottom:0}
.note .trap{background:var(--bad-bg);border-radius:10px;padding:8px 12px;margin:8px 0 0;font-size:14.5px}
.note .trap::before{content:"Ловушка · ";font-weight:800;color:var(--bad)}
.note .tip{background:var(--ok-bg);border-radius:10px;padding:8px 12px;margin:8px 0 0;font-size:14.5px}
.note .tip::before{content:"Совет · ";font-weight:800;color:var(--ok)}
.note code,.q code{font:600 .95em var(--sans);background:var(--soft);padding:1px 6px;border-radius:5px}
.lv{font:700 11px/1 var(--sans);letter-spacing:.04em;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.lv.l2{background:#e8e1f3;color:#553d7c}.lv.l3{background:#f6dfcf;color:#8a3b12}
.flag{font:700 11px/1 var(--sans);padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* ---------- практика ---------- */
.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative}
.task.wide{grid-column:1/-1}
.task.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.task.bad{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.task .meta{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.task .meta .n{font-weight:700;color:var(--ink)}
.task .meta .src{margin-left:auto;font-style:italic}
.q{margin:0 0 12px;font-size:16.5px}
.q .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);height:1em;vertical-align:baseline}
.q .key{font-weight:800;letter-spacing:.05em;background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:5px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:10px;font-weight:500;text-align:left}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px}
.line input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.why{margin-top:10px;font-size:14.5px;background:var(--soft);border-radius:10px;padding:8px 12px}
.why .ans{font-weight:800}
.task.ok .why .ans{color:var(--ok)}.task.bad .why .ans{color:var(--bad)}
.retry{position:absolute;top:12px;right:14px;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}

.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.match .col{display:flex;flex-direction:column;gap:6px}
.match button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;text-align:left;display:flex;gap:8px;align-items:center;min-height:40px}
.match button .tag{margin-left:auto;font:800 12px var(--sans);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.match button.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.match button.right{border-color:var(--ok);background:var(--ok-bg)}
.match button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.match button:disabled{cursor:default}
.order .pool,.order .seq{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border-radius:10px}
.order .seq{background:var(--paper);border:1px dashed var(--line);margin-bottom:8px;counter-reset:s}
.order .seq button{counter-increment:s}
.order .seq button::before{content:counter(s) ". ";font-weight:800}
.order button.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;text-align:left}
.order button.chip.right{border-color:var(--ok);background:var(--ok-bg)}
.order button.chip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;gap:8px;margin-top:10px}

.read{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.passage h3{font:700 22px/1.2 var(--serif);margin:0 0 12px}
.passage p{margin:0 0 10px;font-family:var(--serif);font-size:16.5px;line-height:1.65}
.passage .pn{font:800 12px var(--sans);color:var(--c);margin-right:6px}
.read .qs{display:flex;flex-direction:column;gap:12px}

.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;grid-column:1/-1}
.tool h3{font:700 19px var(--serif);margin:0 0 8px}
.tool textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:12px 14px;font:16px/1.6 var(--serif);resize:vertical}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}
.bar input{width:70px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--paper)}
.count{font:800 22px var(--sans);font-variant-numeric:tabular-nums}
.zone{font-weight:700;padding:4px 10px;border-radius:999px;font-size:14px}
.zone.good{background:var(--ok-bg);color:var(--ok)}.zone.warn{background:#fbf0d0;color:#86600c}.zone.bad{background:var(--bad-bg);color:var(--bad)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:8px 0 0;padding:0;list-style:none;font-size:14.5px}
.checks li::before{content:"○ ";font-weight:800;color:var(--muted)}
.checks li.on::before{content:"● ";color:var(--ok)}
.checks li.warn::before{content:"▲ ";color:var(--bad)}
.clock{font:800 54px/1 var(--sans);font-variant-numeric:tabular-nums;margin:8px 0}
.clock small{font-size:16px;font-weight:600;color:var(--muted);margin-left:10px}

/* ---------- уроки ---------- */
.lessons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lesson{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-left:6px solid var(--c)}
.lesson:hover{border-color:var(--ink)}
.lesson b{display:block;font:700 18px/1.25 var(--serif);margin-bottom:6px}
.lesson span{font-size:14.5px;color:var(--muted)}
.lesson em{display:block;font-style:normal;font-size:12.5px;margin-top:8px;color:var(--accent);font-weight:600}

@media (max-width:1100px){
  .frame{grid-template-columns:240px minmax(0,1fr)}
  .shelf{padding:22px 24px 60px}
  .lessons{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .frame{grid-template-columns:1fr}
  .shelves{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .theory,.tasks,.read,.checks{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
  .lessons{grid-template-columns:1fr}
}

</style>
</head>

<script>
/* Olympiad Shelf · ОБЩАЯ. Полки идут по конкурсам олимпиады.
   lvl: 1 = 7–8 кл. (школьный, муниципальный) · 2 = 9–11 (муниципальный, B2) · 3 = 9–11 регион и выше (B2+/C1).
   Уровень показывает всё, что ≤ выбранного. */
const OLRU = 'https://olimpiada.ru/activity/88/tasks';
const CPMK = 'https://vserosolimp.edsoo.ru/anglyaz';
window.HUB = {
id: 'general',
levels: [
  {label: '7–8 кл.', short: '7–8', sub: 'A2–B1+'},
  {label: '9–11 кл.', short: '9–11', sub: 'B2'},
  {label: '9–11 · регион+', short: 'регион+', sub: 'B2+ / C1'},
],
shelves: [

/* ================================================================ 1 */
{id: 'format', group: 'Старт', title: 'Как устроена олимпиада', sub: 'конкурсы, уровни, правила', color: '#27365f',
 lead: 'Что будет на олимпиаде, сколько длится и за что снимают баллы. Прочитать один раз до начала подготовки и ещё раз за неделю до этапа.',
 theory: [
  {h: 'Пять конкурсов', wide: true, html: `
   <table><tr><th>Конкурс</th><th>Что проверяют</th><th>Типичные задания</th></tr>
   <tr><td><b>Listening</b></td><td>понимание на слух</td><td>выбор ответа, True / False / Not stated, соотнесение говорящих и утверждений. Запись обычно звучит дважды.</td></tr>
   <tr><td><b>Reading</b></td><td>понимание текста</td><td>выбор ответа, True / False / Not stated, вставить пропущенные предложения или абзацы, заголовки к частям текста</td></tr>
   <tr><td><b>Use of English</b></td><td>грамматика и лексика</td><td>выбор слова в тексте, open cloze (одно слово в пропуск), словообразование, трансформации с ключевым словом, поиск ошибки или лишнего слова, страноведение</td></tr>
   <tr><td><b>Writing</b></td><td>письмо</td><td>эссе, статья, письмо, отзыв; строгий объём в словах</td></tr>
   <tr><td><b>Speaking</b></td><td>устная речь</td><td>монолог по карточке или диалог в паре; вопросы партнёру</td></tr></table>
   <p>Первые четыре конкурса — <b>письменный тур</b>, Speaking — <b>устный</b>. Отсеивания между конкурсами нет: все участники делают все конкурсы.</p>
   <p class="tip">На школьном этапе Writing и Speaking для 7–8 и 9–11 классов часто не проводят: ЦПМК рекомендует их не включать, но окончательно решает регион. На муниципальном этапе Speaking для 7–8 рекомендован.</p>`},
  {h: 'Уровни по этапам', html: `
   <table><tr><th>Этап</th><th>7–8 кл.</th><th>9–11 кл.</th></tr>
   <tr><td>школьный</td><td>A2–B1</td><td>B1–B2</td></tr>
   <tr><td>муниципальный</td><td>B1–B1+</td><td>B2–B2+</td></tr>

   <p>«+» значит: большинство заданий на указанном уровне, но 2–3 задания на ступень выше.</p>
   <p>Региональный и заключительный этапы проводятся только для 9–11 классов.</p>`},
  {h: 'Можно писать за старший класс', html: `
   <p>Участник вправе выполнять задания для более старшего класса. Дальше по этапам он идёт уже в выбранном классе.</p>
   <p>Для восьмиклассницы это значит: задания 9–11 классов на школьном этапе открывают путь на региональный этап — у 7–8 классов его нет.</p>
   <p class="trap">Выбор делается на школьном этапе и потом не меняется: на муниципальном придётся писать задания того же класса.</p>`},
  {h: 'Время', html: `
   <ul><li>письменный тур: 7–8 кл. — 60–90 минут, 9–11 кл. — 90–120 минут;</li>
   <li>устный тур: не больше 30 минут на пару участников вместе с подготовкой;</li>
   <li>словари, телефоны, любые гаджеты запрещены. Телефон, найденный даже выключенным, — удаление с олимпиады.</li></ul>
   <p class="tip">Use of English даёт самые «быстрые» баллы — не застревай на одном пропуске, возвращайся к нему в конце. На Writing оставь 5 минут на план и 5 минут на проверку и подсчёт слов.</p>`},

   <tr><td>ответ остался в листе с заданиями и не перенесён в бланк</td><td><b>0</b>: проверяют только бланк ответов</td></tr>
   <tr><td>в трансформации написано <code>don’t</code></td><td>считается как <b>два</b> слова (do + not)</td></tr>
   <tr><td>эссе короче нормы больше чем на 10 %</td><td>работу могут не проверять совсем. Пример: Ленобласть 2025/26, задание 200–250 слов — 179 слов и меньше не проверяются</td></tr>
   <tr><td>эссе длиннее нормы больше чем на 10 %</td><td>проверяют только первые N слов (там же: от 276 слов читают первые 250 — вывод может не попасть)</td></tr>
   <tr><td>в письме пропущен пункт задания</td><td>страдает «решение коммуникативной задачи»; 0 за этот критерий = 0 за весь Writing (Свердловская обл. 2025/26)</td></tr>
   <tr><td>на устном туре спросить партнёра о его мнении, когда просят дополнительную информацию</td><td>вопрос не засчитывается (образец ЦПМК)</td></tr></table>
   <p class="tip">Жюри может расширить ключ, если участники находят другие верные варианты. Но рассчитывать на это не стоит: пиши самый стандартный ответ. Ответы в Use of English удобно писать печатными заглавными — нет вопросов к почерку, а в некоторых регионах это прямо требуется.</p>`},
 ],
 practice: [
  {t: 'yn', q: 'Орфографическая ошибка в словообразовании даёт половину балла, если корень верный.', a: false, why: 'Ноль: в заданиях на заполнение пропусков слово с ошибкой не засчитывается.'},
  {t: 'yn', q: 'Если вписать два варианта и один из них верный, балл засчитают.', a: false, why: 'Ноль. Больше ответов, чем требуется, — всегда 0.'},

{id: 'grammar', group: 'Use of English', title: 'Грамматика', sub: 'времена, условия, инверсия, исключения', color: '#c8553d',
 lead: 'Только то, на чём олимпиада ловит чаще всего. Полные разборы — в уроках Time Lab, What If Lab и Exceptions.',
 theory: [
  {h: 'Времена: где ловят', html: `
   <ul>
   <li><b>since / for</b> → Present Perfect (Continuous): <i>I have lived here <b>since</b> 2019 / <b>for</b> six years.</i></li>
   <li>После <b>when, as soon as, until, before, after, by the time, if</b> о будущем — Present, не <i>will</i>: <i>Call me when you <b>get</b> home.</i></li>
   <li><b>It’s the first time</b> + Present Perfect: <i>It’s the first time I <b>have seen</b> snow.</i></li>
   <li>Раньше другого события в прошлом — Past Perfect: <i>By the time we arrived, the film <b>had started</b>.</i></li>
   <li>Глаголы состояния без -ing: <i>know, understand, believe, belong, own, seem, prefer</i>. Но <i>I’m thinking about it</i> — это процесс, можно.</li>
   </ul>
   <p class="trap"><b>used to do</b> — раньше делал, <b>be used to doing</b> — привык, <b>get used to doing</b> — привыкаю.</p>`},
  {h: 'Условные предложения', html: `
   <table><tr><th>Тип</th><th>If-часть</th><th>Главная часть</th></tr>
   <tr><td>0 — всегда так</td><td>Present</td><td>Present</td></tr>
   <tr><td>1 — реально</td><td>Present</td><td>will + V</td></tr>
   <tr><td>2 — нереально сейчас</td><td>Past (<i>were</i>)</td><td>would + V</td></tr>
   <tr><td>3 — нереально в прошлом</td><td>Past Perfect</td><td>would have + V3</td></tr></table>
   <p><b>unless</b> = if … not: <i>We’ll be late <b>unless</b> we hurry.</i> <b>If I were you</b> — на олимпиаде <i>were</i>, не <i>was</i>.</p>`},
  {h: 'Mixed, wish, it’s time', lvl: 2, html: `
   <ul>
   <li>Mixed: прошлое → сейчас: <i>If I <b>had taken</b> the job, I <b>would live</b> in Paris now.</i></li>
   <li><b>wish + Past</b> — жаль, что сейчас не так: <i>I wish I <b>knew</b>.</i></li>
   <li><b>wish + Past Perfect</b> — жаль, что тогда: <i>I wish I <b>had gone</b>.</i></li>
   <li><b>wish + would</b> — раздражает чужое поведение: <i>I wish you <b>would stop</b> talking.</i> Про себя <i>I wish I would</i> не говорят.</li>
   <li><b>would rather + Past</b> (о другом человеке): <i>I’d rather you <b>didn’t</b> tell her.</i></li>
   <li><b>It’s (high) time + Past</b>: <i>It’s time we <b>went</b>.</i></li>
   </ul>`},
  {h: 'Инверсия', lvl: 2, html: `
   <p>Вспомогательный глагол встаёт <b>перед</b> подлежащим, как в вопросе. Если его нет — появляется <i>do / does / did</i>.</p>
   <table><tr><th>Обычно</th><th>С инверсией</th></tr>
   <tr><td>If you need help…</td><td><b>Should you</b> need help…</td></tr>
   <tr><td>If I were you…</td><td><b>Were I</b> you…</td></tr>
   <tr><td>If I had known…</td><td><b>Had I</b> known…</td></tr>
   <tr><td>I have never seen…</td><td><b>Never have I</b> seen…</td></tr>
   <tr><td>She not only sings…</td><td><b>Not only does she</b> sing…, but she also…</td></tr></table>`},
  {h: 'Инверсия для региона', lvl: 3, html: `
   <ul>
   <li><b>Hardly / Scarcely</b> had I arrived <b>when</b>… · <b>No sooner</b> had I arrived <b>than</b>… (не путать when и than!)</li>
   <li><b>Only then / Only when…</b> did I realise… — инверсия во <b>второй</b> части: <i>Only when I got home <b>did I</b> notice.</i></li>
   <li><b>Not until</b> midnight <b>did</b> he come back.</li>
   <li><b>Little did</b> he know… · <b>Under no circumstances should</b> you… · <b>On no account</b> must you…</li>
   <li><b>Had it not been for</b> your help… = If it hadn’t been for…</li>
   </ul>`},
  {h: 'Существительные-исключения', html: `
   <p><b>Множественное без -s:</b> children, men, women, teeth, feet, geese, mice; sheep, deer, fish, series, species — одинаково в обоих числах.</p>
   <p><b>Греческие и латинские:</b> phenomenon → phenomena, criterion → criteria, crisis → crises, analysis → analyses.</p>
   <p><b>Неисчисляемые (без a / -s):</b> advice, information, news, furniture, luggage, knowledge, progress, equipment, homework, research, weather.</p>
   <p><b>Всегда множественные:</b> trousers, scissors, glasses; <i>the police <b>are</b></i>, <i>people <b>are</b></i>. А <i>news, mathematics, physics</i> — <b>is</b>.</p>`},
  {h: 'Артикли с географией', html: `

   <tr><td>страны с <i>Kingdom, States, Republic</i> и во множественном: <i>the UK, the USA, the Netherlands</i></td><td>но <i>the Great Lakes</i> — группа озёр</td></tr>
   <tr><td>пустыни: <i>the Sahara</i></td><td>улицы, парки, вокзалы: <i>Oxford Street, Hyde Park</i></td></tr></table>`},
  {h: 'Прилагательные и наречия', html: `
   <ul>
   <li><b>hard</b> — усердно, <b>hardly</b> — едва; <b>late</b> — поздно, <b>lately</b> — в последнее время; <b>near</b> — близко, <b>nearly</b> — почти; <b>high</b> — высоко, <b>highly</b> — очень.</li>
   <li><b>further</b> — и «дальше», и «дополнительный» (<i>further information</i>); <b>farther</b> — только о расстоянии.</li>
   <li><b>elder</b> — только о родственниках и только перед существительным: <i>my elder sister</i>; но <i>she is two years <b>older</b> than me</i>.</li>
   <li><b>The more…, the better</b>: <i>The more you read, <b>the more</b> you know.</i></li>
   </ul>`},
  {h: 'Герундий или инфинитив', lvl: 2, html: `
   <p><b>+ -ing:</b> enjoy, avoid, mind, finish, suggest, deny, admit, consider, risk, can’t help, look forward to.</p>
   <p><b>+ to:</b> decide, agree, promise, refuse, manage, afford, hope, offer, plan.</p>
   <table><tr><th>Глагол</th><th>+ to</th><th>+ -ing</th></tr>
   <tr><td>stop</td><td>остановиться, чтобы</td><td>перестать</td></tr>
   <tr><td>remember / forget</td><td>(не) забыть сделать</td><td>помнить / забыть, как сделал</td></tr>
   <tr><td>regret</td><td>с сожалением сообщаю</td><td>жалею, что сделал</td></tr>
   <tr><td>try</td><td>стараться</td><td>попробовать (как эксперимент)</td></tr></table>
   <p class="trap"><i>make sb <b>do</b></i>, но в пассиве <i>be made <b>to do</b></i>. <i>let sb do</i> в пассиве не бывает: <i>be allowed to do</i>.</p>`},
  {h: 'Пассив и каузатив', lvl: 2, html: `
   <ul>
   <li><b>have / get something done</b> — кто-то делает для тебя: <i>I had my hair cut.</i></li>
   <li><b>It is said that he is rich</b> = <b>He is said to be</b> rich.</li>
   <li>О прошлом — перфектный инфинитив: <i>The castle <b>is said to have been built</b> in the 12th century.</i></li>
   </ul>`},
  {h: 'Косвенные вопросы', html: `
   <p>После <i>Could you tell me…, I wonder…, Do you know…</i> — <b>прямой</b> порядок слов и без <i>do/did</i>:</p>
   <p><i>Where <s>is the station</s>?</i> → <i>Could you tell me where <b>the station is</b>?</i></p>
   <p>Вопрос без вопросительного слова → <b>if / whether</b>: <i>She asked <b>if</b> I liked jazz.</i></p>`},

{id: 'wordform', group: 'Use of English', title: 'Словообразование', sub: 'суффиксы, приставки, ловушки', color: '#b5831f',
 lead: 'Задание «Use the word in CAPITALS». Сначала определи, какая часть речи нужна, потом — нужно ли отрицание, и только потом подбирай суффикс.',
 theory: [
  {h: 'Как решать', html: `
   <ol>
   <li><b>Часть речи по месту:</b> после артикля или прилагательного — существительное; перед существительным — прилагательное; при глаголе — наречие.</li>
   <li><b>Число:</b> <i>many, several, a number of</i> → нужно множественное.</li>
   <li><b>Смысл:</b> прочитай предложение целиком — не нужна ли приставка с отрицанием (<i>un-, in-, dis-</i>).</li>
   <li><b>Орфография:</b> ошибка = 0 баллов. Проверь удвоение и выпадение букв.</li>
   </ol>`},
  {h: 'Существительные', html: `
   <table><tr><th>Суффикс</th><th>Примеры</th></tr>
   <tr><td>-tion / -sion</td><td>inform → information, decide → decision</td></tr>
   <tr><td>-ment</td><td>develop → development, achieve → achievement</td></tr>
   <tr><td>-ness</td><td>kind → kindness, aware → awareness</td></tr>
   <tr><td>-ity</td><td>possible → possibility, curious → curiosity</td></tr>
   <tr><td>-ance / -ence</td><td>appear → appearance, differ → difference</td></tr>
   <tr><td>-ship, -hood, -dom</td><td>friendship, childhood, freedom</td></tr>
   <tr><td>-er / -or / -ist / -ant</td><td>teacher, actor, scientist, assistant</td></tr>
   <tr><td>-th</td><td>strong → strength, wide → width, deep → depth, long → length; но high → <b>height</b></td></tr>
   <tr><td>-al, -ure</td><td>arrive → arrival, fail → failure</td></tr></table>`},
  {h: 'Прилагательные', html: `
   <table><tr><th>Суффикс</th><th>Примеры</th></tr>
   <tr><td>-ful / -less</td><td>careful / careless, helpful / helpless</td></tr>
   <tr><td>-ous</td><td>danger → dangerous, fame → famous</td></tr>
   <tr><td>-able / -ible</td><td>comfortable, responsible</td></tr>
   <tr><td>-ive</td><td>create → creative, attract → attractive</td></tr>
   <tr><td>-al, -ic</td><td>nation → national, hero → heroic, science → scientific</td></tr>
   <tr><td>-y, -ish, -ly</td><td>sunny, childish, <b>friendly</b> — это прилагательное!</td></tr></table>`},
  {h: 'Глаголы и наречия', html: `
   <ul>
   <li><b>-en:</b> wide → widen, short → shorten, strength → strengthen</li>
   <li><b>-ise / -ize:</b> real → realise, modern → modernise</li>
   <li><b>-ify:</b> simple → simplify, class → classify</li>
   <li><b>en-:</b> large → enlarge, courage → encourage, able → enable</li>
   <li><b>Наречия-исключения:</b> true → truly, full → fully, whole → wholly, public → publicly, day → daily. От <i>friendly</i> наречия нет: <i>in a friendly way</i>.</li>
   </ul>`},

 theory: [
  {h: 'Правила', html: `
   <ul>
   <li>Ключевое слово нельзя менять: <b>WAS</b> остаётся <i>was</i>, не <i>were</i>.</li>
   <li>Обычно 2–5 слов <b>вместе</b> с ключевым. Сокращения считаются как два слова: <i>didn’t</i> = 2.</li>
   <li>Смысл и время должны совпасть полностью, ничего не добавляй от себя.</li>
   <li>Часто за ответ дают 2 балла (по одному за каждую половину) — пиши, даже если уверена только в части.</li>
   </ul>
   <p class="tip">Сначала найди, <b>что именно</b> проверяется: пассив, косвенная речь, условие? Шаблоны справа покрывают большую часть заданий.</p>`},

   'Bazalgette designed a network of large tunnels that collected the waste before it reached the Thames in central London and carried it far to the east of the city. Much of the work was completed by the mid-1870s. To hide one of the main sewers, he built the Victoria Embankment, which also gave London a new road along the river.',

<script>
/* Olympiad Shelf · движок обеих страниц.
   Данные — window.HUB (data/*.js): полки, у каждой теория, практика, уроки.
   Уровень 1–3 и страна фильтруют и теорию, и задания.
   Ответы хранятся в localStorage и переживают перезагрузку. */
(() => {
'use strict';
const H = window.HUB;
const KEY = 'julia-hub-' + H.id;
const S = {lvl: 1, country: 'all', shelf: H.shelves[0].id, tab: 'theory', ans: {}, drafts: {}};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
function hash(s) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.codePointAt(0)) | 0; return h >>> 0; }
function shuffled(arr, seed) {
  let a = seed || 1; const rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const r = arr.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r;
}

/* ---------- подготовка данных ---------- */
const SCORED = new Set(['mcq', 'tf', 'yn', 'gap', 'tr', 'match', 'order']);
const ITEMS = {};            // id → {item, shelf, parent}
H.shelves.forEach(sh => {
  const seen = {};
  const reg = (it, parent) => {
    const base = sh.id + '-' + hash(it.t + '|' + (it.q || it.s1 || it.title || it.prompt || JSON.stringify(it.pairs || it.items || ''))).toString(36);
    seen[base] = (seen[base] || 0) + 1;
    it.id = seen[base] > 1 ? base + '-' + seen[base] : base;
    ITEMS[it.id] = {item: it, shelf: sh, parent};
  };
  (sh.practice || []).forEach(it => { reg(it); if (it.t === 'read') it.items.forEach(x => reg(x, it)); });
});
if (!H.shelves.some(s => s.id === S.shelf)) S.shelf = H.shelves[0].id;
const fromHash = () => { const [sh, tab] = decodeURIComponent(location.hash.slice(1)).split('/'); if (H.shelves.some(s => s.id === sh) || sh === '_mistakes') S.shelf = sh; if (['theory', 'practice', 'lessons'].includes(tab)) S.tab = tab; };
fromHash();

const lvlOK = x => (x.lvl || 1) <= S.lvl;
const cOK = x => S.country === 'all' || (x.c && [].concat(x.c).includes(S.country));
const vis = x => lvlOK(x) && cOK(x);
function scored(sh) {
  const out = [];
  (sh.practice || []).forEach(it => {
    if (!vis(it)) return;
    if (it.t === 'read') it.items.forEach(x => { if (lvlOK(x)) out.push(x); });
    else if (SCORED.has(it.t)) out.push(it);
  });
  return out;
}
const done = list => list.filter(x => S.ans[x.id] && S.ans[x.id].ok).length;
const lvLabel = n => (H.levels[n - 1] || {}).short || n;
const cLabel = c => (H.countries || []).find(x => x[0] === c)?.[1] || c;
const chips = x => ((x.lvl || 1) > 1 ? `<span class="lv l${x.lvl}">${lvLabel(x.lvl)}</span>` : '') +
  (H.countries && x.c ? [].concat(x.c).map(c => `<span class="flag">${cLabel(c)}</span>`).join('') : '');

/* ---------- верхняя панель ---------- */
function top() {
  const lv = $('.levels'); lv.innerHTML = '';
  H.levels.forEach((l, i) => {
    const b = el('button', S.lvl === i + 1 ? 'on' : '', `${l.label}<small>${l.sub}</small>`);
    b.onclick = () => { S.lvl = i + 1; save(); all(); };
    lv.append(b);
  });
  const cs = $('.countries'); cs.innerHTML = '';
  (H.countries || []).forEach(([id, name]) => {
    const b = el('button', S.country === id ? 'on' : '', name);
    b.onclick = () => { S.country = id; save(); all(); };
    cs.append(b);
  });
  meters();
}
function meters() {
  let d = 0, t = 0;
  H.shelves.forEach(sh => { const l = scored(sh); d += done(l); t += l.length; });
  $('.total').textContent = `✓ ${d} / ${t}`;
  document.querySelectorAll('.book[data-id]').forEach(b => {
    const sh = H.shelves.find(s => s.id === b.dataset.id); if (!sh) return;
    const l = scored(sh), n = done(l);
    b.querySelector('.meter').innerHTML = `${n}/${l.length}<b style="--p:${l.length ? n / l.length * 100 : 0}%"></b>`;
  });
  const m = document.querySelector('.book[data-id="_mistakes"] .meter');
  if (m) m.textContent = mistakes().length || '';
  const tp = document.querySelector('.tabs [data-tab="practice"] small');
  const sh = H.shelves.find(s => s.id === S.shelf);
  if (tp && sh) { const l = scored(sh); tp.textContent = `${done(l)}/${l.length}`; }
}

/* ---------- полки слева ---------- */
function side() {
  const a = $('.shelves'); a.innerHTML = '';
  let group = null;
  H.shelves.forEach((sh, i) => {
    if (sh.group && sh.group !== group) { group = sh.group; a.append(el('h2', '', group)); }
    const b = el('button', 'book' + (S.shelf === sh.id ? ' on' : ''),
      `<i></i><span>${sh.title}<em>${sh.sub || ''}</em></span><div class="meter"></div>`);
    b.dataset.id = sh.id; b.style.setProperty('--c', sh.color);
    b.onclick = () => go(sh.id, S.tab === 'lessons' && !(sh.lessons || []).length ? 'theory' : S.tab);
    a.append(b);
  });
  a.append(el('h2', '', 'Повторение'));
  const m = el('button', 'book' + (S.shelf === '_mistakes' ? ' on' : ''),
    '<i></i><span>Работа над ошибками<em>всё, что решено неверно</em></span><div class="meter"></div>');
  m.dataset.id = '_mistakes'; m.style.setProperty('--c', '#b23a2b');
  m.onclick = () => go('_mistakes', 'practice');
  a.append(m);
  const r = el('button', 'reset', 'Сбросить все ответы на этой странице');
  r.onclick = () => { if (confirm('Стереть все ответы и черновики на этой странице?')) { S.ans = {}; S.drafts = {}; save(); all(); } };
  a.append(r);
}
function go(id, tab) {
  S.shelf = id; S.tab = tab || 'theory'; save();
  history.replaceState(null, '', '#' + id + '/' + S.tab);
  side(); shelf(); meters(); $('.shelf').focus({preventScroll: true}); window.scrollTo(0, 0);
}

/* ---------- полка ---------- */
let SHUFFLE = false, HIDE_DONE = false;
function shelf() {
  const main = $('.shelf'); main.innerHTML = '';
  if (S.shelf === '_mistakes') return mistakesView(main);
  const sh = H.shelves.find(s => s.id === S.shelf);
  main.style.setProperty('--c', sh.color);
  const idx = H.shelves.indexOf(sh) + 1;
  main.append(el('div', 'head', `<div><div class="num">Полка ${idx}${sh.group ? ' · ' + sh.group : ''}</div><h1>${sh.title}</h1>${sh.lead ? `<p>${sh.lead}</p>` : ''}</div>`));
  const th = (sh.theory || []).filter(vis), les = (sh.lessons || []).filter(lvlOK), sc = scored(sh);
  if (S.tab === 'lessons' && !les.length) S.tab = 'theory';
  const tabs = el('div', 'tabs');
  [['theory', 'Теория', th.length], ['practice', 'Практика', `${done(sc)}/${sc.length}`], ['lessons', 'Уроки и материалы', les.length]].forEach(([id, name, n]) => {
    if (id === 'lessons' && !les.length) return;
    const b = el('button', S.tab === id ? 'on' : '', `${name}<small>${n}</small>`);
    b.dataset.tab = id; b.onclick = () => go(sh.id, id);
    tabs.append(b);
  });
  main.append(tabs);
  if (S.tab === 'theory') theory(main, th);
  else if (S.tab === 'practice') practice(main, sh);
  else lessons(main, les);
}
function theory(main, list) {
  if (!list.length) return main.append(el('div', 'empty', S.country !== 'all' ? 'На этой полке нет теории по выбранной стране — переключи страну на «Все».' : 'Теории на этом уровне нет.'));
  const g = el('div', 'theory');
  list.forEach(b => g.append(el('section', 'note' + (b.wide ? ' wide' : ''), `<h3>${b.h}${chips(b)}</h3>${b.html}`)));
  main.append(g);
}
function lessons(main, list) {
  const g = el('div', 'lessons');
  list.forEach(l => g.append(el('a', 'lesson', `<b>${l.title}</b><span>${l.note}</span><em>${l.kind || 'Открыть урок'} →</em>`)));
  [...g.children].forEach((a, i) => { a.href = list[i].href; a.target = '_blank'; a.rel = 'noopener'; });
  main.append(g);
}
function practice(main, sh) {
  let list = (sh.practice || []).filter(vis);
  const tools = el('div', 'tools');
  const b1 = el('button', SHUFFLE ? 'on' : '', 'Перемешать'); b1.onclick = () => { SHUFFLE = !SHUFFLE; shelf(); };
  const b2 = el('button', HIDE_DONE ? 'on' : '', 'Скрыть решённые верно'); b2.onclick = () => { HIDE_DONE = !HIDE_DONE; shelf(); };
  tools.append(b1, b2, el('span', '', 'Ответ проверяется сразу. Неверные попадают в «Работу над ошибками».'));
  main.append(tools);
  if (SHUFFLE) list = shuffled(list, (Date.now() / 60000) | 0);
  if (HIDE_DONE) list = list.filter(it => it.t === 'read' ? it.items.some(x => lvlOK(x) && !(S.ans[x.id] && S.ans[x.id].ok)) : !(S.ans[it.id] && S.ans[it.id].ok));
  if (!list.length) return main.append(el('div', 'empty', S.country !== 'all' ? 'По выбранной стране здесь заданий нет — переключи страну на «Все».' : 'Здесь всё решено. Можно выключить фильтр или перейти на другую полку.'));
  const g = el('div', 'tasks'); let n = 0;
  list.forEach(it => {
    if (it.t === 'read') { g.append(readBlock(it, () => ++n)); return; }
    g.append(item(it, SCORED.has(it.t) ? ++n : null));
  });
  main.append(g);
}
function mistakes() {
  const out = [];
  H.shelves.forEach(sh => scored(sh).forEach(x => { const a = S.ans[x.id]; if (a && !a.ok) out.push(x); }));
  return out;
}
function mistakesView(main) {
  main.style.setProperty('--c', '#b23a2b');
  main.append(el('div', 'head', '<div><div class="num">Повторение</div><h1>Работа над ошибками</h1><p>Все задания, решённые неверно, со всех полок этой страницы. Нажми «ещё раз» и реши заново — верное решение уберёт задание из списка.</p></div>'));
  const list = mistakes();
  if (!list.length) return main.append(el('div', 'empty', 'Ошибок нет. Или ещё ничего не решено :)'));
  const g = el('div', 'tasks');
  list.forEach((x, i) => {
    const node = item(x, i + 1);
    const info = ITEMS[x.id];
    node.querySelector('.meta').insertAdjacentHTML('beforeend', `<span class="src">${info.shelf.title}</span>`);
    if (info.parent) node.insertAdjacentHTML('afterbegin', `<details style="margin-bottom:10px"><summary>Текст «${info.parent.title}»</summary><div class="passage" style="position:static;margin-top:8px">${info.parent.paras.map(p => `<p>${p}</p>`).join('')}</div></details>`);
    g.append(node);
  });
  main.append(g);
}

/* ---------- задания ---------- */
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[“”]/g, '"')
    .replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not')
    .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will')
    .replace(/\bcan not\b/g, 'cannot').replace(/[.,!?;:]+$/g, '').replace(/\s+/g, ' ').trim();
}
function item(it, n) {
  const box = el('div', 'task' + (it.wide ? ' wide' : ''));
  box.dataset.id = it.id;
  paint(box, it, n);
  return box;
}
function answered(box, it, ok) {
  box.classList.toggle('ok', ok === true); box.classList.toggle('bad', ok === false);
}
function repaint(box, it, n) { box.innerHTML = ''; paint(box, it, n); meters(); }
function retryBtn(box, it, n) {
  const r = el('button', 'retry', 'ещё раз');
  r.onclick = () => { delete S.ans[it.id]; save(); box.className = 'task' + (it.wide ? ' wide' : ''); repaint(box, it, n); };
  box.append(r);
}
function whyHTML(it, lead) { return `<div class="why">${lead ? `<span class="ans">${lead}</span> ` : ''}${it.why || ''}</div>`; }

function paint(box, it, n) {
  const st = S.ans[it.id];
  if (SCORED.has(it.t)) box.append(el('div', 'meta', `${n != null ? `<span class="n">${n}</span>` : ''}${chips(it)}${it.src ? `<span class="src">${it.src}</span>` : ''}`));
  answered(box, it, st ? st.ok : null);
  ({mcq: choice, tf: choice, yn: choice, gap: typed, tr: typed, match, order, write, speak})[it.t](box, it, n, st);
  if (st && SCORED.has(it.t)) retryBtn(box, it, n);
}

function choice(box, it, n, st) {
  let opts, right;
  if (it.t === 'tf') { opts = it.labels || ['True', 'False', 'Not stated']; right = {T: 0, F: 1, NS: 2}[it.a]; }
  else if (it.t === 'yn') { opts = it.labels || ['Правда', 'Миф']; right = it.a ? 0 : 1; }
  else { opts = it.o; right = it.a; }
  box.append(el('p', 'q', it.q));
  const order = it.t === 'mcq' && !it.fixed ? shuffled(opts.map((_, i) => i), hash(it.id)) : opts.map((_, i) => i);
  const row = el('div', 'opts');
  order.forEach(i => {
    const b = el('button', 'opt', opts[i]);
    if (st) { b.disabled = true; if (i === right) b.classList.add('right'); else if (i === st.v) b.classList.add('wrong'); }
    else b.onclick = () => { S.ans[it.id] = {ok: i === right, v: i}; save(); repaint(box, it, n); };
    row.append(b);
  });
  box.append(row);
  if (st) box.insertAdjacentHTML('beforeend', whyHTML(it, st.ok ? 'Верно.' : `Ответ: ${opts[right].replace(/[.!?]$/, '')}.`));
}

function typed(box, it, n, st) {
  const gapped = s => s.replace(/_{3,}/g, '<span class="gap"></span>');
  if (it.t === 'tr') {
    box.append(el('p', 'q', `${it.s1}<br><span class="key">${it.key}</span><br>${gapped(it.s2)}`));
  } else {
    box.append(el('p', 'q', gapped(it.q) + (it.hint ? ` <span class="key">${it.hint}</span>` : '')));
  }
  const line = el('div', 'line');
  const inp = el('input'); inp.placeholder = it.t === 'tr' ? 'пропущенная часть: 2–5 слов' : 'ответ'; inp.spellcheck = false; inp.autocomplete = 'off';
  const check = () => {
    const v = inp.value.trim(); if (!v) return inp.focus();
    S.ans[it.id] = {ok: it.a.map(norm).includes(norm(v)), v}; save(); repaint(box, it, n);
  };
  if (st) { inp.value = st.v || '—'; inp.disabled = true; line.append(inp); }
  else {
    inp.onkeydown = e => { if (e.key === 'Enter') check(); };
    const b = el('button', 'btn', 'Проверить'); b.onclick = check;
    const g = el('button', 'btn ghost', 'Не знаю'); g.onclick = () => { S.ans[it.id] = {ok: false, v: ''}; save(); repaint(box, it, n); };
    line.append(inp, b, g);
  }
  box.append(line);
  if (st) {
    const alt = it.a.length > 1 ? ` <span style="color:var(--muted)">Засчитывается также: ${it.a.slice(1).map(esc).join(' · ')}</span>` : '';
    box.insertAdjacentHTML('beforeend', whyHTML(it, (st.ok ? 'Верно: ' : 'Ответ: ') + esc(it.a[0]) + '.') .replace('</div>', alt + '</div>'));
  }
}

const PAL = ['#27365f', '#c8553d', '#2a7f7a', '#b5831f', '#6d4c8c', '#3d6fb0', '#7a8b3a', '#a03a6a', '#44546a', '#8a5a2b', '#1f7a5a', '#5a3fa0'];
const DRAFT = {};
function match(box, it, n, st) {
  if (it.q) box.append(el('p', 'q', it.q));
  const rights = shuffled(it.pairs.map((_, i) => i), hash(it.id));
  const d = DRAFT[it.id] || (DRAFT[it.id] = {sel: null, map: {}});
  const map = st ? st.v : d.map;
  const wrap = el('div', 'match'), L = el('div', 'col'), R = el('div', 'col');
  const tagOf = li => `<span class="tag" style="background:${PAL[li % PAL.length]}">${li + 1}</span>`;
  it.pairs.forEach(([l], li) => {
    const b = el('button', '', `${l}${map[li] != null ? tagOf(li) : ''}`);
    if (st) { b.disabled = true; b.classList.add(map[li] === li ? 'right' : 'wrong'); }
    else { if (d.sel === li) b.classList.add('sel'); b.onclick = () => { d.sel = d.sel === li ? null : li; repaint(box, it, n); }; }
    L.append(b);
  });
  rights.forEach(ri => {
    const owner = Object.keys(map).find(k => map[k] === ri);
    const b = el('button', '', `${it.pairs[ri][1]}${owner != null ? tagOf(+owner) : ''}`);
    if (st) b.disabled = true;
    else b.onclick = () => {
      if (d.sel == null) return;
      Object.keys(d.map).forEach(k => { if (d.map[k] === ri) delete d.map[k]; });
      d.map[d.sel] = ri; d.sel = null; repaint(box, it, n);
    };
    R.append(b);
  });
  wrap.append(L, R); box.append(wrap);
  if (!st) {
    const a = el('div', 'actions');
    const full = Object.keys(d.map).length === it.pairs.length;
    const c = el('button', 'btn', full ? 'Проверить' : `Соедини все пары: ${Object.keys(d.map).length}/${it.pairs.length}`);
    c.disabled = !full; c.style.opacity = full ? 1 : .55;
    c.onclick = () => { const ok = it.pairs.every((_, i) => d.map[i] === i); S.ans[it.id] = {ok, v: {...d.map}}; delete DRAFT[it.id]; save(); repaint(box, it, n); };
    const hint = el('span', '', 'Нажми слева, потом справа.'); hint.style.cssText = 'color:var(--muted);font-size:13.5px;align-self:center';
    a.append(c, hint); box.append(a);
  } else {
    const wrong = it.pairs.filter((_, i) => map[i] !== i);
    box.insertAdjacentHTML('beforeend', whyHTML(it, st.ok ? 'Все пары верны.' : 'Верно: ' + wrong.map(([l, r]) => `${l} — ${r}`).join('; ') + '.'));
  }
}

function order(box, it, n, st) {
  box.append(el('p', 'q', it.q));
  const d = DRAFT[it.id] || (DRAFT[it.id] = {seq: []});
  const seq = st ? st.v : d.seq;
  const w = el('div', 'order'), s = el('div', 'seq'), p = el('div', 'pool');
  seq.forEach((i, k) => {
    const b = el('button', 'chip', it.items[i]);
    if (st) { b.disabled = true; b.classList.add(i === k ? 'right' : 'wrong'); }
    else b.onclick = () => { d.seq.splice(k, 1); repaint(box, it, n); };
    s.append(b);
  });
  if (!st) shuffled(it.items.map((_, i) => i), hash(it.id)).filter(i => !seq.includes(i)).forEach(i => {
    const b = el('button', 'chip', it.items[i]); b.onclick = () => { d.seq.push(i); repaint(box, it, n); }; p.append(b);
  });
  w.append(s); if (!st) w.append(p); box.append(w);
  if (!st) {
    const a = el('div', 'actions'), full = d.seq.length === it.items.length;
    const c = el('button', 'btn', full ? 'Проверить' : `Выстрой все: ${d.seq.length}/${it.items.length}`);
    c.disabled = !full; c.style.opacity = full ? 1 : .55;
    c.onclick = () => { const ok = d.seq.every((v, k) => v === k); S.ans[it.id] = {ok, v: d.seq.slice()}; delete DRAFT[it.id]; save(); repaint(box, it, n); };
    const hint = el('span', '', 'Нажимай по порядку; нажатие в строке убирает пункт.'); hint.style.cssText = 'color:var(--muted);font-size:13.5px;align-self:center';
    a.append(c, hint); box.append(a);
  } else box.insertAdjacentHTML('beforeend', whyHTML(it, st.ok ? 'Порядок верный.' : 'Верный порядок: ' + it.items.join(' → ') + '.'));
}

function readBlock(it, next) {
  const w = el('div', 'task wide read'); w.style.cssText = 'background:none;border:0;padding:0';
  w.append(el('div', 'passage', `<h3>${it.title}</h3>${it.intro ? `<p style="font-family:var(--sans);font-size:14.5px;color:var(--muted)">${it.intro}</p>` : ''}${it.paras.map((p, i) => `<p>${it.numbered ? `<span class="pn">${i + 1}</span>` : ''}${p}</p>`).join('')}`));
  const qs = el('div', 'qs');
  it.items.filter(lvlOK).forEach(x => qs.append(item(x, next())));
  w.append(qs);
  return w;
}

function words(t) { return (t.match(/[A-Za-zА-Яа-яЁё0-9][A-Za-zА-Яа-яЁё0-9'’-]*/g) || []).length; }
function write(box, it) {
  box.className = 'tool';
  const lim = S.drafts[it.id + ':lim'] || [it.min, it.max];
  box.innerHTML = `<h3>${it.title}</h3><div class="q">${it.prompt}</div>
    <div class="bar"><span>Лимит слов: от <input type="number" class="mn" value="${lim[0]}"> до <input type="number" class="mx" value="${lim[1]}"></span><span class="count">0</span><span class="zone"></span></div>`;
  const ta = el('textarea'); ta.placeholder = 'Пиши здесь. Текст сохраняется в браузере.'; ta.value = S.drafts[it.id] || ''; ta.spellcheck = true; ta.lang = 'en';
  const ul = el('ul', 'checks');
  box.append(ta, ul);
  const upd = () => {
    const t = ta.value, n = words(t), mn = +box.querySelector('.mn').value || 0, mx = +box.querySelector('.mx').value || 0;
    S.drafts[it.id] = t; S.drafts[it.id + ':lim'] = [mn, mx]; save();
    box.querySelector('.count').textContent = n + ' сл.';
    const z = box.querySelector('.zone');
    const [cls, txt] = !n ? ['', ''] : n < mn * 0.9 ? ['bad', `меньше ${Math.ceil(mn * 0.9)} — по критериям работу могут не проверить (0 баллов)`] : n < mn ? ['warn', `чуть меньше нормы: допускается до −10%, но лучше добрать до ${mn}`] :
      n <= mx ? ['good', 'в норме'] : n <= mx * 1.1 ? ['warn', 'чуть больше нормы: допускается до +10%'] : ['bad', `слишком длинно — обычно проверяют только первые ${mx} слов`];
    z.className = 'zone ' + cls; z.textContent = txt;
    const paras = t.split(/\n\s*\n|\n/).filter(x => words(x) > 0).length;
    ul.innerHTML = (it.checks || []).map(c => {
      const hit = c.paras ? paras >= c.paras : new RegExp(c.re, 'gi').test(t);
      const cls2 = c.warn ? (hit ? 'warn' : 'on') : (hit ? 'on' : '');
      return `<li class="${cls2}">${c.warn && hit ? c.warn : c.label}${c.paras ? ` <span style="color:var(--muted)">(сейчас ${paras})</span>` : ''}</li>`;
    }).join('');
  };
  ta.oninput = upd; box.querySelectorAll('input').forEach(i => i.oninput = upd); upd();
}

let TIMER = null;
function speak(box, it) {
  box.className = 'tool';
  box.innerHTML = `<h3>${it.title}</h3><div class="q">${it.prompt}</div><div class="clock">0:00<small>готова?</small></div><div class="actions"></div>`;
  const clock = box.querySelector('.clock'), act = box.querySelector('.actions');
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const run = (sec, label, then) => {
    clearInterval(TIMER); let left = sec;
    const tick = () => { clock.innerHTML = `${fmt(left)}<small>${label}</small>`; if (left-- <= 0) { clearInterval(TIMER); then && then(); } };
    tick(); TIMER = setInterval(tick, 1000);
  };
  const b1 = el('button', 'btn', `Подготовка ${fmt(it.prep)}`), b2 = el('button', 'btn', `Ответ ${fmt(it.talk)}`), b3 = el('button', 'btn ghost', 'Стоп');
  b1.onclick = () => run(it.prep, 'подготовка', () => run(it.talk, 'говори!', () => { clock.innerHTML = `0:00<small>время вышло</small>`; }));
  b2.onclick = () => run(it.talk, 'говори!', () => { clock.innerHTML = `0:00<small>время вышло</small>`; });
  b3.onclick = () => { clearInterval(TIMER); clock.innerHTML = `0:00<small>остановлено</small>`; };
  act.append(b1, b2, b3);
}

function all() { top(); side(); shelf(); meters(); }
window.addEventListener('hashchange', () => { fromHash(); side(); shelf(); meters(); });
all();
window.__hub = {S, ITEMS, norm, all};
})();

</script>
