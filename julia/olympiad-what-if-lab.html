*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background-color:var(--paper);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
 background-size:24px 24px;font:13.5px/1.42 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:760;letter-spacing:-.02em;line-height:1.1}
h1{font-size:26px} h2{font-size:15.5px} h3{font-size:13px;font-weight:720}
p{margin:0 0 5px} p:last-child{margin-bottom:0}
a{color:var(--sky);font-weight:650;text-underline-offset:2px}
s{color:var(--bad);text-decoration-thickness:2px}
.ru{font-family:var(--serif);font-style:italic;color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:#fff;border:1px solid var(--line2);border-radius:9px;padding:4px 10px;
 font-size:11.5px;font-weight:650;line-height:1.3;transition:background .12s,transform .12s,box-shadow .12s}
button:hover:not(:disabled){background:var(--rcbg)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--rc);border-color:var(--rc);color:#fff}
button.primary:hover:not(:disabled){filter:brightness(.92);background:var(--rc)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
input,textarea{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:3px 7px;font-size:12.5px;width:100%;max-width:100%}
textarea{resize:none;line-height:1.42}
.good{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.shown{border-style:dashed!important;color:var(--muted)}

/* ---------- chrome ---------- */
.topbar{height:var(--h);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .state{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:9px}
.sky{position:relative;width:196px;height:20px;border-radius:12px;overflow:hidden;
 background:linear-gradient(90deg,#ffe3b3 0%,#ffd166 16%,#bfe3c9 30%,#a9d5ee 46%,#8fd3cf 58%,#f3b0c6 70%,#8aa0f0 84%,#1d2640 100%);
 border:1px solid var(--line2)}
.sky i{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75)}
.sky b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;
 box-shadow:0 0 0 3px var(--rc),0 0 10px var(--rc);transition:left .45s cubic-bezier(.5,1.6,.5,1)}
.xp{font-weight:800;font-size:12px;background:var(--gold);padding:2px 9px;border-radius:7px;font-variant-numeric:tabular-nums}
.xp.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:12px;background:var(--ink);color:#fff;padding:2px 9px;border-radius:7px}
.clock.late{background:var(--bad)}
.tool{padding:3px 8px;font-size:11px}
.botbar{height:var(--f);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--card);border-top:1px solid var(--line);
 font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.botbar .sheetno{font-weight:800;color:var(--ink);font-size:12px}
.botbar .rungname{font-weight:750;color:var(--rc);letter-spacing:.08em;text-transform:uppercase;font-size:9.5px}
.botbar .nav{margin-left:auto;display:flex;gap:6px}
.botbar .nav button{width:30px;height:22px;padding:0;display:grid;place-items:center}

/* ---------- sheet ---------- */
main{padding:12px 20px}
.sheet{display:flex;flex-direction:column}
.eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:4px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:780;color:var(--muted)}
.eyebrow .no{color:var(--rc)}
.pill{border-radius:20px;padding:1px 9px;font-size:8.5px;letter-spacing:.1em;background:var(--rc);color:#fff}
.badge{border:1px solid var(--line2);border-radius:20px;padding:1px 8px;font-size:8.5px;letter-spacing:.08em;background:#fff}
.real{display:inline-block;background:var(--gold);color:var(--ink);border-radius:5px;padding:0 6px;font-size:8.5px;letter-spacing:.08em;
 text-transform:uppercase;font-weight:800;vertical-align:1px}
h1 .acc{color:var(--rc)}
.lead{font-size:12.5px;color:var(--muted);margin:3px 0 9px;max-width:92ch}
.small{font-size:11px;color:var(--muted)}
.tag{display:block;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:780;color:var(--muted);margin-bottom:4px}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) 300px} .g-side2{grid-template-columns:330px minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
.card.acc{border-color:var(--rc);box-shadow:0 0 0 3px var(--rcbg)}
.card.tint{background:var(--rcbg);border-color:transparent}
.card.dark{background:var(--ink);color:#f5f1e8;border-color:var(--ink)}
.card.dark .small,.card.dark .tag{color:#b9c0d8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- tools ---------- */
.toolrow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.toolrow .score{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px}
.whybar{flex:1 1 260px;min-height:26px;font-size:11.5px;color:var(--muted);background:#fff;border:1px dashed var(--line2);border-radius:8px;padding:4px 9px}
.whybar b{color:var(--ink)}
[data-why]{cursor:help}

/* ---------- gap lists ---------- */
.gaps{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;counter-reset:q}
.gq{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;align-items:baseline;font-size:12.5px}
.gq>i{font-style:normal;font-weight:800;color:var(--rc);font-size:11px}
.gq input{display:inline-block;width:150px;margin:0 3px;padding:1px 6px}
.gq input.w{width:210px}
.cue{font-size:10.5px;color:var(--muted);font-style:italic;white-space:nowrap}
.gq .sit{display:block;font-size:11px;color:var(--muted)}

/* ---------- choice buttons ---------- */
.choice{display:inline-flex;gap:4px;flex-wrap:wrap}
.choice button{padding:3px 9px;font-size:11.5px;border-radius:8px}
.choice button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.choice.good button[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.choice.bad button[aria-pressed=true]{background:var(--bad);border-color:var(--bad)}
.choice.good,.choice.bad{background:none!important;border:0}

/* ---------- hook ---------- */
.bigq{font-family:var(--serif);font-size:30px;line-height:1.28;letter-spacing:-.01em;margin:4px 0 8px}
.chunk{font:inherit;font-size:inherit;border:0;border-radius:8px;padding:0 5px;margin:0 1px;background:transparent;
 border-bottom:3px solid var(--line2);cursor:pointer;line-height:1.3}
.chunk:nth-of-type(1){border-color:#f26b3a}.chunk:nth-of-type(2){border-color:#2386b5}
.chunk:nth-of-type(3){border-color:#2f9e62}.chunk:nth-of-type(4){border-color:#d6457a}
.chunk.on{background:var(--rcbg)}
.gloss{min-height:58px;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.flip{perspective:600px;height:112px;border:0;padding:0;background:none}
.flip>div{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center}
.flip .f{background:var(--ink);color:var(--gold);font-weight:800;font-size:17px}
.flip .f small{display:block;font-size:9px;letter-spacing:.14em;color:#b9c0d8;font-weight:650;margin-top:3px}
.flip .b{background:#fff;border:1px solid var(--line);transform:rotateY(180deg);font-size:10.8px;line-height:1.3;font-weight:500}
.model{font-family:var(--serif);font-size:14px;background:var(--rcbg);border-radius:9px;padding:6px 10px;margin-top:6px}
.locked{filter:blur(5px);user-select:none;pointer-events:none}
.qz{display:grid;gap:6px}
.qz .q{font-size:12px;font-weight:650}

/* ---------- ladder ---------- */
.ladder{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;align-items:end;height:330px;margin:4px 0 10px}
.step{display:flex;flex-direction:column;justify-content:flex-end;text-align:left;border-radius:12px 12px 6px 6px;padding:9px;color:#fff;border:0;min-width:0}
.step b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.step span{font-size:12.5px;font-weight:700;line-height:1.2;margin:3px 0}
.step em{font-style:normal;font-size:10px;opacity:.85}
.step .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:6px;overflow:hidden}
.step .bar i{display:block;height:100%;background:#fff}
.step:hover:not(:disabled){filter:brightness(1.08);background:var(--c)}

/* ---------- rule cards ---------- */
.rules{display:grid;gap:8px}
.rule{display:grid;grid-template-columns:78px minmax(0,1fr);gap:9px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 10px}
.rule>b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rc);padding-top:2px}
.rule .f{font-weight:760;font-size:13px}
.rule .ex{font-family:var(--serif);font-style:italic;font-size:13px}

/* ---------- switcher ---------- */
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--rc);color:#fff;border-color:var(--rc)}
.machine{background:var(--ink);color:#fbf7ef;border-radius:16px;padding:14px 18px;min-height:150px;position:relative;overflow:hidden}
.machine .sent{font-family:var(--serif);font-size:25px;line-height:1.3;margin:6px 0}
.machine .sent u{text-decoration:none;color:var(--gold);border-bottom:2px solid var(--gold)}
.machine .meta{display:flex;gap:10px;font-size:11px;color:#b9c0d8;flex-wrap:wrap}
.machine .meta .ru{color:#d4d9ea}
.machine .dial{position:absolute;right:14px;top:12px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:20px}
.machine.anim .sent{animation:slide .35s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(8px)}}
.sortlist{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}
.sortq{display:flex;align-items:center;gap:8px;font-size:12px;justify-content:space-between;border-bottom:1px dotted var(--line2);padding:3px 0}

/* ---------- linkers ---------- */
.lcards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 9px;font-size:11.2px;line-height:1.3}
.lcard b{display:block;color:var(--rc);font-size:12.5px}
.lcard i{display:block;font-family:var(--serif);font-size:12px;margin:2px 0}
.mcq{display:grid;gap:5px}
.mq{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;font-size:12px}
.mq>i{font-style:normal;font-weight:800;color:var(--rc)}

/* ---------- KWT ---------- */
.kwts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kwt{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:12px;display:grid;gap:3px}
.kwt .s1{color:var(--muted)}
.kwt .key{justify-self:start;font-weight:850;letter-spacing:.12em;background:var(--ink);color:var(--gold);border-radius:5px;padding:0 7px;font-size:11px}
.kwt .s2 input{display:inline-block;width:215px;padding:1px 6px;margin:0 2px}
.kwt .foot{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--muted)}
.wc{font-weight:750;border-radius:5px;padding:0 5px;background:#f1ece0}
.wc.ok{background:var(--okbg);color:var(--ok)} .wc.no{background:var(--badbg);color:var(--bad)}

/* ---------- wish lanes ---------- */
.lanes{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.lane{border-radius:12px;padding:8px 9px;background:#fff;border:1px solid var(--line);font-size:11px;line-height:1.3;border-top:5px solid var(--rc)}
.lane b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}
.lane .f{font-weight:760;font-size:11.8px;margin:2px 0}
.lane .ex{font-family:var(--serif);font-size:13px}
.lane .ex u{text-decoration:none;background:var(--gold);padding:0 2px;border-radius:3px}

/* ---------- mixed diagram ---------- */
.mixd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mixd svg{width:100%;height:auto;display:block}

/* ---------- tiles ---------- */
.forge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 9px}
.tbox .orig{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.built{min-height:30px;border:1.5px dashed var(--line2);border-radius:8px;padding:3px;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.built.good{border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:4px}
.tile{padding:3px 8px;font-size:12px;border-radius:7px;background:var(--rcbg);border-color:transparent;font-weight:650}
.built .tile{background:var(--ink);color:#fff}
.tile.used{visibility:hidden}

/* ---------- judge ---------- */
.judge{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.jq{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12.5px;border-bottom:1px dotted var(--line2);padding:4px 0}
.jq .fix{display:block;font-size:11px;color:var(--ok);font-weight:650}

/* ---------- spot ---------- */
.spot{font-family:var(--serif);font-size:15px;line-height:1.55}
.spot .w{font:inherit;border:0;background:none;padding:0 1px;border-radius:4px;cursor:pointer}
.spot .w.sel{background:var(--gold)}
.spot.good .w.sel{background:var(--okbg);box-shadow:inset 0 -2px var(--ok)}
.spot.bad .w.sel{background:var(--badbg);box-shadow:inset 0 -2px var(--bad)}
.spot.shownk .w.key{box-shadow:inset 0 -3px var(--rc)}

/* ---------- family ---------- */
table.fam{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
table.fam th,table.fam td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.fam th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
table.fam tr:last-child td{border-bottom:0}
table.fam td b{color:var(--rc)}
.conv .out{font-family:var(--serif);font-size:21px;line-height:1.3;min-height:58px;margin:6px 0}
.conv .out b{color:var(--gold)}

/* ---------- history ---------- */
.hist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hitem{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 9px;display:grid;gap:4px}
.hitem .fact{font-size:11.5px;color:var(--muted)}
.hitem textarea{font-family:var(--serif);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:9.5px;font-weight:750;border-radius:20px;padding:1px 7px;background:#f1ece0;color:var(--muted)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.no{background:var(--badbg);color:var(--bad)}

/* ---------- passage (cloze) ---------- */
.passage{font-family:var(--serif);font-size:14.5px;line-height:1.72;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.passage h2{font-family:var(--sans);margin-bottom:5px}
.gap{white-space:nowrap}
.gap .n{font-family:var(--sans);font-size:9.5px;font-weight:850;color:#fff;background:var(--rc);border-radius:4px;padding:0 4px;margin-right:2px;vertical-align:2px}
.gap input{display:inline-block;width:86px;padding:0 5px;font-family:var(--sans);font-size:12.5px}
.lines{display:grid;gap:4px}
.line{display:grid;grid-template-columns:22px minmax(0,1fr) 110px;gap:8px;align-items:center;font-family:var(--serif);font-size:14px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px 9px}
.line i{font-family:var(--sans);font-style:normal;font-weight:800;color:var(--rc);font-size:11px}

/* ---------- sprint ---------- */
.pace{display:flex;gap:4px;margin:4px 0 10px}
.pace button{flex:1;height:22px;padding:0;font-size:10px;border-radius:6px}
.pace button.ans{background:var(--rcbg)} .pace button.cur{background:var(--ink);color:#fff}
.pace button.r{background:var(--ok);color:#fff;border-color:var(--ok)} .pace button.w{background:var(--bad);color:#fff;border-color:var(--bad)}
.sq{font-family:var(--serif);font-size:30px;line-height:1.3;margin:14px 0 16px;min-height:80px}
.sopts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sopts button{font-size:17px;padding:12px 14px;text-align:left;border-radius:12px}
.sopts button b{color:var(--rc);margin-right:8px}
.sopts button.r{background:var(--okbg);border-color:var(--ok)} .sopts button.w{background:var(--badbg);border-color:var(--bad)}
.sopts button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.bigscore{font-size:52px;font-weight:850;letter-spacing:-.04em;color:var(--rc);line-height:1}

/* ---------- writing ---------- */
.essay textarea{font-family:var(--serif);font-size:14.5px;line-height:1.5}
.meter{height:10px;border-radius:6px;background:#f1ece0;overflow:hidden;position:relative;margin:6px 0}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--rc);transition:width .25s}
.meter .z{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.4}
.det{display:grid;gap:4px}
.det div{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.det div.ok{border-color:var(--ok);background:var(--okbg)}
.det div.no{border-color:var(--bad);background:var(--badbg)}

/* ---------- cheat sheet ---------- */
.cheat{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ch{border-radius:11px;padding:7px 9px;color:#fff;font-size:11px;line-height:1.3}
.ch b{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;opacity:.85}
.ch .f{font-weight:760;font-size:12px;margin:2px 0}
.ch .ex{font-family:var(--serif);font-style:italic;font-size:12px;opacity:.95}
table.sc{width:100%;border-collapse:collapse;font-size:11.5px}
table.sc td{padding:2px 5px;border-bottom:1px dotted var(--line2)}
table.sc td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.resc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:11.5px}
.hackc{background:var(--ink);color:#f5f1e8;border-radius:11px;padding:7px 10px;font-size:11.3px}
.hackc b{color:var(--gold);display:block;font-size:12px}

.toast{position:fixed;left:50%;bottom:46px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:10px;
 padding:7px 14px;font-size:12.5px;font-weight:650;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}

/* narrow screens: the deck layer turns the stage into a page */
body.deck-flow .gaps,body.deck-flow .kwts,body.deck-flow .g2,body.deck-flow .g3,body.deck-flow .g4,body.deck-flow .g-side,body.deck-flow .g-side2,
body.deck-flow .sortlist,body.deck-flow .judge,body.deck-flow .forge,body.deck-flow .hist,body.deck-flow .res,body.deck-flow .mixd{grid-template-columns:1fr}
body.deck-flow .lcards,body.deck-flow .cheat,body.deck-flow .lanes{grid-template-columns:1fr 1fr}
body.deck-flow .facts{grid-template-columns:repeat(3,1fr)}
body.deck-flow .ladder{grid-template-columns:1fr;height:auto}
body.deck-flow .step{height:auto!important}
body.deck-flow .topbar .sky{display:none}
body.deck-flow .kwt .s2 input,body.deck-flow .gq input{width:100%}

/* buttons on dark surfaces */
.card.dark button,.machine button{background:rgba(255,255,255,.1);color:#fbf7ef;border-color:rgba(255,255,255,.25)}

 for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';
  e.style.background=RC[i%9];e.style.animationDelay=Math.random()*.5+'s';e.style.animationDuration=1.2+Math.random()*1.2+'s';c.appendChild(e)}
 document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}

/* ============================================================
   01 · THE HOOK
   ============================================================ */
function hook(){
 const h=D.hook,sel=S.open.chunk??-1,open=S.open.model;
 return head('<span class="acc">Had it not been for</span> a builder called William Willett…','The sentence that started this lesson. Click each coloured piece to take it apart. Then translate it yourself — the model answer unlocks after 4 words.')+
 `<div class="grid g-side">
  <div class="card"><div class="bigq">${h.chunks.map((c,i)=>`<button type="button" class="chunk ${sel===i?'on':''}" onclick="chunk(${i})">${esc(c[0])}</button>`).join(' ')}</div>
   <div class="gloss card tint" id="gloss">${sel>=0?h.chunks[sel][1]:'<span class="small">↑ Start with <b>Had</b>. Why is it first?</span>'}</div>
   <div class="grid g2" style="margin-top:9px">
    <div><span class="tag">Your translation</span>${area('hookT','Переведи сама…',2)}
     <div class="row" style="margin-top:5px"><button type="button" class="primary" id="modelBtn" onclick="openModel()">Unlock the model</button><span class="small" id="hookHint"></span></div>
     ${open?`<div class="model">${esc(h.model)}</div>`:''}</div>
    <div class="qz">${reg('hookq',h.quiz.map((q,i)=>({id:'hq'+i,a:[String(q[2])],kind:'choice',why:q[3]})))}
     ${h.quiz.map((q,i)=>`<div ${whyAttr('hookq',q[3])}><div class="q">${i+1}. ${esc(q[0])}</div>${choice('hq'+i,q[1])}</div>`).join('')}</div>
   </div>${toolrow('hookq')}
  </div>
  <div class="card dark"><span class="tag">Who was Willett?</span><p class="small" style="margin-bottom:8px">Guess what happened in each year before you flip the card.</p>
   <div class="facts" style="grid-template-columns:1fr 1fr">${h.facts.map((f,i)=>`<button type="button" class="flip ${S.open['f'+i]?'on':''}" style="height:92px" onclick="flip(${i},this)"><div><span class="f">${esc(f[0])}<small>tap to flip</small></span><span class="b">${f[1]}</span></div></button>`).join('')}</div>
  </div></div>`}
function chunk(i){S.open.chunk=i;persist();render()}
function flip(i,el){S.open['f'+i]=!S.open['f'+i];persist();el.classList.toggle('on')}
function hookGate(){const b=$('modelBtn');if(!b)return;const n=words(val('hookT'));b.disabled=n<4&&!S.open.model;
 $('hookHint').textContent=S.open.model?'Compare: what did you translate differently?':n<4?`${4-n} more word${4-n===1?'':'s'} to unlock`:'Ready!'}
function openModel(){if(words(val('hookT'))<4)return;S.open.model=1;persist();render()}

/* ============================================================
   02 · THE LADDER
   ============================================================ */
const FIRST=[0,2,3,5,7,9,10,13,16];
function rungProgress(r){let n=0,t=0;for(const k in EXR)if(EXR[k]===r&&REG_T[k]){t+=REG_T[k];n+=(S.scores[k]||{}).n||0}return t?n/t:0}
const REG_T={hookq:3,r1:10,sort:10,r2:10,lmcq:8,k_linkers:6,wishg:8,k_wish:9,mixed:8,tiles:6,judge:12,spot:8,pick:6,k_inv:10,history:6,cloze:10,extra:10,sprint:16,writing:6,k_hw:10};
function ladder(){
 return head('From <span class="acc">if</span> to <span class="acc">had it not been for</span>: 7 rungs up','Every rung is built on the one below. The sky in the top bar moves from sunrise to night as you climb. Click a step to jump there; the white bar fills as you score.')+
 `<div class="ladder">${D.rungs.map((r,i)=>{const p=rungProgress(i);return `<button type="button" class="step" style="--c:${RC[i]};background:${RC[i]};height:${30+i*8.5}%" onclick="go(${FIRST[i]})"><b>${esc(r[0])}</b><span>${esc(r[1])}</span><em>${esc(r[2])}</em><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div></button>`}).join('')}</div>
 <div class="grid g3">
  <div class="card tint"><span class="tag">How the lesson works</span><p>Guess → check → click red answers to see <b>why</b>. Real olympiad items carry a <span class="real">real</span> tag with the region and year; their keys are the official ones.</p></div>
  <div class="card"><span class="tag">90-minute route</span><p>Rungs 1–3: 25 min · Rungs 4–5: 20 min · Rungs 6–7: 30 min · Arena: 15 min. Writing & homework at home.</p></div>
  <div class="card dark"><span class="tag">Goal</span><p style="font-family:var(--serif);font-size:15px">By the end you can turn any <i>if</i> into <b style="color:var(--gold)">Had / Were / Should</b> — and spot it in a real olympiad text in seconds.</p></div>
 </div>`}

/* ============================================================
   RUNG 1 · zero & first

function rung1(){
 const d=D.r1;reg('r1',d.gaps.map((g,i)=>({id:'r1'+i,a:g[2],why:g[3]})));
 return head('Real life: <span class="acc">zero</span> & <span class="acc">first</span> conditional','The foundation. Everything later is a “step back in time” from these two.')+
 `<div class="grid g-side2"><div class="rules">${d.rules.map(r=>`<div class="rule"><b>${r[0]}</b><div><div class="f">${r[1]}</div><div class="small">${r[2]}</div><div class="ex">${r[3]}</div></div></div>`).join('')}
  <div class="card dark small">Hack: after <b style="color:var(--gold)">if · when · as soon as · until · before · after · unless</b> — never <i>will</i> for the future.</div></div>

/* ============================================================
   RUNG 2 · type switcher + sort
   ============================================================ */
function switcher(){
 const d=D.switcher,si=S.open.sit||0,ti=S.open.typ??1,s=d.situations[si].s[ti];
 reg('sort',d.sort.map((q,i)=>({id:'so'+i,a:[String(q[1])],kind:'choice',why:['Zero: present + present, always true.','First: if + present, will. Real future.','Second: if + past, would. Unreal now.','Third: if + had V3, would have V3. Unreal past.'][q[1]]})));
 return head('One situation, <span class="acc">four</span> conditionals','Pick a story, then turn the dial. Watch which verbs change — the step back in time is the whole secret.')+
 `<div class="row" style="margin-bottom:7px"><span class="tag" style="margin:0">Story</span><span class="tabs">${d.situations.map((x,i)=>`<button type="button" aria-pressed="${i===si}" onclick="sw('sit',${i})">${esc(x.name)}</button>`).join('')}</span>
  <span class="spacer"></span><span class="tag" style="margin:0">Dial</span><span class="tabs">${['Zero','First','Second','Third'].map((x,i)=>`<button type="button" aria-pressed="${i===ti}" onclick="sw('typ',${i})">${x}</button>`).join('')}</span></div>
 <div class="machine anim"><span class="dial">${esc(s[3])}</span><span class="tag" style="color:#b9c0d8">${['Zero','First','Second','Third'][ti]} conditional</span>
  <div class="sent">${s[0]}</div><div class="meta"><span>${esc(s[1])}</span><span class="ru">${esc(s[2])}</span></div></div>
 <div class="card" style="margin-top:10px"><span class="tag">Sort it: which type? (0 · 1 · 2 · 3)</span>
  <div class="sortlist">${d.sort.map((q,i)=>`<div class="sortq" ${whyAttr('sort',['Zero: present + present, always true.','First: if + present, will. Real future.','Second: if + past, would. Unreal now.','Third: if + had V3, would have V3. Unreal past.'][q[1]])}><span>${esc(q[0])}</span>${choice('so'+i,['0','1','2','3'])}</div>`).join('')}</div>${toolrow('sort')}</div>`}
function sw(k,i){S.open[k]=i;persist();render()}

function rung2(){
 const d=D.r2;reg('r2',d.gaps.map((g,i)=>({id:'r2'+i,a:g[2],why:g[3]})));
 return head('Unreal: <span class="acc">second</span> & <span class="acc">third</span>','Second = unreal now (step back one tense). Third = unreal past (step back to had + V3).')+
 `<div class="grid g-side2"><div class="rules">
  <div class="rule"><b>Second</b><div><div class="f">If + past simple, would + V</div><div class="small">Imaginary present or unlikely future.</div><div class="ex">If I were you, I’d apologise.</div></div></div>
  <div class="rule"><b>Third</b><div><div class="f">If + had V3, would have V3</div><div class="small">Imaginary past. It did not happen.</div><div class="ex">If I had known, I would have come.</div></div></div>
  <div class="rule"><b>Modals</b><div><div class="f">would → might / could</div><div class="small">might = maybe; could = would be able to.</div><div class="ex">…Britons might never have changed their clocks.</div></div></div>
  <div class="card dark small">Look at the <b style="color:var(--gold)">other half</b> of the sentence first. <i>would have</i> there → <i>had + V3</i> in your gap.</div></div>
 <div class="card"><span class="tag">Put the verb in the right form</span><div class="gaps" style="grid-template-columns:1fr">${d.gaps.map((g,i)=>`<div ${whyAttr('r2',g[3])}>${gapItem('r2',i,g[0],g[1])}</div>`).join('')}</div>${toolrow('r2')}</div></div>`}

   RUNG 3 · beyond if

function linkers(){
 const d=D.linkers;reg('lmcq',d.mcq.map((q,i)=>({id:'lm'+i,a:[String(q[2])],kind:'choice',why:q[3]})));
 return head('Beyond <span class="acc">if</span>: unless, in case, as long as…','Olympiad multiple-choice loves these: four linkers that all “sound conditional”, only one fits the logic.')+
 `<div class="lcards">${d.cards.map(c=>`<div class="lcard"><b>${esc(c[0])}</b>${esc(c[1])}<i>${esc(c[2])}</i><span class="small">${c[3]}</span></div>`).join('')}
  <div class="lcard" style="background:var(--ink);color:#fff"><b style="color:var(--gold)">Olympiad hack</b>Read the whole sentence and ask: is it a condition, a precaution, or a contrast?</div></div>
 <div class="card" style="margin-top:9px"><div class="mcq" style="grid-template-columns:1fr 1fr;display:grid;gap:6px 16px">${d.mcq.map((q,i)=>`<div class="mq" ${whyAttr('lmcq',q[3])}><i>${i+1}</i><div>${q[4]?realTag(q[4],q[5])+' ':''}${esc(q[0])}<br>${choice('lm'+i,q[1])}</div></div>`).join('')}</div>${toolrow('lmcq')}</div>`}

/* ---------------- key word transformations ---------------- */
function kwtBlock(set){
 const items=D.kwt[set],name='k_'+set;
 reg(name,items.map((r,i)=>({id:name+i,a:r[3],why:r[4]})));
 return `<div class="kwts">${items.map((r,i)=>{const p=r[2].split('___');return `<div class="kwt" ${whyAttr(name,r[4])}>
  <div class="s1"><b>${i+1}.</b> ${esc(r[0])} <span class="key">${esc(r[1])}</span> ${r[6]?realTag(r[6],r[7]):''}</div>
  <div class="s2">${esc(p[0])}${input(name+i,'Transformation '+(i+1))}${esc(p[1]||'')}</div>
  <div class="foot"><span class="wc" id="wc-${name}${i}">0 words</span><span>${r[5]?'limit: '+esc(r[5])+' words':'the key word must be used'}</span></div></div>`}).join('')}</div>`}
function wc(id){
 const m=id.match(/^k_(\w+?)(\d+)$/);if(!m)return;const r=D.kwt[m[1]][+m[2]],el=$('wc-'+id);if(!el)return;
 const v=val(id),n=words(v),key=r[1].toLowerCase(),has=new RegExp('\\b'+key+'\\b','i').test(v.replace(/’/g,"'"));
 let lim=null;if(r[5]){const q=r[5].split('–').map(Number);lim=[q[0],q[1]||q[0]]}
 let msg=n+' word'+(n===1?'':'s'),cls='wc';
 if(n){if(!has){msg+=' · key word missing';cls+=' no'}else if(lim&&n>lim[1]){msg+=' · too long';cls+=' no'}else if(lim&&n<lim[0]){msg+=' · too short';cls+=' no'}else cls+=' ok'}
 el.textContent=msg;el.className=cls}
function kwtSheet(set,title,lead){return head(title,lead)+kwtBlock(set)+toolrow('k_'+set)}

 return head('The <span class="acc">wish</span> machine','Wish = a conditional without the result. Same step back in time: now → past simple, past → past perfect.')+
 `<div class="lanes">${d.lanes.map(l=>`<div class="lane"><b>${esc(l[0])}</b><div class="f">${esc(l[1])}</div><div class="ex">${l[2]}</div><div class="small">${l[3]}</div><div class="ru" style="font-size:11px">${esc(l[4])}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:9px"><span class="tag">Turn the situation into a wish</span>
  <div class="gaps">${d.gaps.map((g,i)=>`<div class="gq" ${whyAttr('wishg',g[3])}><i>${i+1}</i><span><span class="sit">${esc(g[0])}</span>${esc(g[1].split('___')[0])}${input('wg'+i,'Wish '+(i+1))}${esc(g[1].split('___')[1])}</span></div>`).join('')}</div>${toolrow('wishg')}</div>`}

/* ============================================================
   RUNG 5 · mixed
   ============================================================ */
function mixed(){
 const d=D.mixed;reg('mixed',d.gaps.map((g,i)=>({id:'mx'+i,a:g[2],why:g[3]})));
 const arrow=(a,b,top,bot,c)=>`<svg viewBox="0 0 420 118" role="img" aria-label="${esc(top)}"><rect x="1" y="1" width="418" height="116" rx="12" fill="#fff" stroke="#e7dcc6"/>
  <defs><marker id="ah${a}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker></defs>
  <text x="16" y="24" font-size="13" font-weight="700" fill="#1d2640">${esc(top)}</text><text x="16" y="42" font-size="12" fill="#5f6781" font-style="italic">${esc(bot)}</text>
  <line x1="30" y1="88" x2="390" y2="88" stroke="#d7c9ad" stroke-width="2"/><text x="30" y="108" font-size="10.5" fill="#5f6781">PAST</text><text x="358" y="108" font-size="10.5" fill="#5f6781">NOW</text>
  <circle cx="${a}" cy="88" r="7" fill="${c}"/><circle cx="${b}" cy="88" r="7" fill="#1d2640"/><path d="M${a+(b>a?9:-9)} 82 Q ${(a+b)/2} 50 ${b+(b>a?-9:9)} 82" fill="none" stroke="${c}" stroke-width="2.5" marker-end="url(#ah${a})"/></svg>`;
 return head('<span class="acc">Mixed</span> conditionals: two times in one sentence','The if-half and the result-half can live in different times. Check each half separately.')+
 `<div class="mixd"><div>${arrow(70,360,'Past cause → present result','If I had slept, I wouldn’t be tired now.','#d6457a')}<p class="small">if + had V3, <b>would + V</b> (now / today)</p></div>
  <div>${arrow(360,90,'Always-true cause → past result','If I were braver, I would have said something.','#2386b5')}<p class="small">if + past simple (in general), <b>would have V3</b> (then)</p></div></div>
 <div class="card" style="margin-top:8px"><span class="tag">Which half is past? Which is now?</span><div class="gaps">${d.gaps.map((g,i)=>`<div ${whyAttr('mixed',g[3])}>${gapItem('mx',i,g[0],g[1])}</div>`).join('')}</div>${toolrow('mixed')}</div>`}

/* ============================================================
   RUNG 6 · inversion forge (tiles)
   ============================================================ */
function tilesOrder(i){const t=D.inv.tiles[i],all=[...t[1],...t[2]];
 /* fixed shuffle so the pool looks the same every time */
 return all.map((w,k)=>[w,k]).sort((a,b)=>((a[1]*7+i*3)%all.length)-((b[1]*7+i*3)%all.length)).map(x=>x[1])}
function getBuilt(i){try{return JSON.parse(val('tl'+i)||'[]')}catch(e){return[]}}
function forge(){
 const d=D.inv;reg('tiles',d.tiles.map((t,i)=>({id:'tl'+i,kind:'tiles',a:[t[1].join(' ')],why:'Answer: '+t[1].join(' ')})));
 return head('The inversion <span class="acc">forge</span>: drop the if, flip the verb','Only three words can jump in front of the subject: <b>Had</b>, <b>Were</b>, <b>Should</b>. Click the tiles in order. Two tiles in each pool are traps.')+
 `<div class="grid g-side2"><div class="rules">${d.rules.map(r=>`<div class="rule"><b>${r[0]}</b><div><div class="f">${r[1]}</div><div class="small">${r[2]}</div></div></div>`).join('')}</div>
 <div><div class="forge">${d.tiles.map((t,i)=>{const b=getBuilt(i),all=[...t[1],...t[2]];return `<div class="tbox" ${whyAttr('tiles','Answer: '+t[1].join(' '))}><div class="orig">${i+1}. ${esc(t[0])}</div>
  <div class="built" id="tl${i}">${b.map((k,j)=>`<button type="button" class="tile" onclick="untile(${i},${j})">${esc(all[k])}</button>`).join('')}</div>
  <div class="pool">${tilesOrder(i).map(k=>`<button type="button" class="tile ${b.includes(k)?'used':''}" onclick="tile(${i},${k})">${esc(all[k])}</button>`).join('')}</div></div>`}).join('')}</div>${toolrow('tiles')}</div></div>`}
function tile(i,k){const b=getBuilt(i);if(b.includes(k))return;b.push(k);setVal('tl'+i,JSON.stringify(b));render()}
function untile(i,j){const b=getBuilt(i);b.splice(j,1);setVal('tl'+i,JSON.stringify(b));render()}
const tileText=i=>{const t=D.inv.tiles[i],all=[...t[1],...t[2]];return getBuilt(i).map(k=>all[k]).join(' ')};

function judge(){
 const d=D.inv.judge;reg('judge',d.map((q,i)=>({id:'jd'+i,a:[String(q[1]?0:1)],kind:'choice',why:q[1]?'Correct as it is.':'Correct version: '+q[2]})));
 return head('Judge the traps: <span class="acc">right</span> or <span class="acc">wrong</span>?','The jury gives 0 for a “nearly right” inversion. Decide for each sentence. After checking, click a sentence to see the correct version.')+
 `<div class="card"><div class="judge">${d.map((q,i)=>`<div class="jq" ${whyAttr('judge',q[1]?'Correct as it is.':'Correct version: <b>'+esc(q[2])+'</b>')}><span>${i+1}. ${esc(q[0])}</span>${choice('jd'+i,['✓ right','✗ wrong'])}</div>`).join('')}</div>${toolrow('judge')}</div>
 <div class="grid g3" style="margin-top:9px"><div class="card dark small"><b style="color:var(--gold)">Trap 1 · contraction.</b> Hadn’t I / Weren’t it / Shouldn’t you → always wrong in a conditional.</div>
  <div class="card dark small"><b style="color:var(--gold)">Trap 2 · double.</b> If + inversion together: <i>If had we…</i> ✗</div>
  <div class="card dark small"><b style="color:var(--gold)">Trap 3 · wrong verb.</b> Only Had / Were / Should. <i>Would you need…</i> ✗ <i>Knew I…</i> ✗</div></div>`}

/* ---------------- spot it in real texts ---------------- */
const tokens=s=>s.split(/\s+/);
const clean=w=>norm(w.replace(/[.,;:!?]+$/,''));
function getSel(i){try{return JSON.parse(val('sp'+i)||'[]')}catch(e){return[]}}
function spot(){
 const d=D.inv.spot;
 const items=[];d.forEach((p,i)=>{items.push({id:'sp'+i,kind:'spot',a:[p[1]],why:'The inverted condition: <b>'+esc(p[1])+'</b>'});items.push({id:'spr'+i,a:p[2],why:'Back to if: '+esc(p[2][0])})});
 reg('spot',items);
 return head('Spot it in <span class="acc">real olympiad texts</span>','These sentences come from reading texts and tasks of real municipal papers. Click the words of the hidden condition, then rewrite it with <b>if</b>.')+
 `<div class="grid g2">${d.map((p,i)=>{const sel=getSel(i);return `<div class="card" ${whyAttr('spot','Rewrite: '+esc(p[2][0]))}>${realTag(p[3],p[4])} <span class="small">${esc(p[4])}</span>
  <div class="spot" id="sp${i}">${tokens(p[0]).map((w,k)=>`<button type="button" class="w ${sel.includes(k)?'sel':''} ${spotKey(i).includes(k)?'key':''}" onclick="spotW(${i},${k})">${esc(w)}</button>`).join(' ')}</div>
  <div class="row" style="margin-top:4px"><span class="small">With if:</span><span style="flex:1">${input('spr'+i,'Rewrite '+(i+1))}</span></div></div>`}).join('')}</div>${toolrow('spot')}`}
function spotKey(i){const p=D.inv.spot[i],t=tokens(p[0]).map(clean),k=tokens(p[1]).map(clean);
 for(let s=0;s<=t.length-k.length;s++)if(k.every((w,j)=>t[s+j]===w))return k.map((_,j)=>s+j);return[]}
function spotW(i,k){const s=getSel(i),j=s.indexOf(k);if(j>=0)s.splice(j,1);else s.push(k);setVal('sp'+i,JSON.stringify(s.sort((a,b)=>a-b)));
 const el=$('sp'+i);el.classList.remove('good','bad','shownk');el.querySelectorAll('.w')[k].classList.toggle('sel')}

/* ============================================================
   RUNG 7 · the family
   ============================================================ */
function family(){
 const d=D.family,fi=S.open.fact||0,fr=S.open.frame??1,flipd=S.open.swap,f=d.facts[fi],fm=d.frames[fr][f.past?0:1];
 reg('pick',d.pick.map((q,i)=>({id:'pk'+i,a:[String(q[2])],kind:'choice',why:q[3]})));
 const low=fm.charAt(0).toLowerCase()+fm.slice(1);
 const sent=flipd?`${esc(cap(f.r.replace(/\.$/,'')))} <b>${esc(low)}</b> ${esc(f.x)}.`:`<b>${esc(fm)}</b> ${esc(f.x)}, ${esc(f.r)}`;
 return head('The “<span class="acc">if not for</span>” family = <span class="ru">«если бы не…»</span>','Four ways to say the same thing. Choose by <b>time</b> (past or present result) and by <b>style</b>.')+
 `<div class="grid g2"><div><table class="fam"><tr><th>Style</th><th>Past (would have V3)</th><th>Present (would V)</th></tr>
  ${d.frames.map(r=>`<tr><td class="small">${esc(r[2])}</td><td><b>${esc(r[0])}</b> + noun</td><td><b>${esc(r[1])}</b> + noun</td></tr>`).join('')}</table>
  <div class="card tint small" style="margin-top:8px">Our Willett sentence = past: <i>If it hadn’t been for</i> → <b>Had it not been for</b>. The present twin is <b>Were it not for</b>: <i>Were it not for the Moon, tides would be weaker.</i></div></div>
 <div class="machine conv"><span class="tag" style="color:#b9c0d8">Converter · pick a fact, then a frame</span>
  <div class="tabs">${d.facts.map((x,i)=>`<button type="button" aria-pressed="${i===fi}" onclick="sw('fact',${i})" style="font-size:10.5px">${esc(x.x)}</button>`).join('')}</div>
  <div class="out">${sent}</div>
  <div class="row"><span class="tabs">${d.frames.map((x,i)=>`<button type="button" aria-pressed="${i===fr}" onclick="sw('frame',${i})" style="font-size:10.5px">${esc(x[f.past?0:1])}</button>`).join('')}</span>
  <button type="button" onclick="sw('swap',${flipd?0:1})" style="font-size:10.5px">⇄ result first</button></div>
  <div class="small" style="color:#b9c0d8;margin-top:4px">${f.past?'Past result → would/might have + V3':'Present result → would/could + V'}</div></div></div>
 <div class="card" style="margin-top:9px"><span class="tag">Quick choice</span><div class="grid g2" style="gap:5px 16px">${d.pick.map((q,i)=>`<div class="mq" ${whyAttr('pick',q[3])}><i>${i+1}</i><div>${esc(q[0])} ${choice('pk'+i,q[1])}</div></div>`).join('')}</div>${toolrow('pick')}</div>`}

/* ---------------- what-if history ---------------- */
const PRON='(i|you|he|she|it|we|they)';
function detect(s){
 const t=String(s).replace(/[’‘]/g,"'");
 return {
  opener:/^\s*(had|were|should)\s+(?!not\b)\S+/i.test(t)||/\b(but for|had it not been for|were it not for|if it had(n't| not) been for|if it (was|were)(n't| not) for|without)\b/i.test(t),
  past:/\b(would|might|could)(n't| not| never|\s+not\s+ever)?\s+have\s+\w+/i.test(t),
  pres:/\b(would|might|could)(n't| not| never)?\s+(?!have\b)\w+/i.test(t),
  trap:/(^|[,.;]\s*)(hadn't|weren't|shouldn't)\s+(i|you|he|she|it|we|they)\b/i.test(t)||/\bif\s+(had|were|should)\s+(i|you|he|she|it|we|they)\b/i.test(t)||/\bhad not (i|you|he|she|it|we|they)\b/i.test(t),
 }}
function history(){
 const d=D.history;
 return head('What-if <span class="acc">history</span>: write it yourself','Turn each fact into ONE formal sentence: an inversion or an “if not for” opener + an unreal result. The detector checks the structure live; the model unlocks when yours is green.')+
 `<div class="hist">${d.map((h,i)=>`<div class="hitem"><div class="fact"><b>${i+1}.</b> ${esc(h[0])} <span class="chip">${h[2]?'past result':'present result'}</span></div>
  ${area('hist'+i,i===5?'Had it not been for …, I would never have …':'Had … / Were it not for … / But for …',2)}
  <div class="row"><span class="chips" id="hc${i}"></span><span class="spacer"></span><button type="button" onclick="histModel(${i})" id="hm${i}" style="font-size:10.5px">Model</button></div>
  ${S.open['hm'+i]?`<div class="model" style="margin:0;font-size:12.5px">${esc(h[1])}</div>`:''}</div>`).join('')}</div>
  <div class="toolrow"><span class="score" id="score-history">${S.scores.history?S.scores.history.n+' / 6':''}</span><span class="whybar">Green = opener ✓ + the right result for the time ✓ + no trap. Every green sentence scores 1 XP.</span></div>`}
function histOk(i){const h=D.history[i],r=detect(val('hist'+i));return r.opener&&(h[2]?r.past:r.pres)&&!r.trap}
function histLive(i){const h=D.history[i],v=val('hist'+i),r=detect(v),el=$('hc'+i);if(!el)return;
 if(!v.trim()){el.innerHTML='<span class="chip">write first</span>';$('hm'+i).disabled=!S.open['hm'+i];}
 else{el.innerHTML=`<span class="chip ${r.opener?'ok':'no'}">opener</span><span class="chip ${(h[2]?r.past:r.pres)?'ok':'no'}">${h[2]?'would have V3':'would + V'}</span>${r.trap?'<span class="chip no">trap: Hadn’t I / If had</span>':''}`;
  $('hm'+i).disabled=!histOk(i)&&!S.open['hm'+i]}
 const n=D.history.filter((_,k)=>histOk(k)).length,old=(S.scores.history||{}).n||0;S.scores.history={n,t:6};persist();stats();if(n>old)bump();
 const sc=$('score-history');if(sc)sc.textContent=n+' / 6'}
function histModel(i){S.open['hm'+i]=1;persist();render()}

/* ============================================================
   ARENA
   ============================================================ */
function cloze(){
 const d=D.cloze;reg('cloze',d.answers.map((a,i)=>({id:'cz'+i,a,why:d.why[i]})));
 let k=0;const html=d.text.replace(/\{(\d+)\}/g,(m,n)=>{const i=+n-1;return `<span class="gap" ${whyAttr('cloze',d.why[i])}><span class="n">${n}</span>${input('cz'+i,'Gap '+n)}</span>`});
 return head('Open cloze: <span class="acc">one word</span> per gap','Olympiad format: no options, one word only. Every gap is a construction from today’s ladder. Example: (0) down.')+
 `<div class="passage"><h2>${esc(d.title)}</h2>${html}</div>${toolrow('cloze')}`}
function extra(){
 const d=D.extra;reg('extra',d.map((r,i)=>({id:'ex'+i,a:[r[1]],why:r[2]})));
 return head('Extra word: find the <span class="acc">one</span> word that should not be there','Moscow school-stage format. Some lines are correct: write <b>V</b>. Otherwise write the extra word.')+
 `<div class="lines">${d.map((r,i)=>`<div class="line" ${whyAttr('extra',r[2])}><i>${i+1}</i><span>${esc(r[0])}</span>${input('ex'+i,'Line '+(i+1))}</div>`).join('')}</div>${toolrow('extra')}`}

/* ---------------- sprint ---------------- */
function sprint(){
 return head('Sprint: <span class="acc">16</span> questions, easy → hard','Olympiad pace is about 45 seconds a question. Keys 1–4 answer, the strip jumps. Start the clock when you are ready.')+
 `<div class="card"><div class="pace" id="pace"></div><div id="sbody"></div></div>`}
function sprintDraw(){
 const s=S.sprint,d=D.sprint,p=$('pace');if(!p)return;
 p.innerHTML=d.map((q,i)=>{let c='';if(s.done)c=String(s.pick[i])===String(q[2])?'r':'w';else if(i===s.i)c='cur';else if(s.pick[i]!==undefined)c='ans';return `<button type="button" class="${c}" onclick="sprintGo(${i})">${i+1}</button>`}).join('');
 const b=$('sbody');
 if(s.done){const n=d.filter((q,i)=>String(s.pick[i])===String(q[2])).length;
  b.innerHTML=`<div class="row" style="align-items:flex-end;gap:16px"><span class="bigscore">${n}/16</span><span class="small">${n>=14?'Regional-stage speed. Bravo!':n>=10?'Solid. Redo the red ones tomorrow.':'Go back down the ladder to the rung where the red ones live.'}</span><span class="spacer"></span><button type="button" onclick="sprintReset()">Try again</button></div>
  <div class="grid g2" style="margin-top:10px;gap:4px 14px">${d.map((q,i)=>`<div class="small">${String(s.pick[i])===String(q[2])?'✓':'✗'} ${i+1}. ${esc(q[0].replace('___','['+q[1][q[2]]+']'))}</div>`).join('')}</div>`;return}
 const q=d[s.i];
 b.innerHTML=`<div class="row"><span class="tag" style="margin:0">Question ${s.i+1} of 16 · ${s.i<4?'rung 1–2':s.i<10?'rung 3–5':'rung 6–7'}</span><span class="spacer"></span>${s.start?'':'<button type="button" class="primary" onclick="sprintStart()">Start 12:00</button>'}<button type="button" onclick="sprintFinish()">Finish & score</button></div>
  <div class="sq">${esc(q[0])}</div><div class="sopts">${q[1].map((o,k)=>`<button type="button" aria-pressed="${String(s.pick[s.i])===String(k)}" onclick="sprintPick(${k})"><b>${k+1}</b>${esc(o)}</button>`).join('')}</div>`}
function sprintStart(){S.sprint.start=Date.now();persist();startClock(12);sprintDraw()}
function startClock(min){const c=$('clock');c.hidden=false;clearInterval(clockT);
 const t=()=>{const left=Math.round((S.sprint.start+min*60000-Date.now())/1000),a=Math.abs(left);c.textContent=(left<0?'+':'')+Math.floor(a/60)+':'+no2(a%60);c.classList.toggle('late',left<0)};t();clockT=setInterval(t,500)}
function sprintPick(k){const s=S.sprint;if(s.done)return;s.pick[s.i]=k;if(s.i<15)s.i++;persist();sprintDraw()}
function sprintGo(i){S.sprint.i=i;persist();sprintDraw()}
function sprintFinish(){const s=S.sprint;s.done=true;stopClock();
 const n=D.sprint.filter((q,i)=>String(s.pick[i])===String(q[2])).length;S.scores.sprint={n,t:16};persist();stats();bump();if(n>=12)confetti();sprintDraw()}
function sprintReset(){S.sprint={i:0,pick:{},done:false,start:0};delete S.scores.sprint;persist();render()}

/* ---------------- writing ---------------- */
const WDET=[
 ['Third conditional (if … had V3 … would have V3)',/\bif\b[^.!?]*\bhad\s+\w+[^.!?]*\b(would|might|could)(n't| not| never)?\s+have\b|\b(would|might|could)(n't| not| never)?\s+have\s+\w+[^.!?]*\bif\b[^.!?]*\bhad\b/i],
 ['Wish / if only',/\b(wish|wishes|wished|if only)\b/i],
 ['Inversion: Had / Were / Should + subject',/(^|[.!?]\s+|,\s*)(had|were|should)\s+(i|you|he|she|it|we|they|the|my|this|that|our|his|her)\b(?!\s+not been for)/i],
 ['Had it not been for / Were it not for / But for',/\b(had it not been for|were it not for|but for)\b/i],
 ['Beyond if: unless / in case / as long as / provided / otherwise',/\b(unless|in case|as long as|provided|providing|otherwise|supposing)\b/i],
 ['Mixed: …would + V now / today',/\bhad\s+\w+[^.!?]*\b(would|might|could)(n't| not)?\s+(?!have\b)\w+[^.!?]*\b(now|today|still)\b/i],
];
function writing(){
 return head('Writing: <span class="acc">The day that changed everything</span>','80–120 words about a real or imagined turning point (yours, your town’s, or history’s). Use all six structures — the detector lights them up as you type.')+
 `<div class="grid g-side"><div class="card essay">${area('essay','Title\n\nIt was an ordinary Tuesday. Had I known what would happen…',13)}
  <div class="meter"><i id="wm"></i><span class="z" style="left:53.3%"></span><span class="z" style="left:80%"></span></div><div class="small" id="wz"></div></div>
 <div><span class="tag">Detector</span><div class="det" id="det"></div>
  <div class="card dark small" style="margin-top:8px">Jury tip: one well-placed inversion impresses more than five forced ones. Put it at the start of a paragraph or in the conclusion.</div>
  <div class="toolrow"><button type="button" onclick="download('what-if-writing.txt',val('essay'))">⬇ Save my text</button><span class="score" id="score-writing"></span></div></div></div>`}
function writingLive(){
 const v=val('essay').replace(/[’‘]/g,"'"),n=words(v),el=$('det');if(!el)return;
 const hits=WDET.map(d=>d[1].test(v)),trap=detect(v.split(/(?<=[.!?])\s+/).find(s=>detect(s).trap)||'').trap;
 el.innerHTML=WDET.map((d,i)=>`<div class="${hits[i]?'ok':''}"><span>${esc(d[0])}</span><b>${hits[i]?'✓':'—'}</b></div>`).join('')+(trap?'<div class="no"><span>Trap: Hadn’t I / If had I</span><b>!</b></div>':'');
 $('wm').style.width=Math.min(100,n/150*100)+'%';
 $('wz').textContent=n+' words · '+(n<80?'too short':n>120?'too long — cut to 120':'perfect length');
 const k=hits.filter(Boolean).length;S.scores.writing={n:k,t:6};persist();stats();$('score-writing').textContent=k+' / 6'}

/* ============================================================
   FINISH
   ============================================================ */
function homework(){
 return head('Homework: <span class="acc">10</span> transformations','All rungs mixed, easy → hard. Do them without looking back, then check. Download your answers for the next lesson.')+kwtBlock('hw')+
  toolrow('k_hw',`<button type="button" onclick="downloadHW()">⬇ Download</button>`)}
function downloadHW(){
 const lines=['WHAT IF LAB · HOMEWORK','',...D.kwt.hw.map((r,i)=>`${i+1}. ${r[0]}\n   ${r[1]}: ${r[2].replace('___','['+(val('k_hw'+i)||'…')+']')}`),'','Score: '+((S.scores.k_hw||{}).n??'—')+' / 10'];
 download('what-if-homework.txt',lines.join('\n'))}
function cheat(){
 const C=[
  [1,'Zero · First','If + present, present / will','If it rains, we’ll stay in.'],
  [2,'Second · Third','If + past, would · If + had V3, would have V3','If I had known, I’d have come.'],
  [3,'Beyond if','unless = if not · in case = precaution','Take it in case it rains.'],
  [4,'Wish','now → past · then → past perfect · would','I wish I had listened.'],
  [5,'Mixed','had V3 → would + now','If I’d slept, I wouldn’t be tired.'],
  [6,'Inversion','Should you… · Were I (to)… · Had I…','Had I known, I’d have come.'],
  [7,'If not for','Had it not been for / Were it not for / But for + noun','Had it not been for Willett…'],
  [8,'Olympiad','contractions = 2 words · Hadn’t I = 0','BUT + would → but for'],
 ];
 const rows=Object.keys(EXNAME).map(k=>[k,S.scores[k]]);
 return head('Cheat sheet & <span class="acc">score</span>','Screenshot this sheet. It is the whole ladder on one page.')+
 `<div class="cheat">${C.map(c=>`<div class="ch" style="background:${RC[c[0]]}"><b>${esc(RUNGNAME[c[0]])}</b><div class="f">${esc(c[1])}: ${esc(c[2])}</div><div class="ex">${esc(c[3])}</div></div>`).join('')}</div>
 <div class="grid g2" style="margin-top:10px"><div class="card"><span class="tag">Your score</span><div class="scgrid">${rows.map(([k,r])=>`<div><span>${esc(EXNAME[k])}</span><b>${r?r.n+' / '+r.t:'—'}</b></div>`).join('')}</div></div>
 <div class="card dark"><span class="tag">Total</span><div class="bigscore" style="color:var(--gold)">${pts()} XP</div><p class="small">of ${Object.values(REG_T).reduce((a,b)=>a+b,0)} possible</p>
  <div class="row" style="margin-top:10px"><button type="button" onclick="downloadAll()">⬇ All answers</button><button type="button" onclick="resetAll()">Reset everything</button></div></div></div>`}
function sources(){
 const used=Object.values(D.SRC);
 return head('Hacks & <span class="acc">sources</span>','Every real item in this lesson comes from these papers. Open the answer key and check the scoring rules yourself.')+
 `<div class="grid g3" style="grid-template-columns:repeat(3,1fr)">${D.hacks.map(h=>`<div class="hackc"><b>${esc(h[0])}</b>${esc(h[1])}</div>`).join('')}</div>
 <div class="grid g2" style="margin-top:9px"><div class="card"><span class="tag">Real papers used (tasks · key)</span><div style="columns:2;font-size:10.8px;column-gap:14px">${used.map(s=>`<div>${esc(s[0])}: ${link(s[1],'tasks')} ${link(s[2],'key')}</div>`).join('')}</div></div>
 <div class="res" style="grid-template-columns:1fr">${D.sources.map(s=>`<div class="resc">${link(s[1],s[0])} <span class="small">— ${esc(s[2])}</span></div>`).join('')}</div></div>`}

/* ---------------- answer keys ---------------- */
function itemVal(it){if(it.kind==='tiles')return tileText(+it.id.slice(2));if(it.kind==='spot')return getSel(+it.id.slice(2)).map(k=>tokens(D.inv.spot[+it.id.slice(2)][0])[k]).map(clean).join(' ');return String(val(it.id))}
function isOk(it){const v=itemVal(it);
 if(it.kind==='choice')return it.a.includes(v);
 if(it.kind==='tiles')return norm(v)===norm(it.a[0]);
 if(it.kind==='spot')return v===tokens(it.a[0]).map(clean).join(' ');
 return it.a.map(norm).includes(norm(v))}
function check(name){
 const items=REG[name]||[];let n=0;
 items.forEach(it=>{const el=$(it.id);if(!el)return;const ok=isOk(it);
  el.classList.remove('good','bad','shown','shownk');el.classList.add(ok?'good':'bad');if(ok)n++});
 const old=(S.scores[name]||{}).n||0;S.scores[name]={n,t:items.length};persist();stats();if(n>old)bump();
 $('score-'+name).textContent=n+' / '+items.length;
 $('why-'+name).innerHTML=n===items.length?'<b>All correct!</b> Explain two of them aloud as if you were the jury.':`<b>${n} / ${items.length}.</b> Click a red answer to see why before you change it.`;
 if(n===items.length&&items.length>3)confetti()}
function showKey(name){
 (REG[name]||[]).forEach(it=>{const el=$(it.id);if(!el)return;
  if(it.kind==='choice'){pick(it.id,+it.a[0]);el.classList.add('good');return}
  if(it.kind==='tiles'){const i=+it.id.slice(2),t=D.inv.tiles[i];setVal(it.id,JSON.stringify(t[1].map((_,k)=>k)));return}
  if(it.kind==='spot'){const i=+it.id.slice(2);setVal(it.id,JSON.stringify(spotKey(i)));return}
  el.value=it.a[0];setVal(it.id,it.a[0]);el.classList.add('shown')});
 if(['tiles','spot'].includes(name)){render();document.querySelectorAll(name==='spot'?'.spot':'.built').forEach(e=>e.classList.add(name==='spot'?'shownk':'good'))}
 if(name.startsWith('k_'))document.querySelectorAll('.kwt input').forEach(el=>wc(el.dataset.save));
 toast('Key shown. Cover it and redo the red ones tomorrow.')}
function clearEx(name){
 (REG[name]||[]).forEach(it=>delete S.answers[it.id]);delete S.scores[name];persist();render()}

function download(name,text){const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function downloadAll(){const out=['WHAT IF LAB · ALL ANSWERS',''];
 Object.keys(S.answers).sort().forEach(k=>{if(String(S.answers[k]).trim())out.push(k+'  '+S.answers[k])});
 out.push('','SCORES');Object.keys(S.scores).forEach(k=>out.push((EXNAME[k]||k)+'  '+S.scores[k].n+' / '+S.scores[k].t));
 download('what-if-lab-answers.txt',out.join('\n'))}
function resetAll(){if(!confirm('Delete every answer and score on this device?'))return;S=blank();current=0;persist();render()}

/* ---------------- wiring ---------------- */
const renderers=[hook,ladder,rung1,switcher,rung2,linkers,
 ()=>kwtSheet('linkers','Transform it: <span class="acc">unless · in case · as long as · otherwise</span>','Key word transformation, olympiad style: use the word in capitals, do not change it, keep the meaning. The counter checks length and the key word; contractions count as two words.'),
 wish,
 ()=>kwtSheet('wish','Real papers: <span class="acc">wish · regret · would rather</span>','Nine items from real municipal papers, official keys. Watch the switch: the same regret can be <i>wish + past perfect</i> or <i>regret + not + -ing</i>.'),
 mixed,forge,judge,spot,family,
 ()=>kwtSheet('inv','Real & olympiad transformations: <span class="acc">But for · Were · Had · Should</span>','The first three are real municipal items (Moscow, Tatarstan, Krasnoyarsk). The rest are built the same way, from easy to hard.'),
 history,cloze,extra,sprint,writing,homework,cheat,sources];
if(renderers.length!==titles.length)throw new Error('slide list and renderer list disagree');

$('prev').onclick=()=>go(current-1);
$('next').onclick=()=>go(current+1);
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;
 if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
 if(current===18&&/^[1-4]$/.test(e.key)&&!S.sprint.done){e.preventDefault();sprintPick(+e.key-1);return}
 if(t&&t.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
 if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}
 else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}
});
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('Full screen is not available here.'));else document.exitFullscreen?.()}
window.addEventListener('beforeunload',persist);
render();
if(S.sprint.start&&!S.sprint.done&&current===18)startClock(12);
</script><style>/* ============================================================

   в окно масштабированием, поэтому геометрия листа одинакова
   на ноутбуке, на проекторе и в записи экрана.
   Слева — постоянное оглавление. Содержимое листа прокручивается
   внутри сцены: рамка, шапка и оглавление всегда на месте.

 font-size:13px;line-height:1.34;-webkit-font-smoothing:antialiased}

.deck-rail-list::-webkit-scrollbar{width:7px}
.deck-rail-list::-webkit-scrollbar-thumb{background:var(--deck-rail-edge);border-radius:4px}
.deck-rail-list::-webkit-scrollbar-track{background:transparent}
.deck-rail-list li{margin:0}
.deck-rail .deck-group{padding:13px 16px 4px;font-size:9.5px;letter-spacing:.2em;
 text-transform:uppercase;opacity:.52;font-weight:600}
.deck-rail .deck-item{display:flex;gap:9px;align-items:baseline;width:100%;
 padding:6px 13px 6px 11px;margin:0;background:none;border:0;border-left:3px solid transparent;border-radius:0;
 color:inherit;font-family:inherit;font-size:13px;font-weight:400;line-height:1.34;letter-spacing:0;
 text-align:left;text-transform:none;cursor:pointer;transition:background .12s}
.deck-rail .deck-item i{font-style:normal;font-size:10px;opacity:.5;min-width:15px;
 font-variant-numeric:tabular-nums;flex:0 0 auto}
.deck-rail .deck-item span{flex:1 1 auto;min-width:0}
.deck-rail .deck-item:hover:not(:disabled){background:var(--deck-rail-hover);color:inherit}
.deck-rail .deck-item:active:not(:disabled){transform:none}
.deck-rail .deck-item:focus-visible{outline:2px solid var(--deck-rail-fg);outline-offset:-2px}
.deck-rail .deck-item[aria-current]{background:var(--deck-rail-active-bg);color:var(--deck-rail-active-fg);
 border-left-color:currentColor;font-weight:600}
.deck-rail .deck-item[aria-current] i{opacity:.7}
.deck-rail-foot{padding:9px 14px;border-top:1px solid var(--deck-rail-edge);
 display:flex;justify-content:space-between;gap:10px;
 font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;opacity:.55;font-variant-numeric:tabular-nums}

/* ---------- правая колонка: шапка сверху, лист прокручивается ---------- */
.deck-main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.deck-flexcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.deck-main>*,.deck-flexcol>*{flex:0 0 auto}
.deck-flexcol{flex:1 1 auto}
/* width:100% обязателен: у листа с margin:0 auto во флекс-колонке
   боковые auto-поля отменяют растягивание, и лист сжимается по содержимому */
.deck-scroll{flex:1 1 auto;width:100%;min-height:0;overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;scrollbar-width:thin}
.deck-scroll::-webkit-scrollbar{width:9px}
.deck-scroll::-webkit-scrollbar-thumb{background:var(--deck-rail-edge);border-radius:5px}
.deck-scroll::-webkit-scrollbar-track{background:transparent}
.deck-hide{display:none!important}

/* ---------- автоподгон листа ----------
   Структура листов рассчитана на 1280×720, но набор заданий на уровне Hard
   бывает длиннее, чем на Easy. Если лист всё же не помещается, слой уменьшает
   его масштаб до тех пор, пока прокрутка не исчезнет: скролла на слайде быть
   не должно ни при каком уровне. Ниже --deck-fit-min лист не сжимается. */
.deck-scroll{--deck-fit:1}
.deck-scroll>*{zoom:var(--deck-fit)}
/* лист короче сцены — содержимое центрируется по вертикали, иначе оно
   прижимается к шапке и низ слайда выглядит обрезанным */
.deck-scroll{display:flex;flex-direction:column;justify-content:safe center}
.deck-scroll>*{flex:0 0 auto}

/* ---------- узкий экран: сцена разворачивается в обычную страницу ---------- */
body.deck-flow{overflow:auto;height:auto}
body.deck-flow .deck-viewport{position:static;overflow:visible;background:none}
body.deck-flow .deck-stage{position:static;display:block;width:auto;height:auto;
 transform:none!important;box-shadow:none}
body.deck-flow .deck-rail{position:sticky;top:0;z-index:40;flex-direction:row;align-items:center;
 border-right:0;border-bottom:1px solid var(--deck-rail-edge);overflow-x:auto;overflow-y:hidden;padding:0 6px}
body.deck-flow .deck-rail-head,body.deck-flow .deck-rail-foot,body.deck-flow .deck-group{display:none}
body.deck-flow .deck-rail-list{display:flex;flex:0 0 auto;min-height:0;overflow:visible;padding:6px 0}
body.deck-flow .deck-rail .deck-item{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:5px 11px}
body.deck-flow .deck-rail .deck-item[aria-current]{border-bottom-color:currentColor}
body.deck-flow .deck-main,body.deck-flow .deck-flexcol{display:block;overflow:visible}
body.deck-flow .deck-scroll{overflow:visible;min-height:0}
.deck-rail .deck-item{transition:none}</style><script>/* ============================================================
   DECK LAYER · превращает лист урока в слайд презентации.
   Скрипт подключается последним и ничего не знает об уроке,
   кроме трёх вещей, общих для всех наших сборок: массива titles,
   переменной current и функции go(n). Если их нет (Wordcraft),
   оглавление собирается из кнопок [data-nav].
   Разметка урока не меняется: слой оборачивает её на лету.
   ============================================================ */
(function(){
'use strict';
if(window.__deckLayer)return;
const W=1280,H=720,BODY=document.body,ROOT=document.documentElement;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- палитра урока переносится на сцену ---------- */
const cs=getComputedStyle(BODY);
const PROPS=['background-color','background-image','background-size','background-position',
             'background-repeat','color','font-family','font-size','line-height'];
const paint=PROPS.map(p=>[p,cs.getPropertyValue(p)]);

const parse=s=>{const m=String(s).match(/-?[\d.]+/g);if(!m||m.length<3)return null;
 if(m.length>3&&parseFloat(m[3])===0)return null;return [+m[0],+m[1],+m[2]]};
const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
 return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
const BG=parse(cs.backgroundColor)||[255,255,255],FG=parse(cs.color)||[24,24,24];
const WHITE=[255,255,255],BLACK=[0,0,0],dark=lum(BG)<.42;
const theme=dark
 ?{bg:mix(BG,WHITE,.07),fg:mix(FG,WHITE,.12),edge:mix(BG,WHITE,.18),hover:mix(BG,WHITE,.13),
   abg:mix(BG,WHITE,.22),afg:'#fff',back:mix(BG,BLACK,.5)}
 :{bg:mix(FG,BLACK,.05),fg:mix(BG,WHITE,.6),edge:mix(FG,WHITE,.3),hover:mix(FG,WHITE,.13),
   abg:mix(BG,WHITE,.78),afg:mix(FG,BLACK,.12),back:mix(FG,BLACK,.42)};

/* ---------- сцена 1280×720 ---------- */
const viewport=document.createElement('div');viewport.className='deck-viewport';
const stage=document.createElement('div');stage.className='deck-stage';
const col=document.createElement('div');col.className='deck-main';
for(const node of [...BODY.childNodes]){
 if(node.nodeType===1&&(node.tagName==='SCRIPT'||node.tagName==='DIALOG'))continue;
 if(node.nodeType===3&&!node.textContent.trim()){node.remove();continue}
 col.appendChild(node);
}
paint.forEach(([p,v])=>{if(v)stage.style.setProperty(p,v)});
stage.style.setProperty('--deck-rail-bg',theme.bg);
stage.style.setProperty('--deck-rail-fg',theme.fg);
stage.style.setProperty('--deck-rail-edge',theme.edge);
stage.style.setProperty('--deck-rail-hover',theme.hover);
stage.style.setProperty('--deck-rail-active-bg',theme.abg);
stage.style.setProperty('--deck-rail-active-fg',theme.afg);
viewport.style.setProperty('--deck-backdrop',theme.back);

/* ---------- оглавление ---------- */
const ownRail=!col.querySelector('aside.sidebar nav');   /* у career-lab колонка уже своя */
const arr=(typeof titles!=='undefined'&&Array.isArray(titles))?titles:null;
const map=(!arr&&typeof titles!=='undefined'&&titles&&typeof titles==='object')?titles:null;
let rail=null,listEl=null,footNow=null;

if(ownRail){
 rail=document.createElement('nav');rail.className='deck-rail';
 rail.setAttribute('aria-label','Lesson contents');
 const name=(document.title.split('·')[0]||'Lesson').trim();
 let rows='',total=0;
 if(arr){
  const pre=t=>{const k=t.indexOf(' · ');return k>0?t.slice(0,k):''};
  const seen={};arr.forEach(t=>{const k=pre(t);if(k)seen[k]=(seen[k]||0)+1});
  let last=null;
  arr.forEach((t,i)=>{
   const k=pre(t),grouped=k&&seen[k]>1;
   if(grouped&&k!==last){rows+='<li class="deck-group">'+esc(k)+'</li>';last=k}
   if(!grouped)last=null;
   rows+='<li><button type="button" class="deck-item" data-page="'+i+'"><i>'+
     String(i+1).padStart(2,'0')+'</i><span>'+esc(grouped?t.slice(k.length+3):t)+'</span></button></li>';
  });
  total=arr.length;
 }else{
  const views=[];
  col.querySelectorAll('[data-nav]').forEach(b=>{const v=b.dataset.nav;if(v&&!views.includes(v))views.push(v)});
  views.forEach(v=>{
   const label=(map&&map[v])||v;
   rows+='<li><button type="button" class="deck-item" data-view="'+esc(v)+'"><span>'+esc(label)+'</span></button></li>';
  });
  total=views.length;
  col.querySelectorAll('.game-header nav').forEach(n=>n.classList.add('deck-hide'));
 }
 rail.innerHTML='<div class="deck-rail-head"><b>Contents</b><span>'+esc(name)+'</span></div>'+
  '<ol class="deck-rail-list">'+rows+'</ol>'+
  '<div class="deck-rail-foot"><span id="deckNow"></span><span>PgUp / PgDn</span></div>';
 stage.appendChild(rail);
 listEl=rail.querySelector('.deck-rail-list');
 footNow=rail.querySelector('#deckNow');
 footNow.textContent=total?'1 / '+total:'';
 listEl.addEventListener('click',e=>{
  const b=e.target.closest('.deck-item');if(!b)return;
  if(b.dataset.page!==undefined&&typeof go==='function')go(+b.dataset.page);
  else if(b.dataset.view&&typeof navigate==='function')navigate(b.dataset.view);
 });
 /* кнопки, открывавшие оглавление, теперь лишние */
 col.querySelectorAll('button[onclick*="contents"],button[onclick*="drawer"]').forEach(b=>{
  if(!b.closest('#drawer'))b.classList.add('deck-hide');
 });
}else{
 /* у урока уже своя колонка слева — сцена отдаёт ей всю ширину */
 stage.style.gridTemplateColumns='minmax(0,1fr)';
}

stage.appendChild(col);
viewport.appendChild(stage);
BODY.appendChild(viewport);
BODY.classList.add('deck-on');

/* ---------- лист прокручивается внутри сцены ---------- */
const sheet=col.querySelector('main');
if(sheet){
 for(let n=sheet.parentElement;n&&n!==col;n=n.parentElement)n.classList.add('deck-flexcol');
 sheet.classList.add('deck-scroll');
 /* уроки, где поля листа держались на центрировании по широкому экрану,
    внутри сцены остались бы без отступа от оглавления */
 const pad=getComputedStyle(sheet);
 if(parseFloat(pad.paddingLeft)<18){sheet.style.paddingLeft='30px';sheet.style.paddingRight='30px'}
}

/* ---------- вписывание сцены в окно ---------- */
let scale=1;
function fit(){
 const vw=window.innerWidth,vh=window.innerHeight,flow=vw<860||vh<460;
 BODY.classList.toggle('deck-flow',flow);
 ROOT.style.overflow=flow?'':'hidden';
 if(flow){scale=1;stage.style.transform='';return}
 scale=Math.min(vw/W,vh/H);
 stage.style.transform='translate('+Math.round((vw-W*scale)/2)+'px,'+
   Math.round((vh-H*scale)/2)+'px) scale('+scale+')';
}
window.addEventListener('resize',()=>{fit();fitSheet()},{passive:true});
window.addEventListener('orientationchange',fit);
fit();

/* ---------- синхронизация оглавления с текущим листом ---------- */
function reveal(el){
 if(!listEl||BODY.classList.contains('deck-flow'))return;
 const r=el.getBoundingClientRect(),b=listEl.getBoundingClientRect();
 if(r.top<b.top)listEl.scrollTop-=(b.top-r.top)/scale+10;
 else if(r.bottom>b.bottom)listEl.scrollTop+=(r.bottom-b.bottom)/scale+10;
}
function sync(){
 if(!listEl)return;
 if(arr){
  const n=(typeof current==='number')?current:null;
  if(n===null)return;
  listEl.querySelectorAll('.deck-item[data-page]').forEach(b=>{
   if(+b.dataset.page===n){b.setAttribute('aria-current','true');reveal(b)}
   else b.removeAttribute('aria-current');
  });
  if(footNow)footNow.textContent=(n+1)+' / '+arr.length;
 }else{
  /* игра переключает разделы по имени, а не по номеру листа */
  const view=BODY.dataset.view||(location.hash||'').replace('#','');
  let at=0,total=0;
  listEl.querySelectorAll('.deck-item[data-view]').forEach((b,k)=>{
   total++;
   if(b.dataset.view===view){b.setAttribute('aria-current','true');reveal(b);at=k+1}
   else b.removeAttribute('aria-current');
  });
  if(footNow)footNow.textContent=(at||1)+' / '+total;
 }
}
function top(){if(sheet)sheet.scrollTop=0}

/* ---------- лист всегда помещается в слайд ----------
   Сначала лист показывается в натуральную величину. Если содержимое выше сцены,
   масштаб уменьшается шагами: zoom меняет перенос строк, поэтому одного деления
   мало и результат уточняется в несколько проходов. */
const FIT_MIN=0.82;
function fitSheet(){
 if(!sheet)return;
 if(BODY.classList.contains('deck-flow')){sheet.style.removeProperty('--deck-fit');return}
 sheet.style.setProperty('--deck-fit','1');
 let z=1;
 for(let pass=0;pass<8;pass++){
  const over=sheet.scrollHeight-sheet.clientHeight;
  if(over<=0)break;
  let next=Math.max(FIT_MIN,z*(sheet.clientHeight-1)/sheet.scrollHeight);
  /* когда не хватает пары пикселей, деление даёт шаг меньше округления:
     в этом случае лист уменьшается на фиксированную долю, иначе полоса остаётся */
  if(next>=z-0.002)next=Math.max(FIT_MIN,z-0.006);
  if(next>=z)break;
  z=next;sheet.style.setProperty('--deck-fit',z.toFixed(3));
 }
}
for(const fn of ['go','navigate','setLevel','render']){
 const orig=window[fn];
 if(typeof orig!=='function')continue;
 window[fn]=function(){const r=orig.apply(this,arguments);top();sync();fitSheet();return r};
}
sync();

/* ---------- листание с клавиатуры ---------- */
window.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const t=e.target;
 if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
 if(typeof go!=='function'||typeof current!=='number')return;
 if(e.key==='PageDown'){e.preventDefault();go(current+1)}
 else if(e.key==='PageUp'){e.preventDefault();go(current-1)}
 else if(e.key==='Home'){e.preventDefault();go(0)}
 else if(e.key==='End'&&arr){e.preventDefault();go(arr.length-1)}
},true);

fitSheet();
window.__deckLayer={fit:fit,sync:sync,fitSheet:fitSheet,stage:stage};
})();
</script></body></html>
