, "hack": "Three of the ideas are NOT said by anyone — they are traps built from real words in the recording. Speaker 3 talks about FOMO, but she has only heard about it on the radio; she does not suffer from it herself.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio1-engl-9-11-pism-mun-novgorod-24-25.mp3", "https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio2-engl-9-11-pism-mun-novgorod-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-9-11-pism-mun-novgorod-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-9-11-pism-mun-novgorod-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-9-11-pism-mun-novgorod-24-25.pdf"]}, "parts": [{"t": "match", "instr": "Match the ideas to the speakers. Three ideas are not said by anyone.", "opts": [["a", "Has recently learned about some of the negative effects of excessive online communication."], ["b", "Is suffering from the fear of missing out."], ["c", "Has witnessed great changes in the way we communicate over recent years."], ["d", "Thinks that the amount of time teens spend online is alarming."], ["e", "Is quite happy for any photos of themselves to be posted online."], ["f", "Thinks limiting teenagers’ access to technology is unfair."], ["g", "Wishes people would talk more in person."], ["h", "Enjoys being able to contact all friends with the same message at once."]], "items": [["Speaker 1", "c"], ["Speaker 2", "g"], ["Speaker 3", "a"], ["Speaker 4", "f"], ["Speaker 5", "h"]], "note": "Not said by anyone: b, d, e."}], "dur": 248, "script": "Transcript for Living online\nSpeaker 1: I think that even up until just a few years ago we could never have imagined how our behavior would change with regards to using mobiles and tablets. I know that I would find it incredibly difficult to live without my mobile.\nI’m constantly looking at my phone to see if I’ve got any new messages or updates, and checking my apps to see what’s new. I wouldn’t say that I post my life online, not like some people I know, but I do like to keep up with what people are up to – friends, family and even other people I know but maybe haven’t seen for years, like old school friends, and check out photos of what they look like now, ha ha ha (laughing) …\nSpeaker 2: In a way, I think it’s quite funny that we’re always worrying about teenagers and young people becoming obsessed with online communication, but if you ask me we need to worry just as much about adults! At the office where I work, even when we have a break, nobody talks to each other unless they absolutely have to, which is a sorry state of affairs to say the least. Everyone’s too busy checking their social networks and sending messages to have time to communicate face-to-face! People spend their lunchtime glued to their screens or barely glance up from their phones. Even during meetings people can’t resist subtly checking their phone, and what really irritates me is when you are trying to talk to someone and they’re more interested in looking at their phone than paying attention to what you’re saying, even though you're right in front of them!\nPhubbing, I think it’s called!\nSpeaker 3: I was listening to this discussion on the radio the other day talking about online communication and they were talking about FOMO or, what was it,\nFear of Missing Out, which apparently is a kind of modern-day psychological syndrome which we’re affected by because of our obsession with online communication. Basically, they were saying that the reason why people feel that they have to be connected 24/7 and communicate everything they’re doing and keep up with everything that other people we know are doing is down to this fear of missing out. We’re worried that everyone is having more fun than us or doing something more exciting than us. They also said that because we’re spending more time communicating in the online world, we’re losing the ability to enjoy the present.\nSpeaker 4: My generation is so different to my parents’. I mean, they’re always telling me that they grew up in a world without mobiles and social networking and they managed fine. Hard to imagine how they arranged to meet their friends without a phone … but they say they did! Uh ... I had so many arguments with them while I was growing up, until they let me have my first smartphone. But they didn’t let me have Snapchat or Instagram or anything like that! ‘It’s not the end of the world,’ they’d say! They just didn’t understand that that’s the way people my age communicate with each other. Nobody actually talks on the phone any more.\nThey have no idea how much I missed out on at school being the only one who didn’t have Snapchat. Also, at school we had loads of talks and stuff on how to stay safe online and most of us knew that anything you post online was going to be there forever.\nSpeaker 5: For me, one of the best things about online communication is that you can stay in touch with everyone at the same time, all the time. You know exactly what’s going on, when and where, so you never miss out on anything. I love the fact that you can update all your friends on what’s going on in your life and they can respond immediately with a like or a comment, so you feel like you’re together with people even though you might be completely alone sitting on a bus or at home. I share loads of photos, but I only post up my best edited shots. I hate it when people I know post photos of me not looking my best."}, {"id": "l2-komi-24", "level": 2, "stage": "Municipal", "region": "Komi Republic", "year": "2024/25", "grades": "9–11", "title": "Things to do in the school holidays", "topics": ["People & relationships"], "time": "10 min", "plays": "twice", "about": "A woman on the radio gives parents ideas to keep children busy in the holidays without spending much money.", "hack": "The gap must fit the grammar of the note. “Get children to make ___ ahead of time” needs a plural noun: presents (or gifts). A singular “present” would be marked wrong.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-9-11-pism-mun-komi-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-9-11-pism-mun-komi-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-9-11-pism-mun-komi-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-9-11-pism-mun-komi-24-25.pdf"]}, "parts": [{"t": "gap", "instr": "Fill in the gaps using NO MORE THAN ONE WORD AND/OR A NUMBER.", "items": [["Main problem — children do not have a traditional ___", ["hobby"]], ["Give children jobs, for example cleaning the ___", ["car"]], ["At home, ask children to help in the ___", ["kitchen"]], ["Get children to make ___ ahead of time.", ["presents", "gifts"]], ["Get children involved in community work such as visiting the ___", ["elderly"]], ["Involve older children in long-term ___ in your community.", ["projects"]], ["You may get some ideas from the ___", ["Internet"]], ["The local ___ is often the best place to find ideas.", ["library"]], ["Make sure children stay ___", ["active", "busy"]], ["Children up to the age of ___ need to be supervised by an adult.", ["12", "twelve"]]]}], "dur": 176, "script": "1. You are going to listen to a talk which lasts 3minutes.\n Before listening, you will be given 1 minute to look through the task.\n Then you will listen to the information for the first time.\n After that you will be given 1 minute to check the task.\n Then you will listen to the information for the second time.\n After that you’ll be given 2 minutes to check the task.\n2. Study the tasks. You have 1 minute.\nPause 1 minute.\n3. Listen to the text (2,56 min).\nNarrator: You will hear a woman talking on the radio about things for children to do during the school holidays.\nThe school holidays are fast approaching and I'm sure all of you parents out there are worried about how to occupy your children. Well, I have a few tips that may help keep your children entertained without spending large amounts of money.\nOne of our biggest problems is that today's children often do not have the type of hobby that was familiar in the past, such as making their own toys. Instead they rely on sophisticated video games to keep them amused. But children also like to feel needed, so why not give them jobs to do around the house? You may be surprised how much they will enjoy simple tasks such as washing your car.\nAnother idea is to use this time to develop their cooking skills. Food is something we all enjoy, so why not get them to prepare some simple dishes in the kitchen?\nLearning to cook is a useful life skill for children to learn and it can also keep them happy for several hours.\nChildren also love doing arts and crafts, so why not give them the task of making presents for upcoming birthdays or celebrations? Not only will they enjoy making them but you'll also save some money and the family or friends who receive the gifts are sure to be delighted. A great idea to get children out of the house is to find out about how they can help in your local community. Perhaps there is a home for the elderly nearby. They are sure to welcome a visit from young people - even a few minutes a week can brighten their day. Of course younger children cannot do these things for very long, but older ones may find that there are ongoing projects around your neighbourhood that they can help with.\nThese are just a few ideas, but I'm sure you can think of many more. If not, there are plenty of places to look for other suggestions. Nowadays the first place people seem to look is the Internet, which can be a good source of information. However, it does have its limits because ideas suitable for children living in the city may not translate well for children in rural areas. So don't overlook your library. These are often filled with great ideas targeted at children in your specific area. There are a few key points to remember, however. One of the most important things is to keep your children active, otherwise they will be sure to get bored. Also remember that, although children can be very independent even from nine or ten years old, you should still be there to take care of them up to the age of twelve. So don't be tempted to let older children babysit their younger siblings. This should only be done by an adult.\n4. Do the task. You have 1 minute.\nPause 1 minute.\n5. Listen to the information for the second time.\nSecond listening.\n7. You have 2 minutes to check the task.\nPause 1 minute.\n8. You have 1 minute left to fulfill the tasks. Transfer all your answers to your answer sheet.\nPause 1 minute.\n9. Time is over. Put aside your pens."}, {"id": "l2-xakas-24", "level": 2, "stage": "Municipal", "region": "Republic of Khakassia", "year": "2024/25", "grades": "9–11", "title": "Prime Recruitment: a job as a nanny", "topics": ["School, work & careers"], "time": "15 min", "plays": "twice", "about": "A recruitment agent fills in a form with a young New Zealander and describes three families who need a nanny.", "hack": "Names and e-mails are SPELT OUT — write the letters as you hear them: E-D-W-I-N-A-R-I. And watch the correction trap: “You’re from Australia?” — “Actually, I’m a New Zealander.”", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-9-11-pism-mun-xakas-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-9-11-pism-mun-xakas-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-9-11-pism-mun-xakas-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-9-11-pism-mun-xakas-24-25.pdf"]}, "parts": [{"t": "gap", "instr": "Task 1. Complete the form. Write NO MORE THAN TWO WORDS for each answer.", "items": [["Email: ___ @worldnet.com", ["edwinari"]], ["Nationality: ___", ["New Zealander"]], ["Reference (professional): John Keen, manager of ___", ["play centre", "play center", "the play centre", "the play center"]], ["Reference (personal): Eileen Dorsini, job: ___", ["professor", "a professor"]], ["Special qualifications: current ___ certificate", ["first aid", "first-aid"]], ["certificate of competence in ___", ["sailing"]]]}, {"t": "gap", "instr": "Task 2. Childcare vacancies. Write NO MORE THAN ONE WORD for each answer.", "items": [["London · Benton · a girl and a boy · be keen on ___", ["sport", "sports"]], ["near Oxford · Granger · ___ boys · be an animal-lover", ["twin", "two"]], ["Location: ___ · Campbell · four girls", ["Scotland"]], ["Campbell family: be willing to ___ when camping", ["cook"]]]}], "dur": 888, "script": "You will hear a man who runs a recruitment agency talking to a young woman looking for a job.\nFirst you have some time to look at questions 1 to 6.\n[Pause the recording for 30 seconds.]\nYou will see that there is an example that has been done for you. On this occasion only, the conversation relating to this will be played first.\nClive: Hello, Edwina, is it? Have a seat.\nEdwina: Yes, Edwina. Thanks. I'm looking for a job as a nanny. I like working with children. I talked to you yesterday?\nClive: Oh, yes. Well, we covered most of the ground on the phone yesterday. I've got a form I need to complete for my records. So, (Example) you're Edwina Riley, and how should we contact you?\nThe woman’s name is Edwina Riley, so 'Riley' has been written in the space. Now we shall begin.\nListen carefully and answer questions I to 6.\n[repeat]\nEdwina: By email. I check it regularly.\nClive: What's the address?\nEdwina: (1) It's Edwina like my name then R-I, the first two letters of my surname. at worldnet dot com.\nClive: E-D-W-I-N-A-R-I at worldnet dot com?\nEdwina: Yes.\nClive: Good. And you're from Australia?\nEdwina: (2) Actually. I'm a New Zealander.\nClive: Oh, I'm sorry. I bet it's really irritating being told you're an Australian. Like Canadians being asked what part of the States they're from.\nEdwina: I'm used to it. It happens to us all the time.\nClive: And now, you said on the phone that you could bring me some references? One from someone who's known you in a professional capacity and one personal one?\nEdwina: Ah, yeah. Here's one from (3) John Keen, who was the manager at the play centre in\nWellington where l worked for three years after I left school. It's got all his contact details on.\nClive: Thank you. So this was your last employer?\nEdwina: Yes, apart from a bit of waitressing recently, but that was just temporary. I'm sure John will answer any questions if you contact him.\nClive: We do run checks, yes. And a personal reference?\nEdwina: Ah, you can contact the friend of my mother's I'm staying with here in London: (4) Eileen\nDorsini. She's a professor. She's known me all my life because she used to be our neighbour back home when she was a primary school teacher there. Now she's working here at the Institute of\nEducation.\nClive: Oh good!\nEdwina: I've got her contact details here for you.\nClive: Thanks. I think I have some jobs to suit you. Oh, do you have any practical qualifications, by the way? Life-saving, music, anything?\nEdwina: Um, (5) I've got an up-to-date first aid certificate. I did a course when I was working.\nClive: That's good. First aid. Anything else?\nEdwina: Well, I've got a driving licence; as I told you on the phone. But that's not special, you said, almost everyone needs that really. (6) I've got a sailing qualification, it's a certificate of competence.\nClive: So you're a yachtswoman?\nEdwina: I love sailing.\nClive: Well, I'll note you have a certificate. Hmm.\nBefore you hear the rest of the conversation, you have some time to look at questions 7 to 10.\n[Pause the recording for 30 seconds.]\nNow listen and answer questions 7 to 10\nClive: Now, as I mentioned yesterday, there are three families and the job description is much the same for all of them, as I explained. There are a few other things you need to know. Anyway, the first family's here in London.\nEdwina: Yes, I did make a few notes. London, er, that's the Bentons? With two children?\nClive: Yes. That's right, a girl of three and her brother who's eight. The little boy has a quite serious food allergy. Did you learn about things like that on your course?\nEdwina: Oh, well, I know what to do if someone has an allergic reaction.\nClive: Good, but (7) what they mainly want is someone with an interest in sport, as that's the kind of family they are.\nEdwina: Oh that's OK. I'll enjoy that.\nClive: Good. Now the next people are in the country, near Oxford.\nEdwina: Oh yeah, the Grangers?\nClive: So, (8) they have twin boys of five, who are a bit of a handful, I suspect, but it's a lovely place, quite a grand house, and the family is extremely welcoming. They keep horses. Do you ride?\nEdwina: I did when I was younger. I like animals generally.\nClive: Well, 'animal-lover' was their special request, so you'd be fine there the last family …\nEdwina: Yes?\nClive: I don't think I told you (9) they live in Scotland.\nEdwina: Really? What's their name?\nClive: Campbell.\nEdwina: Oh, yes. And they have four girls under ten?\nClive: That's it. They have a lovely city flat, and they own a small island.\nEdwina: Wow!\nClive: Actually, you might get on with them very well. (10) They particularly wanted someone who would be prepared to cook when they go camping on the island.\nEdwina: Camping would really suit me and I'm used to taking my turn doing the food. But it is a long way from London.\nClive: Mm. Yeah, well, you can think about it. Um, then as soon as I've checked your references, we can arrange for you to talk to all of the families.\nEdwina: Right. Thanks very much!\nClive: Thank you! I'll email you as soon as I can.\nThat is the end"}, {"id": "l2-vologda-24", "level": 2, "stage": "Municipal", "region": "Vologda region", "year": "2024/25", "grades": "9–11", "title": "From the city to the countryside · Sick buildings", "topics": ["Travel, food & places", "School, work & careers"], "time": "20 min", "plays": "Task 1 twice · Task 2 ONCE", "about": "Fiona describes moving from a city flat to a village. Then Jane and Martin compare the offices they have worked in.", "hack": "Task 2 is played only ONCE and asks whether a view is EXPRESSED at all — by either speaker. Tick Y as soon as someone says it, even if the other person disagrees (Martin likes busy offices, so 20 is Y).", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-9-11-pism-mun-vologda-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-9-11-pism-mun-vologda-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-9-11-pism-mun-vologda-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-9-11-pism-mun-vologda-24-25.pdf"]}, "parts": [{"t": "gap", "instr": "Task 1. Complete the sentences with a word or short phrase. You will hear it TWICE.", "items": [["Fiona says the lack of ___ in the countryside created a contrast at night.", ["street lights", "streetlights", "street lighting"]], ["Some rooms in the house can be rather ___ in winter.", ["damp"]], ["At first, the ___ made it difficult for Fiona to sleep in the house.", ["silence", "total silence"]], ["Fiona finds she tends to ___ later in the day than when she was in the city.", ["get up"]], ["In the countryside, Fiona sees ___ from her bedroom window.", ["rabbits"]], ["Fiona sometimes finds the slowness of the ___ where she lives rather irritating.", ["Internet", "Internet connection"]], ["Out in the countryside, Fiona sometimes can’t get ___ from friends.", ["calls", "phone calls", "mobile calls", "mobile phone calls"]], ["The nearest ___ is almost two kilometres away from where Fiona lives.", ["bus stop"]], ["Fiona says you need to have a ___ in the country, but not in the city.", ["car"]], ["Fiona won’t have to travel as far to the ___ as she would from her old home.", ["university"]]]}, {"t": "judge", "opts": [["Y", "Yes, said"], ["N", "No, not said"]], "instr": "Task 2. Jane and Martin. Is the view expressed (Y) or not (N)? You will hear it ONCE.", "items": [["Buildings with air-conditioning can make you ill.", "Y"], ["Office life is dull and boring.", "N"], ["Working in old buildings can be bad for your health.", "N"], ["Fresh air is preferable to air-conditioned air.", "Y"], ["Artificial light can make you tired.", "N"], ["Outside views can be distracting.", "N"], ["The layout of an office can’t influence how you feel.", "N"], ["People who work in the same office should only make necessary phone calls.", "N"], ["Quiet offices are not necessary for creative work.", "Y"], ["Busy offices are exciting places to work.", "Y"]]}], "dur": 1147, "script": "Task 1. Script\nMy parents now both work from home so they made the decision to move from our city-centre flat to the countryside, although it meant big changes for the whole family. It was a winter evening when we first went to the village, and as we walked along the pavement I remarked on how dark it was without the street lights of the city, and how bright that made the lights of the cars seem as they approached. I also noticed the sound of running water, and when we reached the house I was delighted to discover that it stood next to a little bridge over a stream. I soon decided I liked the house. It has thick stone walls, high ceilings and wooden floors. The central heating keeps the temperature in all the rooms pleasant throughout the year, although during the colder months those in the basement tend to get a bit damp, probably because of the stream. My room is actually on the other side of the house so I don't hear it at night, which is a pity, really. I was used to the constant big-city background noise of traffic and voices, and for a while after we moved in I'd keep waking up in the middle of the night owing to the total silence there. It doesn't bother me now, though, and these days I look forward to settling down for the night in my large, comfortable bed. I rarely stay up any later than when I was in the flat, and in the mornings I normally wake up at the same time, but there aren't the sounds of the city telling you it's time to get up so I'm usually in far less of a hurry to do so. The atmosphere here is so relaxing, and I have a wonderful view from the window of my room. Whereas before I'd see city wildlife like cats, dogs and maybe the occasional fox, here I start the day to the sound of distant farm animals and the sight of rabbits in the open fields. Apparently there are also deer around, though I haven't actually spotted any yet. The pace of life in the countryside is certainly slower, but I think I've adjusted pretty well to it. I must confess, though, that I can get a bit fed up with the speed of the\nInternet connection here, compared with how fast it was in the flat downtown. In spite of that I still manage to chat online with my friends there more or less whenever I want, so I don't have the feeling of missing them that I thought I might have before I moved. There is, though, fairly weak mobile reception out here - sometimes no signal at all - and when that happens I may not receive calls they're trying to make to me which can be annoying. I suppose poor public transport is another disadvantage of living in the country. There isn't a railway station within five kilometres, it's nearly a two-kilometre walk to get to a bus stop, and taxis charge a fortune to come out here. It's so different from where I grew up, where the buses stop right outside your home or you can take the Underground. You can live quite happily there without a car, but not here. People say 'why not go by bike?', but the reality is that it's just too far to ride anywhere from here - and dangerous on those country roads, especially in the dark. I'll just have to rely on my parents for lifts everywhere until I pass my driving test, which I hope will be before I go to university next year. Fortunately, it'll be a shorter drive from here than from where I used to live, and I'll avoid the awful traffic on the roads in and out of the city, too!\nTask 2. Script\nJ - Jane; M - Martin\nJ My first job was for a shipping company in London – well the main office was in London but it had offices all over the world. It was a good job, I mean the pay wasn't bad. The people were OK and my boss was great.\nM So why did you leave?\nJ I never seemed to feel well while I was there. For the first time in my life I developed some sort of asthma or hay fever or something.\nM Really? You mean you were coughing and spluttering all over the place? Was it air- conditioned?\nJ Yes, I couldn't bear it; not being able to open the windows breathing in everybody else's germs and so on.\nM Sounds as though it might have been a 'sick building'. I worked in one once - air-conditioned like yours, and we all used to go down with colds and flu or bad chests and things like that. At first the managers just said it was our imagination or that we weren't happy in our work but I really believed it was to do with the building. When I left there I went to work for a firm who were based in an old house - wonderful - I could open the windows and breathe real air!\nJ Do you think there was something in the air then, in your old place?\nM I'm sure there was - though we couldn't prove it. Mind you, it can't just be air-conditioning, because the place I work in now is the same, yet I feel fine.\nJ Yes, me too, but I think it's got more to do with the way the office is laid out. I mean where I am now it's spacious, the chairs are comfortable. I've got a lovely view over the park, and there are only two of us to a room. It makes you feel positive, and relaxed! It's a great environment to work in, especially when you compare it to open plan offices. I hate open plan offices - it's so distracting - all those phone calls and people rushing about.\nM Funny, that's what I like about where I am now. It's busy, people always jumping up and down and coming in with the latest news. It's really exciting.\nJ Sounds awful to me, but then I have to concentrate hard and try and be creative!\nM Oh, so you don't think working in a newspaper's really creative then? I'll have you know I …\nJ No, no, sorry, I didn't mean that, but it's a different sort of creative. Perhaps you need people buzzing about to stimulate you?\nM Yes, yes I do - there's nothing so stultifying as total silence for me ...\nJ Oh peace, perfect peace - I couldn't ask for anything else."}, {"id": "l2-nn-25", "level": 2, "stage": "Municipal", "region": "Nizhny Novgorod region", "year": "2025/26", "grades": "9–11", "title": "Christmas earworms", "topics": ["Music, arts & books"], "time": "10 min", "plays": "twice", "about": "A presentation about catchy Christmas songs: the “Christmas chord”, White Christmas and why we get sick of Mariah Carey by January.", "hack": "“Choose THREE letters” — you get a point for each correct letter, in any order. Tick only what you actually heard: “when we first hear a new piece of music, we tend to not like it very much” = E.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-9-11-pism-mun-nn-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-9-11-pism-mun-nn-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-9-11-pism-mun-nn-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-9-11-pism-mun-nn-25-26.pdf"]}, "parts": [{"t": "gap", "instr": "Questions 1–5. Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER.", "items": [["In the ___ to Christmas, we’re exposed to a shower of festive music.", ["run-up", "run up"]], ["A ___ “Christmas chord” might explain the popularity of Christmas songs and why they give us earworms.", ["mysterious"]], ["Among the cheesy ___ bells-filled tunes, there are some great Christmas classics.", ["sleigh"]], ["It also has the ___ of an earworm, and it contains that funny “Christmas chord”.", ["characteristics"]], ["A lot of Christmas music will be more popular than it might deserve to be as it usually only ___ a few months of the year.", ["gets aired"]]]}, {"t": "multi", "count": 3, "instr": "Questions 6–8. Which THREE statements about Christmas music are true?", "opts": [["A", "Half the Christmas songs we hear are irritating."], ["B", "Regardless of our preferences, Christmas tunes foster bonding among people."], ["C", "Songs full of bells are generally regarded as tacky."], ["D", "“Under the Mistletoe” by Justin Bieber is the best-selling Christmas song of all time."], ["E", "When people hear a song for the first time, they usually do not like it."]], "answer": ["B", "C", "E"]}, {"t": "multi", "count": 2, "instr": "Questions 9–10. Name TWO personalities who are not singers.", "opts": [["A", "Irving Berlin"], ["B", "Mariah"], ["C", "Adam Ragusea"], ["D", "The Pogues"], ["E", "Kelly Clarkson"]], "answer": ["A", "C"]}], "dur": 616, "script": "You will hear a presentation about Christmas catchy songs.\nYou will hear the text twice.\nFor questions 1-5, complete the sentences below. Write no more than two words and/or number for each answer.\nFor questions6-8, choose THREE letters, A-G, and write them next to questions 6-8 in any order.\nFor questions 9 and 10 Choose TWO letters, A-E, and write them next to questions 9 and 10 in either order.\nFirst, you have some time to look at Questions 1-10.\nPause 1 minute\nNow listen carefully and answer the questions.\nIn the run-up to Christmas, we’re exposed to a shower of festive music – on the radio and television, in shops, train stations, restaurants, pubs and bars. In the UK, our favourite old bands are being played everywhere along with newer singers like Kelly Clarkson and Justin Bieber. And, of course, Britain’s two most popular Christmas songs by Mariah Carey and The Pogues are getting their annual airing.\nSo are you humming Jingle Bells or All I Want for Christmas while you wrap your presents? Catchy music, \"sticky tunes\" or earworms, as they have become known, are songs that get stuck in our heads – and while about two-thirds are pleasant, some can become quite annoying.\nMusically, earworms seem to come more often from songs which have fairly conventional melodic patterns together with something unusual – a key change, or unexpected repetitions.\nThere’s a popular article written by journalism professor Adam Ragusea, who claims to have identified a mysterious \"Christmas chord\" that might explain the popularity of Christmas songs and why they give us earworms, although not all commentators are entirely convinced. But research suggests that even though there could be some common features, the specific songs that become earworms are different from person to person.\nWhat’s different about Christmas music is that we are all listening to a much smaller pool of musical options at this time of year. Because of the dominance of Christmas music in public places such as shops and bars, we all get a lot more exposure to the same songs than we do at other times of year. So we could argue that Christmas music helps bring us together – whether we love it or hate it.\nDreaming of a hit record\nAmong the cheesy sleigh bells-filled tunes, there are some great Christmas classics – and it’s interesting to note that White Christmas by Irving Berlin is not only consistently one of the most well- known Christmas songs but is the best-selling song of all time. It also has the characteristics of an earworm, and it contains that funny \"Christmas chord\". But how does a song like that maintain its popularity over the decades?\nAccording to some theories, when we first hear a new piece of music, we tend to not like it very much.\nBut repetition sparks liking – and repetition both within a song and through repeated listening over days, weeks and months will usually increase our fondness.\nThere’s a limit to this repetition effect. Too much of it sends liking down the other side of the curve, meaning that when we have heard something too much we eventually, and quickly, get quite fed up with it. In one research study, we find that people regulate their own exposure to their own music over very long periods of time.\nA lot of Christmas music, whether we think it’s good or bad, will be more popular than it might deserve to be as it usually only gets aired a few months of the year. By the time we’re taking down the Christmas tree in January, we’ve all become fully sick of Mariah and so we put it away in the attic with the tree, to be dusted off and enjoyed again next year.\nPause 10 sec.\nNow listen to the text again.\nText repeated.\nNow you have 2 minutes to complete the task and write down your answers on the answer sheet.\nPause 2 min.\nThis is the end of the listening task."}, {"id": "l2-kem-25", "level": 2, "stage": "Municipal", "region": "Kemerovo region", "year": "2025/26", "grades": "9–11", "title": "A talk about home education", "topics": ["School, work & careers"], "time": "15 min", "plays": "twice", "about": "A speaker weighs up the benefits and problems of educating children at home.", "hack": "“Mentioned” means actually said — not just logical. Knowledge gaps (G) and lack of discipline (D) sound like real problems of home-schooling, but the speaker never mentions them.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-9-11-pism-mun-kem-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-9-11-pism-mun-kem-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-9-11-pism-mun-kem-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-9-11-pism-mun-kem-25-26.pdf"]}, "parts": [{"t": "multi", "count": 6, "instr": "Task 1. Choose ALL the points that are mentioned in the talk.", "opts": [["A", "Less chance to discover interests"], ["B", "Fewer opportunities for socialization with peers"], ["C", "Personalized learning pace"], ["D", "Lack of structure and discipline"], ["E", "Individualized attention"], ["F", "Loss of full-time income"], ["G", "Potential for knowledge gaps"], ["H", "Reducing the risk of bullying and peer pressure"], ["I", "Exhausting for parents"], ["J", "Flexible timetable and curriculum"]], "answer": ["B", "C", "E", "F", "I", "J"]}, {"t": "multi", "count": 3, "instr": "Task 2. Which of the points you chose are ADVANTAGES of home education?", "opts": "same", "answer": ["C", "E", "J"]}, {"t": "multi", "count": 3, "instr": "Task 3. Which of the points you chose are DISADVANTAGES of home education?", "opts": "same", "answer": ["B", "F", "I"]}], "dur": 346, "script": "A Talk about Education\nIn most countries, education is compulsory for children of school age.\nHowever, even when education is compulsory, children do not always have to go to school. In some countries, such as the UK and the USA, it is legal for parents to educate their children at home if they want to. Parents who choose this path say there are many benefits and I must say I’m inclined to agree with them. One of the most popular reasons they give is that home schooling allows children to follow their own interests. So for example if a child loves animals, they can develop their reading with books about animals, and they can focus on animals in their science lessons. People who prefer home education say children make more progress this way and are more likely to enjoy their lessons.\nAnother way that home-schooling helps learning is that children can learn at their own speed. This is beneficial because fast learners do not get bored in lessons. And of equal importance, slow learners do not lose their self-confidence.\nAnother advantage is that every child can have a lot of one-to-one attention, which is just not possible in a busy classroom.\nIn addition, it is not necessary to have a fixed timetable. Parents can arrange lessons at different times. Also, many parents who educate their children at home can easily take them outside when the weather’s good. This allows them to get exercise and learn from the natural world. They can catch up on more formal lessons when the weather’s bad!\nHowever, home education is a big commitment and there are some potential problems. It can be an expensive choice, as one parent always needs to be at home instead of working, and the family also has to pay for books, paper, pens and other items that are provided free in schools. Many parents find it tiring to be with their children all day long.\nThere is also the issue of the children’s social lives. Some people worry that children who are home educated do not get enough opportunities to make friends outside the home. However, I don’t think this is necessarily true. Parents can overcome the problem by meeting up with other home-schooling families.\nHome education has been increasing in popularity recently and it’s easy to see why. However, it will always be important for parents to think very carefully before deciding not to send their children to school."}, {"id": "l2-irk-25", "level": 2, "stage": "Municipal", "region": "Irkutsk region", "year": "2025/26", "grades": "9–11", "title": "Boyfriends · Beyoncé beyond the music", "topics": ["People & relationships", "Music, arts & books"], "time": "15 min", "plays": "twice", "about": "Five women describe their boyfriends. Then a student presents Beyoncé’s businesses and charity work.", "hack": "Listen for synonyms of the adjective, not the adjective itself: “he doesn’t get stressed” = easygoing, “he always does what he says he will” = reliable. And beware: Speaker 3 wishes he were MORE romantic.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-9-11-pism-mun-irk-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-9-11-pism-mun-irk-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-9-11-pism-mun-irk-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-9-11-pism-mun-irk-25-26.pdf"]}, "parts": [{"t": "match", "instr": "Task 1. What does each speaker say about her boyfriend? One letter is extra.", "opts": [["A", "He’s reliable."], ["B", "He’s thoughtful."], ["C", "He’s patient."], ["D", "He’s easygoing."], ["E", "He’s romantic."], ["F", "He’s sociable."]], "items": [["Speaker 1", "B"], ["Speaker 2", "D"], ["Speaker 3", "F"], ["Speaker 4", "A"], ["Speaker 5", "E"]]}, {"t": "mcq", "instr": "Task 2. A presentation about Beyoncé. Choose A, B or C.", "items": [["The first business Beyoncé was involved with was …", ["perfumes.", "games.", "drinks."], 1], ["The name for Beyoncé’s clothing business came from her … connections with making clothes.", ["mother’s", "great-grandmother’s", "grandmother’s"], 2], ["Since 2010, Beyoncé’s fashions can also be bought in …", ["the US.", "Brazil.", "Canada."], 1], ["Beyoncé and Kelly Rowland set up a charity after the hurricane in her hometown in …", ["2005.", "2008.", "2011."], 0], ["In her “Chime for Change” campaign, Beyoncé asked … to help her.", ["young mothers", "older women", "other famous people"], 2]]}], "dur": 642, "script": "Task 1.\nSpeaker 1. It’s the little things he does for me that I think make him special. For example, one day last week he dropped off an umbrella for me at work because he thought it might rain that evening and he didn’t want me to get wet. That was so sweet! And he does that kind of considerate thing all the time. He’s very romantic sometimes, too – you know, in the traditional sense, giving little gifts and so on.\nSpeaker 2. My boyfriend has lots of great qualities. He’s very good-looking, for a start, and he dresses well too. I think the best thing about him is that he’s very relaxed. Unlike me, he doesn’t get stressed about things. No matter what happens, he’s the same! I wish I could be like that.\nSpeaker 3. What do I like about my boyfriend? Oh, lots of things really. He gets on so well with all my friends and family, and that makes life much more pleasant\nI can tell you. He can mix with people so easily! I’m shy to begin with, and it takes me ages to feel comfortable with new people. But, I just wish he could be a bit more romantic sometimes!\nSpeaker 4. I like the fact that he always does what he says he will … well, when he can, of course! That’s important, you know, because who wants to be with someone who constantly lets you down? That’s the best thing about him – so, yeah, I am very lucky, I suppose. Oh, and he’s handsome too, which doesn’t hurt.\nMy friend thinks he looks like a male model!\nSpeaker 5. He makes me feel so special, especially when he writes me poems telling me just how much he loves me or sends me flowers at work. I love all that stuff … and I text him little messages during the day too. He’s pretty great all round, but sometimes he loses patience with me if I’m late … which I often am.\nTask 2\nHi everyone! My presentation today is on Beyoncé – as you know I’m her biggest fan! Anyway, I’m not going to talk about all the usual things because most of us know those. Instead, I’m going to tell you about some of the other things she’s involved in, and for which she may be less well known.\nSince 2002, Beyoncé has worked with the drinks company Pepsi, and she’s appeared in several of their adverts along with other well-known pop stars. She’s also worked with some famous fashion designers, promoting their perfumes. She brought out her own perfume in 2010, not long after she started to work with one of these designers. She’s had deals with video-games companies, for example\nNintendo, since 1999.\nIn 2005, Beyoncé and her mother started a fashion company called the House of\nDereon. They gave it this name in honour of Beyoncé’s grandmother who has the surname Dereon, and is well known for making clothes. The collection includes everything from outerwear, like coats and jackets, to shoes and handbags, and was originally sold only in the US and Canada, but since 2010 has also been available in Brazil.\nBeyoncé also does a lot of work for various charities, and has helped raise millions of dollars for good causes. After Hurricane Katrina in 2005, she set up a group with her friend and ex-band member Kelly Rowland to provide housing for all those who’d lost their homes in the hurricane in the area around the city of\nHouston, Texas, where she was born. This group then went on to work with other charities in the city which provide food and clothing for those who need it, and it also provided help when Hurricane Ike struck the area three years later in 2008.\nMore recently, in 2013, Beyoncé announced that she would be working on a special campaign called ‘Chime for Change’. The aim of this is to fight for women’s and girl’s rights all over the world – no matter where they are or how old they are – and allow them to make their voice heard. Now, as a mother herself, this is something she feels very strongly about. To raise money for this cause, Beyoncé took part in a concert alongside many other celebrities in London in June 2013.\nSo, that’s a little more about Beyoncé and if …"}, {"id": "l3-reg-19", "level": 3, "stage": "Regional", "region": "All Russia", "year": "2019/20", "grades": "9–11", "title": "Good and bad statistics · A phone call", "topics": ["Money & society", "School, work & careers"], "time": "15 min", "plays": "Task 1 twice · Task 2 ONCE", "about": "An interview about how statistics can mislead us. Then a friendly business phone call between Sam and Katherine.", "hack": "At regional level, statements twist the numbers: 60% of Britons believe the answer is 50% — the statement says they believe 25%, so it is False. In Task 2 (heard ONCE) small talk hides the answers: “picked up a bit” = grew slightly.", "src": {"audio": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2019-20/region/engl/audio-engl-9-11-pism-reg-19-20.mp3"], "tasks": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2019-20/region/engl/tasks-engl-9-11-pism-reg-19-20.pdf"], "razbor": ["https://vos.olimpiada.ru/upload/files/files-2019-20/reg/razbor-engl-9-11-pism-reg-19-20.pdf"], "ans": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2019-20/region/engl/ans-engl-9-11-pism-reg-19-20.pdf"], "script": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2019-20/region/engl/script-engl-9-11-pism-reg-19-20.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Task 1. True (A) or False (B)? You will hear the text TWICE.", "items": [["More than half of the British people believe that the probability of tossing a coin twice and getting two heads is 25%.", "F"], ["Tom Hunter believes that we don’t make use of statistics and probabilities in our daily life.", "F"], ["Good statistics are associated with companies’ profits, while bad statistics are associated with companies’ losses.", "F"], ["Researchers may be forced to find positive results because they are afraid to lose their jobs.", "T"], ["The results are more valid if you ask 50 people on the social media than choose 5000 respondents randomly.", "F"], ["Even respected journals may publish incorrect results.", "T"], ["The case of Company A and Company B shows that absolute and relative figures can lead to different conclusions.", "T"], ["Tom Hunter believes that most people are good at basic maths.", "F"], ["The probability of random events is always 50%.", "F"], ["TV sales and crime rates are strongly correlated.", "F"]]}, {"t": "mcq", "instr": "Task 2. A telephone conversation. Choose A, B or C. You will hear it only ONCE.", "items": [["Katherine says the delivery", ["hasn’t come yet.", "came on Monday.", "came in the morning."], 2], ["Katherine says the sales", ["took off.", "grew slightly.", "dropped."], 1], ["Sam’s child is", ["nearly two years old.", "nearly one year old.", "just born."], 1], ["Mary has been away", ["in the hospital.", "on holiday.", "on business."], 2], ["The holiday in Crete was not", ["lovely.", "necessary.", "long."], 2]]}], "dur": 811, "script": "Listening\nTask 1\nFor items 1-10 listen to part of an interview about statistics and decide whether the statements (1-10) are TRUE (A), or FALSE (B) according to the text you hear. You will hear the text TWICE. You have 20 seconds to look through the items.\n(pause 20 seconds)\nNow we begin.\nP = Presenter, T = Tom Hunter\nP: So next, statistics - often thought to be the worst kind of lying there is! A recent survey found that 60% of Britons believe the probability of tossing a coin twice and getting two heads is 50%, rather than the correct answer of 25%. Our guest today, Tom Hunter, thinks this is a worry and says we need to get to grips with stats. Tom, welcome.\nT: Hi.\nP: So, what’s the problem? We don’t really make use of stats and probabilities in our daily lives, do we?\nT: Oh my! Well, that’s a common belief, but gosh! I mean, we’re surrounded by statistics:\nopinion polls, crime figures, product claims in advertising ...\nP: Exactly! I mean, it’s just used to sell stuff and so we ignore it!\nT: Well, of course, statistics can be used to manipulate, but they also inform policy development, scientific progress and many individual decisions. The heart of the matter is that there are good statistics and bad ones. And knowing the difference is empowering.\nP: OK. So, how can we tell the good from the bad?\nT: Well, we need to recognize that different approaches to data collection have different degrees of validity. And we need to look for underlying problems with any research we encounter.\nP: For example?\nT: Well, say a food company is having some research done to see if its product has health benefits, right? It has a vested interest in the process, so researchers may get pressured into finding positive results. They may worry about not being employed again, which may affect their conclusions. Similarly, asking 50 people on social media will be less valid than a survey of 5,000 people chosen at random. That’s not just because the sample size is too small, but also because social media will tend to attract people of similar views, so this grouping effect may exaggerate the results further.\nP: Shouldn’t publishers filter out this poor research?\nT: Mmm, you’d hope so. Obviously, research in a respected journal, reviewed by other experts, will be better than something published anonymously online, but even peer reviews can underestimate aspects like sample size. And interpretations can also be wrong. So, we always need to be on our guard.\nP: Yeah, you mean the wrong conclusions may be drawn, whatever the data?\nT: Absolutely. Take the issue of relative and absolute figures.\nP: Relative and absolute?\nT: Yeah. Say Company A produced 10,000 units last year and increased it to 12,000 this year.\nThat’d be a 20% rise relative to its previous performance and an absolute increase of 2,000 units.\nCompany B, on the other hand, produced 1,000 units last year and 1,400 this year - a rise of its rival, but in absolute terms its rival produced an extra 1,600 units compared to Company B.\nP: I see.\nCompany A may have achieved theirs whilst cutting staff. So, far from doing 100% better than a rival, Company B’s actually being hugely outperformed. And, of course, one year doesn’t make a trend. It could just be an anomaly.\nP: Maybe they had one client who ordered a huge amount and won’t repeat it.\nT: Exactly. So you can see it’s the focus on either a relative or absolute figure and choosing the start and end point for the figures that can be used to twist data to suit your own ends.\nP: Sure. So, what about the probabilities we started with?\nT: Well, the initial problem is basic maths. However, people also misunderstand how probability works as a prediction tool. They don’t understand variables and the degree to which they’re dependent.\nP: OK...\nT: If you had just thrown a head, or indeed six heads or ten, the probability of the next throw being a head is still 50%, not 25% or smaller. That’s because these are random events out of your control. However, the probability of having a heart attack, say, is dependent on whether you’ve had one before. If you have, the risk of another is greatly increased.\nP: Time to cut down on salt!\nT: Well, maybe, but claims about direct correlations also need to be treated sceptically. As an extreme comparison, the fact that TV sales may increase in line with crime does not prove that one affects the other!\nP: Well, you’re beginning to convince me, but can you give some other examples ...\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nNow listen to the text again.\n(text repeated)\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nTask 2\nFor items 11-15 listen to the text. Choose the correct answer (A, B or C) to answer questions 11-15. You will hear the text only ONCE.\nYou now have 25 seconds to study the questions.\n(pause 25 seconds)\nNow we begin.\nK: Hello, InTech Corporation. Katherine speaking. How can I help you?\nS: Oh, hello there, Katherine. It’s me, Sam.\nK: Oh, hi. How’re you?\nS: Not too bad, thanks. Listen, I’m just calling to check whether the delivery we sent out on\nMonday has reached you yet.\nK: It has, yeah. It came in this morning, I believe.\nS: Oh, that’s good. I was just panicking over nothing, then.\nK: Well, better safe than sorry, isn’t it?\nS: Exactly. Anyway, how’re you? How’re things your end?\nK: Oh, you know. We’re hanging in there. Sales have actually picked up a bit this quarter, so that’s good, and we’ve actually taken on a couple of new people, so can’t complain, you know.\nHow’s life with you? How’s the little one?\nS: Oh, she’s good. She’s just coming up to one now and she’s crawling around everywhere and babbling away to herself all the time.\nK: Aww!\nS: Yeah. I'll send you pictures if you want.\nK: That’d be lovely, yeah. And how’s Mary?\nS: She’s OK. She’s been away a lot with work recently, actually, which has been a bit of a pain, but hopefully that’ll ease off a bit soon.\nK: Mmm, yeah, that can’t be easy. Hey, how was your holiday? Didn’t you go away somewhere recently?\nS: Yeah, that’s right, we did. Two weeks in Crete. Oh, it was lovely. Over far too quickly, of course, but much needed.\nK: Oh, that’s good, though.\nS: Yeah.\nThis is the end of the listening comprehension part. You have 1 minute to complete your answer."}, {"id": "l3-reg-21", "level": 3, "stage": "Regional", "region": "All Russia", "year": "2021/22", "grades": "9–11", "title": "A woman in engineering · The job interview", "topics": ["School, work & careers"], "time": "15 min", "plays": "Task 1 twice · Task 2 ONCE", "about": "An interview with Lindsey Barone, head of engineering at an aerospace company. Then Richard tells a friend about his interview for a job as a foreign correspondent.", "hack": "Check the verb, not only the topic. Lindsey DID tests at the start of her career, but NOW she “mainly works in project management” — so “at present she spends most of her time doing tests” is False.", "src": {"audio": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2021-22/reg/engl/audio-engl-11-pism-reg-21-22.mp3"], "tasks": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2021-22/reg/engl/tasks-engl-11-pism-reg-21-22.pdf"], "ans": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2021-22/reg/engl/ans-engl-11-pism-reg-21-22.pdf"], "script": ["https://vos.olimpiada.ru/upload/files/Arhive_tasks/2021-22/reg/engl/script-engl-11-pism-reg-21-22.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Task 1. True (A) or False (B)? You will hear the text TWICE.", "items": [["Lindsey became an engineer to improve the world.", "T"], ["Lindsey believes engineering deals with proposing new theories.", "F"], ["There were quite a few female students in the mechanical engineering department.", "F"], ["Lindsey felt uncomfortable at the university at the beginning.", "T"], ["Lindsey started her career in a car manufacturing industry.", "F"], ["Lindsey worked on military aircraft before her present job.", "F"], ["At present Lindsey spends most of her time doing tests.", "F"], ["It was not easy for Lindsey to be the boss of a male team.", "T"], ["Lindsey likes engineering because it is well paid.", "F"], ["Lindsey wants there to be more female engineers.", "T"]]}, {"t": "mcq", "instr": "Task 2. A dialogue. Choose A, B or C. You will hear it only ONCE.", "items": [["Richard is", ["a traveler.", "a journalist.", "the editor of a newspaper."], 1], ["Richard was NOT interested in", ["South America.", "Arab countries.", "European countries."], 2], ["Richard is bilingual in English and", ["Spanish.", "Portuguese.", "Arabic."], 2], ["The hardest question for Richard was about", ["his further qualifications.", "the qualities of a foreign correspondent.", "the articles he had written."], 1], ["Richard goes to the gym", ["three times a week.", "two times a week.", "once a week."], 0]]}], "dur": 592, "script": "Listening\nTask 1\nFor items 1-10 listen to the interview with a woman engineer and decide whether the statements (1-10) are TRUE (A), or FALSE (B) according to the text you hear.\nYou will hear the text TWICE. You have 20 seconds to look through the items.\n(pause 20 seconds)\nNow we begin.\nInterviewer: For our next guest on 'A Woman's World', I'd like to welcome to the programme\nLindsey Barone, head of engineering at Swift Aerospace - a very good example of a woman in a man's world.\nLindsey: Good morning.\nInterviewer: Lindsey, you're an engineer, but why did you become one? What got you interested?\nLindsey: Well, from a young age I was always interested in how things work. I chose engineering as a career because I wanted to make things better. Engineering isn't just about testing theories and building models. It's about designing new products and finding new uses for old products. I want to improve the way the world works.\nInterviewer: Mmm, interesting. And could you tell me a bit about your training?\nLindsey: Well, I studied engineering at university. I was the only woman in the mechanical engineering department!\nInterviewer: So, how was that?\nLindsey: Well at first, I felt a bit uncomfortable, but after a while, it didn't bother me. People got used to me and I was treated like anyone else. In fact, sometimes it was a bit of an advantage because people liked to have me in their team!\nInterviewer: You're head of engineering now. How did you get to where you are today?\nLindsey: Well, I started in a test lab for aeroplanes. I did stress and fatigue tests there. Basically,\nI broke things! Doing that sort of research is very important as it tells you what loads the structures can carry. Then I went into aeroplane design. I worked on all areas of commercial planes before moving into project management in the aircraft industry.\nInterviewer: Could you tell me a bit more about what you do now?\nLindsey: Sure. These days I mainly work in project management. I take ideas for projects and investigate their feasibility - that means I see if the projects are possible to carry out. Next, I develop the objectives and estimate the cost of the project. Then I help the people working on the project to meet their deadlines. I have to make sure projects come in on budget and on schedule.\nInterviewer: Now you're head of department and I guess in charge of a lot of men. How do you find that?\nLindsey: Well, it wasn't too easy at first. I had to prove myself. When they could see that I had good practical experience and ability, everything was fine.\nInterviewer: I suppose that's true of anyone who's in charge. OK, Lindsey, finally - what's the best thing about being an engineer?\nLindsey: That's an easy one to answer. I love the challenge of finding solutions to problems. I hope that what I do improves people's lives. For me, engineering is fun, exciting and satisfying.\nSo let's have more women in engineering in the future!\nInterviewer: Thanks very much, Lindsey.\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nNow listen to the text again.\n(text repeated)\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nTask 2\nFor items 11-15 listen to the dialogue. Choose the correct answer (A, B or C) to answer questions 11-15. You will hear the text only ONCE.\nYou now have 25 seconds to study the questions.\n(pause 25 seconds)\nNow we begin.\nN = Nura, R = Richard\nN: Hi, Richard. How did you get on in the interview? Did it go well?\nR: I don't know really. I think so.\nN: So ... what kind of questions did they ask you?\nR: Well, the editor of the newspaper did most of the talking. She asked me why I wanted to be a foreign correspondent and obviously I was expecting that. I said that I'd travelled a lot when I was a student, that I enjoyed travelling and that now I was a journalist, I wanted it to be part of my job. Then she wanted to know what parts of the world I was interested in.\nN: Mmm, what did you say?\nR: Well, all the Arab countries, and South America. I told her that I also knew Brazil and\nArgentina well, so they would be interesting to report on.\nN: I see. What else did she ask you? Those questions don't sound too difficult.\nR: No, they weren't really. Well, the subject of languages came up. She asked if I spoke any foreign languages.\nN: Ha! That was an easy one for you!\nR: Yeah, I told her I was bilingual in English and Arabic and that I spoke Spanish and\nPortuguese fluently. She seemed pretty impressed.\nN: I'm sure she was. Did she offer you the job on the spot?\nR: Not quite. She wanted to know where I'd gone to university and if I'd taken any further qualifications. She also wanted to know what articles I'd written and so on. There was only one difficult question really ...\nN: Oh yeah?\nR: Mmm, she asked me what qualities a journalist needed to be a foreign correspondent. I wasn't sure how to answer that one.\nN: How did you handle it?\nR: Well, I said, obviously, I'd never done the job, but I had thought about it. I said that foreign correspondents had to be able to make decisions without waiting for people to tell you what to do. So, they needed to show initiative when they were reporting in a foreign country.\nN: I think that's a really good answer. Was she pleased?\nR: She seemed to be. Anyway, there were a few more questions, then at the end, she asked if I was physically fit. I said that I went to the gym three times a week so I should be.\nN: Good answer. Do you think you'll get the job?\nR: I've got a good chance, I think, but I wasn't the only candidate. I'll just keep my fingers crossed and hope for the best.\nYou have 1 minute to complete your answer."}, {"id": "l3-reg-23", "level": 3, "stage": "Regional", "region": "All Russia", "year": "2023/24", "grades": "9–11", "title": "How Bogotá was transformed · A nightmare train journey", "topics": ["Travel, food & places", "Money & society"], "time": "15 min", "plays": "Task 1 twice · Task 2 ONCE", "about": "How mayor Enrique Peñalosa changed Bogotá, the capital of Colombia. Then Diana tells Ethan about her trip to Birmingham.", "hack": "Regional statements paraphrase with rarer words: “expropriated the land” = deprived some people of their property (True). And one sentence can cancel another: Peñalosa is credited, BUT other mayors “secured the city’s finances” — so statement 3 is False.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2023/audio-engl-9-11-pism-reg-23-24.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2023/tasks-engl-9-11-pism-reg-23-24.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2023/anskrit-engl-9-11-pism-reg-23-24.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2023/script-engl-9-11-pism-reg-23-24.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Task 1. True (A) or False (B)? You will hear the text TWICE.", "items": [["The former governor of Bogota aimed at creating a child-friendly environment.", "T"], ["Bogota roads used to have too much traffic before the reforms.", "T"], ["Enrique Penalosa is honored for saving city funds needed for the reforms.", "F"], ["The heart of the city was constantly patrolled and controlled by the police.", "F"], ["People in the South of the city were as wealthy as those in the North.", "F"], ["The government deprived some people of their property.", "T"], ["The cars were allowed to park on wide sidewalks.", "F"], ["Some of the changes were paid for by motorists.", "T"], ["The investments into schools DIDN’T affect the number of pupils.", "F"], ["Enrique Penalosa was criticized for relocating city dwellers.", "T"]]}, {"t": "mcq", "instr": "Task 2. A conversation. Choose A, B or C. You will hear it only ONCE.", "items": [["Diana’s trip to Birmingham was", ["fine.", "too short.", "horrible."], 2], ["Diana had to come back by", ["bus.", "carriage.", "high-speed rail."], 0], ["When Ethan heard Diana’s story, he was", ["shocked.", "feeling nervous.", "feeling pity."], 0], ["How did Diana know about the transport problems?", ["She went to the station.", "She called to check the timetable.", "She was told at the ticket office."], 1], ["On her way to Birmingham Diana DIDN’T", ["leave the train.", "have to wait for the train.", "have a seat on the train."], 2]]}], "dur": 549, "script": "Listening\nTask 1\nFor items 1-10 listen to the talk about Bogota, the capital of Colombia, and decide whether the statements (1-10) are TRUE (A), or FALSE (B) according to the text you hear. You will hear the text TWICE. You have 20 seconds to look through the items.\n(pause 20 seconds)\nNow we begin.\nThe ex-mayor of Bogota, Enrique Penalosa, has argued that if we ever achieve a successful city for children, we will have built the perfect city for all citizens. In Bogota, the capital of\nColombia, they have tried to fulfil this ideal by transforming what was once a chaotic city - badly affected by congestion and gripped by fear of crime - into one far better for children.\nPenalosa is largely credited with this transformation through the large-scale reforms he initiated at the turn of the century. However, if other mayors hadn’t secured the city’s finances before him and developed his reforms afterwards, the changes wouldn’t have been so successful.\nOne of the first steps he took was to clear a large slum that dominated the centre of Bogota and replace it with a large public space. The slum had been a no-go zone for police and had effectively created a barrier between the affluent north and the more deprived south of the city.\nBy demolishing it, the city was immediately brought closer together. Having cleared one space,\nPenalosa’s administration then expropriated the land of a private country club in the north of the city. Its golf course and polo fields were converted into a free park with sports facilities for all.\nThey then started to tackle congestion and the lack of facilities for pedestrians and cyclists. Wide pavements were built and cars were prevented from parking on them - a move that led to huge protests. The government built miles and miles of cycle lanes and set up a huge network of buses, again using separate lanes. They also imposed restrictions on car use and increased taxes on petrol, the money from which went back into the new transport system.\nFinally, they poured money into education - building new schools and a network of libraries, several in the most deprived neighbourhoods. The schools were also given thousands of computers connected to both the Internet and the libraries. The programme resulted in a huge increase in enrolment and school attendance.\nDuring his time in office, Penalosa did not escape criticism and after his three-year term in office, he failed to be re-elected in subsequent attempts. Some critics hate aspects of the road laws; others complain new housing is far from their original home in the city centre.\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nNow listen to the text again.\n(text repeated)\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nTask 2\nFor items 11-15 listen to the conversation. Choose the correct answer (A, B or C)\nto answer questions 11-15. You will hear the text only ONCE.\nYou now have 25 seconds to study the questions.\n(pause 25 seconds)\nNow we begin.\nEthan: How was it in Birmingham? You went to see your parents, didn’t you?\nDiana: Oh, Birmingham was fine, but it was an absolute nightmare getting there and back.\nE: Really? I heard there was some disruption on the line.\nD: Yeah, just a bit! We had to come back by coach in the end because there were no Goldlink trains running on Saturday.\nE: What? None?\nD: Well, we could've got a train with another company, but they had engineering works, which meant we’d have to get a bus part of the way, so it was going to take over four hours.\nE: Four? That’s outrageous! Didn't they warn you that this was going to happen?\nD: Well, this is it. When I bought the ticket I said we were coming back on Saturday, but they didn’t say anything. It was lucky I rang up to check the train times on Saturday morning.\nOtherwise, we would’ve turned up at the station and had nowhere to go.\nE: Mmm. So are you going to try and get your money back, then?\nD: Too right I am. I mean, it wasn’t just the return journey - on the way out, the train left late and then we were all ordered off at the next stop to catch a connecting train that was supposed to make up the lost time. But when we got off, no-one had the faintest idea what was going on.\nThere was no connecting train and we had to wait almost an hour for the next one to come along.\nAnd of course, when it arrived it was packed, so we had to stand most of the way.\nE: It must’ve spoilt your weekend!\nThis is the end of the listening comprehension part. You have 1 minute to complete your answer."}, {"id": "l3-final-24", "level": 3, "stage": "Final", "region": "All Russia", "year": "2024/25", "grades": "9–11", "title": "Can money buy happiness? · The school reunion", "topics": ["Money & society", "People & relationships"], "time": "15 min", "plays": "Task 1 twice · Task 2 ONCE", "about": "A Harvard Business School professor explains research on “prosocial spending”. Then Bridget tells Mark about her school reunion and “jolly Judith”.", "hack": "The final stage paraphrases idioms: Judith told Bridget about her “ups and downs” — the option says “peaks and valleys”. And sarcasm counts: “the dreaded, jolly Judith… I tried to avoid her” means people are reluctant to talk to her.", "src": {"audio": ["https://всош.цпм.рф/upload/files/Arhive_tasks/2024-25/final/engl/audio-engl-9-11-pism-final-24-25.mp3"], "tasks": ["https://всош.цпм.рф/upload/files/Arhive_tasks/2024-25/final/engl/tasks-engl-9-11-pism-final-24-25.pdf"], "ans": ["https://всош.цпм.рф/upload/files/Arhive_tasks/2024-25/final/engl/anskrit-engl-9-11-pism-final-24-25.pdf"], "script": ["https://всош.цпм.рф/upload/files/Arhive_tasks/2024-25/final/engl/script-engl-9-11-pism-final-24-25.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Task 1. True (A) or False (B)? You will hear the text TWICE.", "items": [["The researchers focused on the fact that money never makes people happier.", "F"], ["According to the speaker, purchasing a brand-new gadget can’t buy you as much happiness as giving it as a present to another person.", "T"], ["The bigger the total amount of money people spend on philanthropy, the happier they are.", "F"], ["In the long run, the surveyed in one study were positively affected by the amount of their perks.", "F"], ["Pocket change spent in a noble way proved to boost one’s well-being.", "T"], ["Previous extensive research proved poor people are happier when they become reasonably wealthy.", "T"], ["The effect of earnings on happiness is stronger when a well-off person becomes more prosperous.", "F"], ["According to the speaker, a pay raise may affect family relationships.", "F"], ["The researchers tested the correlation between being informed about prosocial spending and happiness among university students.", "F"], ["Knowledge about prosocial spending slightly reduced its positive effect.", "F"]]}, {"t": "mcq", "instr": "Task 2. A conversation. Choose A, B or C. You will hear it only ONCE.", "items": [["Bridget attended her school reunion", ["last month.", "last week.", "15 years ago."], 1], ["At the school reunion Bridget talked", ["only to the people she knew.", "to Judith only.", "to different classmates."], 2], ["What is TRUE about Judith?", ["People feel reluctant to talk to her.", "She is a gloomy and moody person.", "She avoids talking to people."], 0], ["Judith told Bridget about her", ["peaks and valleys.", "tremendous ex-husband.", "dreadful medical condition."], 0], ["Bridget promised Judith to", ["stay in contact.", "write her biography.", "give the e-mail to her."], 0]]}], "dur": 696, "script": "Listening\nTask 1\nFor items 1-10, listen to a lecture given by Assistant Professor in the Marketing unit at Harvard\nBusiness School. Decide which of the statements (1-10) are True according to the text you hear (A) and which are False (B). You will hear the text TWICE. You have 20 seconds to look through the items.\n(pause 20 seconds)\nNow we begin.\nOne of the most puzzling paradoxes in social science is that although people spend so much of their time trying to make more money, having more money doesn’t seem to make them that much happier. My colleagues Liz Dunn and Lara Aknin - both at the University of British Columbia - and I wondered if the issue was not that money couldn’t buy happiness, but that people simply weren’t spending it in the right way to make themselves happier. Liz had the great idea of exploring whether, if we encouraged people to spend money in different ways, we could uncover the domains in which money might lead to happiness. We conducted a number of studies in which we showed that money can buy happiness, when people spend that money prosocially on others (for example, giving gifts to friends, donating to charities, etc.) rather than on themselves (say, buying flat-screen televisions).\nSo, what are the psychological factors involved when it comes to individuals and the feelings they encounter when they are giving away their money? Does it matter how wealthy they are? We found that it was the relative percentage of their money that people spend on others - rather than the absolute amount - that predicted their happiness. We did a study to look at the happiness of 16 employees of a Boston-based company before and after they received bonuses of between $3,000 and $8,000. This showed that the size of the bonus that people received had no impact on their long-term happiness.\nIt was the percentage of that bonus they spent on others that increased their well-being. In another study, we showed that spending as little as $5 over the course of a day, on another person, led to demonstrable increases in happiness. In other words, people needn’t be wealthy and donate hundreds of thousands of dollars to charity to experience the benefits of prosocial spending; small changes - a few dollars reallocated from oneself to another - can make a difference. Of course, many of us equate having money with happiness, and a large body of research does show that people become happier as they move from being very poor to lower middle class, but after this point the impact of income on happiness is much weaker. Think of someone who makes $100,000 one year and $110,000 the next - do we really expect this additional income suddenly to make this person fulfilled, without a care in the world? Being informed about a raise certainly makes us happy, but the $10,000 doesn’t make our siblings or in-laws any less difficult to deal with over the course of the following year. Although people believe that having money leads to happiness, our research suggests that this is only the case if at least some of that money is given to others. We had one final question. We wanted to know whether knowing about the effect of prosocial spending might erase it, if people engaged in prosocial spending in a calculated manner in order to get happy. We conducted a research project in conjunction with the New York Times in which readers who had been told about our findings were invited to complete a brief survey in which they reported their happiness, as well as how much money they’d spent on others and on themselves so far that day. Consistent with our previous research, we found that spending more on others was associated with greater happiness among this sample of approximately 1,000 New York\nTimes readers, even though the respondents had been exposed to our previous findings.\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nNow listen to the text again.\n(text repeated)\nYou have 20 seconds to check your answers.\n(pause 20 seconds)\nTask 2\nFor items 11-15 listen to a conversation and answer the questions. Choose the correct answer (A,\nB or C) to answer questions 11-15. You will hear the text only ONCE.\nYou now have 25 seconds to study the questions.\n(pause 25 seconds)\nNow we begin.\nM = Mark, B = Bridget\nM: Hey, Bridget. How was your school reunion? Wasn’t that last weekend?\nB: Yeah, yeah .., it was good. Well, it was OK - only that I didn't recognize quite a lot of the people and...\nM: Well, it has been nearly 15 years.\nB: Yeah, I know, and boy do some people change! You know, I’d find myself talking to someone who obviously knew who I was and I hadn’t a clue who they were.\nM: And I don’t suppose you could have asked.\nB: No, how rude would that have been? Oh, but I did recognize Judith. The dreaded, jolly Judith.\nShe hasn’t changed at all.., unfortunately! I tried to avoid her but she sought me out.\nM: So?\nB: So, I’m like, 'Hello Judith, how are you?' Big mistake because then of course I get it from her - every detail of the last 15 years - you know, her ups and downs, her two failed marriages – no surprise there! - her fabulous third husband, the operation on her sinuses, the time she was made redundant, etc., etc. Yeah, go on, quiz me about Judith! I could write her biography.\nM: I bet you promised to keep in touch though.\nB: Well, you have to, don’t you?\nM: You hypocrite!\nB: Ah, but I managed to get away before giving my email address or mobile number.\nM: Oh, well done!\nThis is the end of the listening comprehension part. You have 1 minute to complete your answer."}], "hacks": [{"id": "format", "kicker": "Start here", "title": "How the olympiad listening works", "html": "\n<div class=\"cols3\">\n <div class=\"card\"><h3>Grades 7–8 · municipal<\/h3><p>Level <b>B1–B1+<\/b>. One recording, 5–10 questions, about 10–15 minutes. Usually played <b>twice<\/b>.<\/p><p class=\"muted\">Formats: True/False, multiple choice (A–C), notes with gaps, matching speakers.<\/p><\/div>\n <div class=\"card\"><h3>Grades 9–11 · municipal<\/h3><p>Level <b>B2–B2+<\/b>. Often two tasks on one recording, 7–20 questions, 10–20 minutes.<\/p><p class=\"muted\">Adds double matching, “choose all that apply”, sentence completion and “was this view expressed?”.<\/p><\/div>\n <div class=\"card hot\"><h3>Regional & final<\/h3><p>Level <b>B2+/C1<\/b>. Task 1: 10 True/False statements, played <b>twice<\/b>. Task 2: 5 multiple-choice questions, played <b>only ONCE<\/b>.<\/p><p class=\"muted\">Then an integrated listening + reading task.<\/p><\/div>\n<\/div>\n<div class=\"card\"><h3>The procedure is always the same<\/h3>\n<ol class=\"steps\"><li><b>Time to read the questions<\/b> — 20 seconds to 2 minutes. This is the most important part of the whole task.<\/li>\n<li><b>First listening<\/b> — answer what you can, skip what you missed.<\/li><li><b>Pause<\/b> — 10–20 seconds to check.<\/li>\n<li><b>Second listening<\/b> — fill the gaps, check the doubtful answers.<\/li><li><b>Transfer your answers<\/b> to the answer sheet. Only the answer sheet is marked.<\/li><\/ol><\/div>\n<p class=\"note\">Every recording in this lab is the real audio from a real olympiad, with the pauses and instructions exactly as the participants heard them.<\/p>"}, {"id": "before", "kicker": "Lifehack 1", "title": "Use the reading time like a pro", "html": "\n<div class=\"cols2\">\n<div class=\"card\"><h3>In the 30–60 seconds before the audio<\/h3><ol class=\"steps\">\n<li><b>Underline the key word<\/b> in every question: <i>who? when? why? how many?<\/i><\/li>\n<li><b>Predict the answer type<\/b> for every gap: a number? a name? a noun in the plural? an adjective?<\/li>\n<li><b>In multiple choice, find the difference<\/b> between the options — that is what you will listen for.<\/li>\n<li><b>Guess the topic<\/b> from the title — your brain will be ready for the right words.<\/li><\/ol><\/div>\n<div class=\"card\"><h3>Example · predict the gap<\/h3>\n<p>“Number of calories in one serving of rice: ___ calories” → <b>a number<\/b>, probably around 100–500.<\/p>\n<p>“Get children to make ___ ahead of time” → <b>a plural noun<\/b> (things you can make).<\/p>\n<p>“Some rooms can be rather ___ in winter” → <b>an adjective<\/b> (cold? damp? dark?).<\/p>\n<p class=\"muted\">Try it: <a class=\"tlink\" href=\"#t-l1-kryar-25\">▶ Websites about food: rice and noodles<\/a> and <a class=\"tlink\" href=\"#t-l2-komi-24\">▶ Things to do in the school holidays<\/a>.<\/p><\/div><\/div>"}, {"id": "order", "kicker": "Lifehack 2", "title": "While you listen", "html": "\n<div class=\"cols2\">\n<div class=\"card\"><h3>Rules of the game<\/h
