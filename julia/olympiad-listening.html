/* Listening Lab · radio studio: dark control desk, warm paper, amber "on air" */
:root{
  --desk:#14161f; --desk2:#1d2030; --desk-line:#2c3044; --desk-ink:#e8e6df; --desk-muted:#9aa0b4;
  --paper:#f5f2ea; --card:#fffdf8; --ink:#1a1c24; --muted:#636878; --line:#e2dccd; --soft:#ece6d8;
  --amber:#f5a524; --amber-soft:#fff1d6; --air:#ff4d4f; --ok:#1f9e6e; --ok-bg:#e1f4ea; --bad:#d64545; --bad-bg:#fbe4e2;
  --l1:#2f8f83; --l2:#4a63c9; --l3:#b54a8a;
  --head:'Space Grotesk',system-ui,sans-serif; --text:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.55 var(--text)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#b86d00}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}

/* ---------- desk (sidebar) ---------- */
.desk{background:var(--desk);color:var(--desk-ink);overflow:auto;padding:18px 12px 30px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;border-bottom:1px solid var(--desk-line);margin-bottom:10px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--air);box-shadow:0 0 0 4px rgba(255,77,79,.18);animation:air 2s infinite}
@keyframes air{50%{box-shadow:0 0 0 7px rgba(255,77,79,.05)}}
.brand b{font:700 20px/1.1 var(--head);letter-spacing:-.01em}
.brand small{display:block;font:500 11px var(--mono);color:var(--desk-muted);letter-spacing:.08em;text-transform:uppercase}
.desk h4{margin:16px 10px 6px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--desk-muted)}
.desk a.nav{display:flex;align-items:center;gap:8px;color:var(--desk-ink);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px;line-height:1.3}
.desk a.nav:hover{background:var(--desk2)}
.desk a.nav.on{background:var(--amber);color:#1a1300}
.desk a.nav .lv{width:8px;height:8px;border-radius:50%;flex:none}
.desk a.nav .sc{margin-left:auto;font:600 11px var(--mono);color:var(--desk-muted)}
.desk a.nav.on .sc{color:#1a1300}
.desk a.nav .sc.ok{color:#6fe0b0}
.desk a.nav.send{background:#2a9fd8;color:#fff;margin-top:6px;font-weight:600}
.desk a.nav.send:hover{background:#238bbd}

/* ---------- stage ---------- */
.stage{overflow:auto;position:relative}
.view{max-width:1120px;margin:0 auto;padding:30px 40px 90px}
.kicker{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#a36a00;margin-bottom:6px}
h1{font:700 38px/1.1 var(--head);letter-spacing:-.02em;margin:0 0 10px}
h2{font:700 24px/1.2 var(--head);margin:26px 0 10px}
h3{font:700 18px/1.25 var(--head);margin:0 0 8px}
.lead{font-size:18px;color:var(--muted);max-width:760px;margin:0 0 18px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.card.hot{border-color:var(--amber);background:var(--amber-soft)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cols2 .card,.cols3 .card{margin-bottom:0}
.cols2,.cols3{margin-bottom:14px}
.steps{margin:0;padding-left:22px}.steps li{margin:6px 0}
ul{margin:0;padding-left:20px}li{margin:5px 0}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--amber-soft);border:1px solid #f1d49b;border-radius:999px;padding:2px 10px;font:500 13.5px var(--mono)}
table.traps,table.mini{width:100%;border-collapse:collapse;font-size:14.5px}
table.traps{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table.traps th{text-align:left;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:10px 12px}
table.traps td,table.mini td{padding:9px 12px;border-top:1px solid var(--soft);vertical-align:top}
table.mini td{padding:6px 8px}
a.tlink{display:inline-block;font:600 12px var(--mono);background:var(--desk);color:var(--amber);text-decoration:none;border-radius:6px;padding:1px 7px;margin-left:2px;white-space:nowrap}
a.tlink:hover{background:#2c3044}

/* start */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;margin-bottom:10px}
.wave{height:150px;display:flex;align-items:center;gap:4px}
.wave i{flex:1;background:linear-gradient(var(--amber),#ff7a45);border-radius:4px;animation:wv 1.4s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.lvcard{border-radius:16px;padding:16px 18px;color:#fff;text-decoration:none;display:block}
.lvcard b{font:700 20px var(--head);display:block}.lvcard span{font-size:14px;opacity:.9}
.lvcard em{display:block;font:600 12px var(--mono);font-style:normal;margin-top:8px;opacity:.85}

/* catalogue */
.filters{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 16px;align-items:center}
.filters .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.filters .grp>span{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13.5px}
.pill.on{background:var(--desk);color:var(--amber);border-color:var(--desk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px 16px;transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,22,31,.08)}
.tcard b{font:700 17px/1.25 var(--head)}
.tcard .meta{font:500 12px var(--mono);color:var(--muted)}
.tcard .tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:500 11.5px var(--mono);background:var(--soft);border-radius:6px;padding:1px 7px}
.tag.once{background:#ffe1e1;color:#a11}
.tcard .score{margin-top:auto;font:600 13px var(--mono);color:var(--ok)}

/* task */
.thead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between}
.lvbadge{font:700 12px var(--mono);color:#fff;border-radius:8px;padding:3px 9px;white-space:nowrap}
.player{position:sticky;top:0;z-index:4;background:var(--desk);color:var(--desk-ink);border-radius:16px;padding:14px 18px;margin:14px 0 18px;box-shadow:0 10px 24px rgba(20,22,31,.18)}
.prow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--amber);color:#1a1300;font-size:22px;display:grid;place-items:center;flex:none}
.play.on{background:var(--air);color:#fff}
.pbtn{border:1px solid var(--desk-line);background:var(--desk2);color:var(--desk-ink);border-radius:8px;padding:5px 10px;font:600 13px var(--mono)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.bar{flex:1;min-width:200px;height:10px;background:var(--desk2);border-radius:5px;position:relative;cursor:pointer}
.bar.locked{cursor:not-allowed}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--amber),#ff7a45);border-radius:5px}
.time{font:600 14px var(--mono);min-width:110px;text-align:right}
.modes{display:flex;gap:2px;background:var(--desk2);border-radius:999px;padding:3px}
.modes button{border:0;background:none;color:var(--desk-muted);border-radius:999px;padding:4px 12px;font:600 12.5px var(--mono)}
.modes button.on{background:var(--amber);color:#1a1300}
.pinfo{font-size:13px;color:var(--desk-muted);margin-top:8px}
.part{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.part .instr{font-weight:600;margin:0 0 12px}
.q{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--soft)}
.q:first-of-type{border-top:0}
.q .n{font:700 14px var(--mono);color:var(--muted)}
.q.ok .n{color:var(--ok)}.q.bad .n{color:var(--bad)}
.q .fix{grid-column:2/-1;font-size:14px;color:var(--ok);font-weight:600}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.o{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;font-weight:600;font-size:14px}
.o.sel{border-color:var(--desk);background:var(--desk);color:var(--amber)}
.o.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.o.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.q.mc{grid-template-columns:34px minmax(0,1fr)}
.q.mc .opts{grid-column:2;flex-direction:column;align-items:stretch}
.q.mc .o{text-align:left;font-weight:500}
.q.mc .o b{font-family:var(--mono);margin-right:8px}
.q input.gap{border:0;border-bottom:2px solid var(--desk);background:var(--amber-soft);border-radius:6px 6px 0 0;padding:2px 8px;width:190px;font:600 15px var(--text)}
.q input.gap:focus{outline:none;background:#ffe2a8}
.q input.gap.right{background:var(--ok-bg);border-color:var(--ok)}.q input.gap.wrong{background:var(--bad-bg);border-color:var(--bad)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 16px;background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14.5px}
.legend b{font-family:var(--mono);margin-right:6px}
select.m{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 8px;font-weight:600;max-width:320px}
select.m.right{border-color:var(--ok);background:var(--ok-bg)}select.m.wrong{border-color:var(--bad);background:var(--bad-bg)}
.multi{display:flex;flex-direction:column;gap:6px}
.multi .o{text-align:left;font-weight:500}.multi .o b{font-family:var(--mono);margin-right:8px}
.multi .o.missed{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.count{font:600 13px var(--mono);color:var(--muted);margin-top:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.btn{border:0;background:var(--desk);color:var(--amber);border-radius:12px;padding:11px 18px;font:700 15px var(--head)}
.btn.amber{background:var(--amber);color:#1a1300}
.btn.tg{background:#2a9fd8;color:#fff}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.result{display:flex;gap:18px;align-items:center;background:var(--desk);color:var(--desk-ink);border-radius:16px;padding:16px 20px;margin:16px 0}
.result .big{font:700 40px var(--head);color:var(--amber)}
.hack{background:var(--amber-soft);border:1px solid #f1d49b;border-radius:14px;padding:12px 16px;margin:14px 0;font-size:15px}
.hack b.k{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#a36a00;display:block;margin-bottom:4px}
.script{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-top:14px;max-height:none}
.script p{margin:0 0 8px;line-height:1.6}
.script p.dir{font-style:italic;color:var(--muted);font-size:14px}
.script p .sp{font-weight:700;color:#8a5700}
.src{font-size:13px;color:var(--muted);margin-top:14px}
.navbtns{display:flex;justify-content:space-between;margin-top:30px;gap:10px}
.navbtns a{text-decoration:none}
.sum td,.sum th{padding:8px 10px;border-top:1px solid var(--soft);text-align:left;font-size:14.5px}
.sum{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sum th{background:var(--soft);font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:980px){.app{grid-template-columns:1fr}.desk{display:none}.cols2,.cols3,.levels,.hero{grid-template-columns:1fr}.view{padding:20px 18px 80px}}
</style></head>

<script>const DATA={"tasks": [{"id": "l1-tula-25", "level": 1, "stage": "Municipal", "region": "Tula region", "year": "2025/26", "grades": "7–8", "title": "Hot topic: the environment", "topics": ["Environment & science"], "time": "15 min", "plays": "twice", "about": "Four experts write about the biggest environmental challenges: endangered species, overfishing, deforestation and rising sea levels.", "hack": "Numbers are the classic True/False trap. “Ten times more tigers”? The text says about 100,000 then and 3,000 now — that is more than thirty times, so the statement is False. Always do the maths.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-tula-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-tula-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-tula-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-tula-25-26.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Listen to the article. Mark the sentences True or False.", "items": [["Black rhinos are far more endangered than tigers.", "F"], ["At the beginning of the last century there were ten times more tigers than now.", "F"], ["The fishing industry gets more money for fish that are in danger than for the ones that are not.", "T"], ["The fishing laws are very strict, and the fishing industry keeps to them.", "F"], ["Financial interests play a big role in deforestation.", "T"], ["Sea levels rise as sea temperatures fall.", "F"]]}], "dur": 200, "script": "Hot topic: the environment.\nThis week, four experts share with us what they think the key challenges for the world`s environment will be in the future. As always, we are curious to get our reader`s reactions. So tell us what you think.\n1.     Endangered species\nThe black rhino in Africa is in serious danger of becoming extinct. This is because some people think rhino horn has special powers. They pay enormous sums of money for it. So people kill rhinos and sell their horns. Tigers are in serious danger, too. At the beginning of the 20th century, there were about 100,000 tigers.\nNow there are only about 3,000 left. In a few years' time, there might not be any tigers left at all! These are just two examples. Many other animals are endangered, too. Some of them may be gone forever very soon. Joe Wagner, Cape Town\n2.     Overfishing\nIt's not looking good for the fish population. Certain species are in danger, and there aren't many of them in the sea where fishermen usually go. Fishing ships are therefore going further and further out into the oceans. They try to get the rare species because they can get better prices for them. If things go on like this, 40 years from now there won't be any fish left in the seas. It's not too late yet, but it may be soon.\nThe oceans need much stricter laws and a fishing industry that keeps to them. Rick\nCavendish, San Diego\n3.     Deforestation\nAbout 30% of the world's land is still covered with forests. But every year, we lose areas as big as the country of Panama. Big companies earn millions from producing wood, paper and cardboard from the trees. Forests are also cut down to make more space for growing crops such as soya or creating huge cattle farms. The consequences of deforestation are dramatic and partly responsible for climate change.\nAbout 70% of the world's land animals and plants live in forests. If we lose the forests, we will lose millions of species. Alejandro Silvas, Quito\n4.    Rising levels of sea water\nOver the last 20 years or so, sea water temperatures have been going up. As a consequence, the ice caps around the poles have started to melt, and sea levels have started to rise. If this doesn't stop, the water will rise further and may flood many islands. Then some countries like the Maldives won't be there any more. There is also a danger that some huge low-lying coastal cities might end up below the sea. It's hard to imagine what the consequences of such changes might be. Gajkaran Sanu, New\nDelhi."}, {"id": "l1-kem-25", "level": 1, "stage": "Municipal", "region": "Kemerovo region", "year": "2025/26", "grades": "7–8", "title": "Brian, the classic first child", "topics": ["People & relationships"], "time": "10 min", "plays": "twice", "about": "Two mothers talk over dessert about their eldest sons and why first-born children are often self-critical.", "hack": "In a conversation, check WHO says what. Statement 4 is about what Brian’s mother thinks: she says they did NOT push him — “we were just interested”. The other mother only mentions an article.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-kem-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-kem-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-kem-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-kem-25-26.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Listen to the text twice and choose True or False.", "items": [["Brian is always dissatisfied with himself.", "T"], ["Brian obeys rules.", "T"], ["Brian does most things well.", "T"], ["Brian’s mother thinks her husband pushed Brian to be successful.", "F"], ["Brian never liked being with adults when he was growing up.", "F"]]}], "dur": 347, "script": "F1: Would you like some more dessert?\nF2: No, thanks, Linda. Everything was delicious, but I couldn’t eat another bite! Thanks so much.\nF1: So, Jeanne, how are your kids doing?\nF2: Well, that depends on which one . . .\nF1: Well, how about the oldest? That’s Brian, right? How old is he now?\nF2: He’s fifteen. Brian’s fine. Brian’s always fine. He’s doing great at school. I’m sure he’ll get into a great university in a couple of years. He’s a great kid—works hard, he plays by the rules, and he’s successful at almost everything he does. The only thing that sometimes worries me about Brian is that he can be a little too self-critical.\nF1: Self-critical? How so?\nF2: Well, Brian can be pretty hard on himself: no matter how well he does at something, he’s not satisfied. He always feels he could do better.\nF1: That’s so interesting. Our first, Eric, is like that, too.\nF2: Really?\nF1: You know, I once read this article in one of those popular psychology magazines. It said that first children are often self-critical because parents push them to succeed more than they do with their other children. I don’t mean to suggest you did that, and I don’t think we did that with\nEric, but it’s interesting because it’s so common. I just wonder why.\nF2: Well, I do think there’s some truth to that in our case. Harvey and I were involved in everything Brian did—music lessons, karate lessons, Chinese class on Saturday—we drove him to all his classes. We picked him up after they were over. We always asked him a lot of questions about how he was doing. He probably thought our message to him was that he had to be good at everything. But we were just interested. We didn’t actually push him to be good at everything, but he may have thought we expected a lot of him. Kids internalize those messages.\nF1: I imagine that’s pretty typical. It’s no one’s fault.\nF2: And one more thing—if you buy into that—you know—“nurture theory.”\nF1: Yeah?\nF2: Brian’s sister Annie wasn’t born ’til Brian was eight. He really had more contact with us and other adults than he did with someone closer to his age. I’m sure all that contact with us probably had a huge impact. And, interestingly, Brian has always been comfortable with adults.\nF1: From what you’re saying, it sounds like Brian is the classic first child. They say that first children often feel more comfortable with people older than themselves. They seem to have a short childhood and grow up fast."}, {"id": "l1-kalin-25", "level": 1, "stage": "Municipal", "region": "Kaliningrad region", "year": "2025/26", "grades": "7–8", "title": "Can you get green stars?", "topics": ["Environment & science"], "time": "15 min", "plays": "twice", "about": "A radio science show: why stars have colours, why our Sun looks white, and what a star’s colour tells us about its age.", "hack": "Science talks love “unlike” and “even though”. “Even though our Sun gives off most of its light green… it gets mixed out as white” — the second half is what we SEE. Listen past the first half of such sentences.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-kalin-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-kalin-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-kalin-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-kalin-25-26.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Do the statements agree with the recording? True if it agrees, False if it contradicts.", "items": [["To the naked eye, most stars appear to be white.", "T"], ["The colour of a star is related to its temperature.", "T"], ["In physics, the colour blue indicates a higher temperature than red.", "T"], ["A star emits light in only one specific colour.", "F"], ["Our Sun gives off most of its light in the green part of the spectrum.", "T"], ["The human eye perceives our Sun as white because it mixes different colours of light.", "T"], ["A star’s temperature provides information about its mass and age.", "T"], ["A star’s life is described as a struggle against the force of gravity.", "T"], ["Massive stars have longer life than smaller stars.", "F"], ["A cool, dim red star is likely to be a very young star.", "F"]]}], "dur": 565, "script": "That’s the beginning of the Listening task. I am going to give you the instructions for this task.\nYou will hear the recording twice. Remember, while you are listening, write your answers on the answer sheet. You will have 5 minutes at the end of the task to copy your answers onto the separate answer sheet. You must not speak during the task. Now open your question paper and look at the Listening task. You will hear the talk about space and stars.\nDo the following statements agree with the information given in the recording?\nIn boxes 1 to 10 on your answer sheet write A (TRUE) if the statement agrees with the information; B (FALSE) if the statement contradicts the information.\nYou have 30 seconds to read the questions. Now we begin the listening task.\nChris - Now, Carolin, we’ve got this question which is probably one for you. Can you get green stars?\nCarolin - Well, this is a very interesting question because some people are always amazed to know that stars have colours. Because if you stand out in your back garden and you look with your naked eye they all look white, except one or two like Beetlejuice maybe look vaguely orange. Now if you look through a telescope you begin to see a few more colours and, obviously, if you have pictures taken with a digital camera those colours begin to pop out. You see there are blue stars, and yellow stars, and red stars, and white stars but yet, curiously, there aren’t any green stars, and the colour of stars is related to their temperatures. So in the same way that you heat a lump of metal up it’s starts glowing this sort of dull red, it goes through to orange, and at it’s hottest a bright almost like blue/white. The same with stars, they are glowing because they are hot - it’s thermal radiation. And in physics, unlike your plumbing, red is cool and blue is hot.\nBut if you could analyse the spectrum, in other words you look at the distribution of light given off by stars, they’re not just giving off that one colour, they’re giving off a whole range of colours. It’s something called the black body radiation. And if you could map it out, it would look like a spread of all colours but with a definite peak. So with a cool star that peak is in the red, so the red light dominates. And as the star heats up that peak shifts through to the blue. So if you get a star at 3,000 degrees it’s very cool and red, at 30,000 degrees it’s stonkingly blue.\nNow what is curious is if you get a star like our Sun (about 6,000 degrees) that peak is bang in the middle of the visible spectrum. Now the difference is you’ve got that peak, that’s where most of the light comes out but if you’re right in the middle of the spectrum you’ve got as much yellow light and as much blue light to either side. So your eye kind of mixes it together and sees white. But if that peak is at one end, so either at the red or the blue, you’re just seeing that peak and one side of the colour so you don’t get so much mixing. So even though our Sun predominantly gives off most of it’s light green, we’ve got all this yellow and blue next to it and it get’s mixed out as white.\nChris - Dani?\nDani - I was just going to ask does the colour give any indication, and does the temperature give any indication of the life span? Are the really hot ones about to explode or is it not as simple as that?\nCarolin - You can't... Well, it is very, very clever because the temperature tells you how hot the star is, which in turn tells you how massive the star is, and also how old it is. And you think we learn all this just from taking spectral images of stars and we can work out all these things. It’s kind of perverse because if you have a really hot star, it has to burn energy at such a rate because it’s a really massive star. So a stars life is just basically a battle against gravity. So if you have a really massive star, it’s going to burn that much hotter, it’s going to go through it’s fuel that much quicker to, you know, withstand gravity. However, even though it’s a bigger star it goes through its fuel faster and so it has a shorter life. So if you see a bright blue star, it’s a really young star and it’s a really massive star. And if you see a very cool dim red star, that’s actually going to have a lifespan of billions of years unlike the hot blue star which is perhaps millions of years, so you can learn an awful lot from the colour.\nChris – Thank you very much.\nNow you will hear the recording one more time.\n--The recording is repeated.—\nThat is the end of the Listening task.\nNow you have 5 minutes to copy your answers onto the separate answer sheet."}, {"id": "l1-xakas-25", "level": 1, "stage": "Municipal", "region": "Republic of Khakassia", "year": "2025/26", "grades": "7–8", "title": "Mandy: from DJ to singer", "topics": ["Music, arts & books"], "time": "10 min", "plays": "twice", "about": "A radio interview with a young singer about her first job, her lucky break, her new song and her plans.", "hack": "All three options are often mentioned — only one answers the question. Mandy talks about nursing, looking after elderly people AND buying equipment; the question is WHEN she started as a DJ: “As soon as I had enough, I bought what I needed.”", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-xakas-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-xakas-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-xakas-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-xakas-25-26.pdf"]}, "parts": [{"t": "mcq", "instr": "Choose the correct answer (A, B or C).", "items": [["Mandy started working as a DJ", ["once she could afford the equipment.", "after she lost her job as a nurse.", "when she first left school."], 0], ["What does Mandy say about her singing career?", ["It started by chance.", "It took years of practice.", "It began with a song that she wrote."], 0], ["What is Mandy’s new song about?", ["making new friends", "changing your mind", "finding life difficult"], 2], ["How does Mandy feel about her new CD?", ["sure that people will like it", "pleased with what she’s achieved", "sorry that it wasn’t ready on time"], 1], ["Mandy’s favourite songs are those which", ["are easy to dance to.", "other women have written.", "have interesting words."], 2], ["In the future, Mandy plans to", ["learn another instrument.", "run her own business.", "work in television."], 1]]}], "dur": 351, "script": "For each question, choose the correct answer. Look at questions 1–6 now. You have 45 seconds to look at the task. [pause 20 seconds]\nYou will hear a radio interview with a young singer called Mandy.\nYou will hear the text twice.\nInt: Hi Mandy. You started off as a successful disc jockey and now you’re a singer in a great new band! When did you get your first job as a DJ?\nMandy: Well, when I finished school, I trained as a nurse for a year, but I wasn’t very good at that. I’d always loved music, and I wanted to save money to buy equipment, so I started looking after elderly people. As soon as I had enough, I bought what I needed. I got my first job as a disc jockey almost immediately.\nInt: But then you started singing instead. How did that happen?\nMandy: Well, I’d been a disc jockey for about four years, then last year, I read about a DJ competition in Ireland and I entered. I did some live singing on stage that night and one of the judges asked me if I’d be interested in singing professionally. I was very lucky, really.\nInt: So now you’re in a band called ‘Dish’. Tell us about your new record, the one that’s in the shops now ...\nMandy: Yes. It’s called ‘Up and Down’. It’s about a girl who is never really happy with her life.\nShe’s always up and down, wanting too much and never being satisfied. I’m not that kind of person fortunately, nor are my friends! It does have a nice ending.\nInt: And you’re working on a new CD?\nMandy: Yes, but we haven’t finished recording that yet. There are still two more songs to do but\nI’m very proud of it. It’s traditional rock but we’ve included some electronic music too to make it really unusual. I just hope the public will buy it! We think it’s great!\nInt: And what kind of music do you listen to at home?\nMandy: That’s difficult. The music I like best has words that mean something to me, I suppose.\nI love dance music too, but you can’t listen to it all the time and I generally prefer female artists to male, I think too. But that depends on the singer.\nInt: And your future plans?\nMandy: Oh! I’ve got so much work to do at the moment – television performances and concerts, it’s hard to plan. But I’d really like to own a nightclub one day ... somewhere great to dance, so that’s my next project. One day, perhaps I’ll try to learn to play the guitar – that would be nice – but I’m too busy to think about it at the moment. I can write and sing, that’s what I do best.\nInt: Well, lots of luck with your new CD and thanks for coming.\nMandy: You’re welcome!\nNow you have 20 seconds to check your answers.\nNow listen again.\n[The text is repeated]"}, {"id": "l1-kryar-25", "level": 1, "stage": "Municipal", "region": "Krasnoyarsk region", "year": "2025/26", "grades": "7–8", "title": "Websites about food: rice and noodles", "topics": ["Travel, food & places"], "time": "15 min", "plays": "twice", "about": "A food programme presents two websites: the history of rice and the Yokohama Noodle Museum in Japan.", "hack": "Notes tasks are full of numbers: dates, amounts, times. Before listening, decide for each gap: a year? a big number? a day? The recording gives several numbers close together (5,000 years, 700 years, 1726) — pick the one the note asks for.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-kryar-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-kryar-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-kryar-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-kryar-25-26.pdf"]}, "parts": [{"t": "gap", "instr": "Complete the notes. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "items": [["The History of Rice · Rice first grown: ___ years ago", ["5,000", "5000", "5 000", "five thousand"]], ["Amount of rice produced every year: over ___ tonnes", ["550 million", "550,000,000", "550000000"]], ["Number of calories in one serving of rice: ___ calories", ["103", "one hundred and three"]], ["Three things you can make from rice: drinks, glue and ___", ["clothes"]], ["Yokohama Noodle Museum · Date museum opened: ___", ["March 1994"]], ["Day museum closed: ___", ["Tuesday", "Tuesdays"]], ["Souvenir shop: on ___ floor", ["first", "the first", "1st", "the 1st"]], ["old ___ shown on TV", ["ads", "adverts", "advertisements"]], ["Number of noodle shops in the theme park: ___", ["8", "eight"]], ["Journey time by train from Tokyo: ___", ["45 minutes", "forty-five minutes", "45 mins", "45 min"]]]}], "dur": 567, "script": "LISTENING. PART 1\nYou are going to listen to someone talking about two websites. Listen to the recording and complete the notes. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer. You will hear the recording twice.\nFirst, you have some time to look at Questions 1-10.\nPause\nNow listen to the recording and answer the questions.\nToday on the food programme, I’m going to be telling you about two interesting websites which give you information about two very important foods – rice and noodles. First of all, let’s look at the Pagewise website. This site will tell you all about the history of rice, about the rice harvest, the different types of rice, how to cook it and what else you can do with it.\nFor example, did you know that rice belongs to the grass family and was first grown about\n5,000 years ago in India? It was introduced into Europe about 700 years ago and arrived in the USA in 1726. Nowadays, more than 550 million tonnes is produced around the world each year, 92% of that being produced in Asia.\nRice is the staple food for the majority of the world’s population – that is, far more meals are based on rice than on anything else. It is naturally fat- and sodium-free, and one serving has only 103 calories, so it’s very good for you. Interestingly, although rice isn’t as rich in vita- min C as the potato, for example, it is less fattening. Now, I always find rice difficult to cook, but the best way, apparently, is to keep the lid on the pan when you boil it – this will keep the steam in and produce perfect rice every time. One interesting thing to note is that European and American rice, which is grown in dry fields, absorbs a lot more water than Asian rice, which is grown in flooded fields. Now, other things you can do with rice besides eat it: you can make drinks from it, glue to stick paper together with and also you can make clothes from it!\nMoving on now to the Japanese Food Page. There you can find out about the history of the noodle at the Yokohama Noodle Museum site. Noodles can be made from rice or wheat and are the fast food of Japan. There are more noodle shops in Japan than any other kind of restaurant. According to this website, noodles make one of the quickest and least expensive meals – much quicker than a rice dish, for example.\nThe museum, which opened in March 1994, sounds like it’s well worth a visit if you go to\nJapan. It’s more than just an ordinary museum – it’s part theme park and part restaurant. And it stays open later than most museums – from 11.00 a.m. to 11.00 p.m., with the last admis- sion being 10.00 p.m. The museum is open every day except for Tuesday, with Sunday being the busiest day and Thursday being the least busy.\nThe first floor of the museum has a souvenir shop, and you can buy noodle-related objects online as well. It sells bowls for eating noodles out of, equipment for making noodles – even curtains with pictures of noodles on them! There are empty noodle packets on the walls for decoration, and overhead TVs show adverts for noodles from the past 25 years. You can see a display showing how noodles are made and also one giving the history of the noodle.\nOn two underground levels, there is a historical theme park with shops, houses and restau- rants from the year 1958. There are also eight different noodle shops serving ten different types of noodle. If you want to go, you can get there by train. The museum is only a three- minute walk from JR Shin-Yokohama railway station. Shin-Yokohama is about 45 minutes from Tokyo.\nOn the programme next week, we’ll be ...\nNow you will hear the recording again.\n[Text repeated]\nThis is the end of the task."}, {"id": "l1-vladimir-25", "level": 1, "stage": "Municipal", "region": "Vladimir region", "year": "2025/26", "grades": "7–8", "title": "Singing for beginners", "topics": ["Music, arts & books"], "time": "10 min", "plays": "twice", "about": "A woman on the radio describes a short singing course she has just attended.", "hack": "Read the instructions: “write numbers in words”. So it is “three”, “ten”, “twenty-fourth” — not 3, 10, 24th. In a real paper, 24th would score 0 here.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-vladimir-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-vladimir-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-vladimir-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-vladimir-25-26.pdf"]}, "parts": [{"t": "gap", "instr": "Fill in the fact file. Use ONE word in each space. Write numbers in words.", "items": [["The course was at ___ College.", ["Brownstoke"]], ["Lena Phipps, a very good former ___ singer, is the tutor.", ["opera"]], ["The courses last ___ days.", ["three"]], ["The maximum number of students per course is ___.", ["ten"]], ["All classes start with exercises that help students to ___.", ["relax"]], ["The tutor teaches students to sing ___, modern and pop songs.", ["classical", "classic"]], ["Accommodation is in single or ___ rooms.", ["twin"]], ["Cooked breakfast, lunch and dinner are included. ___ are especially recommended.", ["salads"]], ["Courses begin on the ___ Tuesday of the month.", ["last"]], ["The next course starts on the ___ of September.", ["twenty-fourth", "twenty fourth"]]]}], "dur": 269, "script": "2025/2026\nPart 1. Listening\nYou will hear a woman talking on the radio about a singing course she attended. For each question, fill in the missing information in the numbered space.\nNow we are ready to start. Listen carefully. You will hear the recording twice.\nI’ve just come back from a short music course called Singing for Beginners. It was at\nBrownstoke College, which is just to the north of London.\nA woman called Lena Phipps runs these three-day courses for people with no previous experience of singing. Lena used to be an opera singer, but no longer appears on the stage.\nNowadays she occasionally sings in jazz clubs, but spends most of her time teaching. She was excellent!\nThere were only nine of us on the course I attended, five men and four women, and Lena never takes more than ten students on a course. This means that everyone has lots of attention and plenty of opportunity to sing.\nWe were all very nervous at the beginning, but every class begins with some exercises to help students to relax. These are followed by warm-up exercises to improve the quality of the voice.\nDuring the three days, students learn around twenty songs in a variety of different styles, depending on the interests of the class members. There are classical and modern sings, including pop songs. By the last day, everyone was confident enough to perform their favourite song on their own!\nI would really recommend this course. Brownstoke College is an old building surrounded by a beautiful garden. Accommodation is very comfortable – the single and twin rooms are clean and warm, and three meals a day are included in the cost, a cooked breakfast, lunch and an evening meal. The lunch is very good, and the salads can be recommended.\nCourses begin on the last Tuesday of the month, so the next one begins on the 24 th of\nSeptember and continues until Thursday the 26th of September. I would advise you to reserve a place early, because it’s certain to be very popular!\nPause 20 sec.\nText repeated."}, {"id": "l1-nn-25", "level": 1, "stage": "Municipal", "region": "Nizhny Novgorod region", "year": "2025/26", "grades": "7–8", "title": "Travel experiences", "topics": ["Travel, food & places"], "time": "10 min", "plays": "twice", "about": "Three people talk about trips to Australia, Rome and Venice — one fantastic, one dreadful, one surprisingly cheap.", "hack": "Not given is not the same as False. Speaker 2 says the hotel staff “looked after me” — but nobody says they called the emergency. If the recording is silent about it, the answer is Not given.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-nn-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-nn-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-nn-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-nn-25-26.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"], ["N", "Not given"]], "instr": "Task 1. True, False or Not given?", "items": [["Speaker 1 says that his trip was short but packed with a lot of activities.", "T"], ["Speaker 2 states that there was nothing to watch and take pictures of.", "F"], ["Speaker 2 recollects that the trip was a disaster right from the start.", "F"], ["Speaker 2 says that the hotel staff called the emergency.", "N"], ["Speaker 3 thinks that she might want to do the same in the future.", "T"]]}, {"t": "gap", "instr": "Task 2. Complete the information. Use ONE word in each space.", "items": [["Speaker 1 says that hostels were ok but ___.", ["pricey", "pricy"]], ["Speaker 1 says that buses were cheap, ___, and safe.", ["reliable"]], ["Speaker 2 had a ___ time when she went to Italy last year.", ["dreadful"]], ["Speaker 2 says that on the first day she tried out the local ___.", ["cuisine"]], ["Speaker 3 thinks that her holiday wasn’t expensive but quite ___.", ["reasonable"]]]}], "dur": 619, "script": "You will hear three speakers talking about travel experiences. Complete the information. Use one word in each space.\nSpeaker 1: Last year I went to Australia. I only had three weeks, so I crammed a lot into a short time, but it was fantastic. I mostly stayed in hostels. They were ok but pricey. To save money I travelled from place to place by bus. They were cheap, reliable, and safe. The people were welcoming and kind. The sights were incredible, I took hundreds of photos. The weather was lovely, it wasn’t too hot but sunny enough to wear shorts and T-shirts.\nSpeaker 2: I had a dreadful time when I went to Italy last year. It started off well. I arrived in Rome and went straight to my hotel, and it was lovely. On the first day, I walked around taking in the sights and trying out the local cuisine. I ate so much food. I couldn’t help it; it tasted so good. But then the next morning I felt terrible.\nI couldn’t stop throwing up and slept day and night. It lasted for the whole trip. I didn’t get to see any more sights or do any activities. I only saw the inside of my hotel room. Fortunately, the hotel staff were wonderful and looked after me.\nSpeaker 3: Oh, it was a wonderful holiday. I loved every moment. Venice is just a paradise. We did everything – we went on a gondola, we saw all the museums, and we had some fantastic meals. And you know, everyone says Venice is expensive, but I didn’t think it was – it wasn’t an expensive holiday at all. I thought it was quite reasonable. We all got on very well. I think I’m going to suggest to Isabelle and Laura that we go on holiday together again next year.\nPause 15 sec\nText repeated.\nPause 2 min.\nThis is the end of the listening task."}, {"id": "l1-komi-25", "level": 1, "stage": "Municipal", "region": "Komi Republic", "year": "2025/26", "grades": "7–8", "title": "Teenagers who design clothes", "topics": ["Music, arts & books"], "time": "10 min", "plays": "twice", "about": "An interview with Ben, who designs T-shirts, and Sophie, who makes dresses in an after-school class.", "hack": "The first idea you hear is often a trap. Ben mentions his grandma’s present first, then the Internet — but what made him START was the rock star on TV: “So that made me get my T-shirts and pens out again.”", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/audio-engl-7-8-pism-mun-komi-25-26.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/tasks-engl-7-8-pism-mun-komi-25-26.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/ans-engl-7-8-pism-mun-komi-25-26.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2025/script-engl-7-8-pism-mun-komi-25-26.pdf"]}, "parts": [{"t": "mcq", "instr": "Choose the answer (A, B or C) which fits best.", "items": [["What made Ben decide to start designing his own T-shirts?", ["a present he received", "a TV programme", "something he saw on the Internet"], 1], ["Ben put his designs onto his T-shirts by", ["using an iron.", "sewing them.", "drawing them on."], 0], ["When Ben’s friends saw his T-shirts, they", ["asked Ben to design one for them.", "wanted to make one of their own.", "put a photo of one in the school magazine."], 1], ["Who helps out in Sophie’s after-school class?", ["some older students", "other teachers from the school", "parents of the people attending"], 2], ["Sophie thinks the class is popular with students because", ["they end up with really unusual clothes.", "they save money by making their own clothes.", "they can show other students what they’ve done."], 0], ["What does Sophie want to improve?", ["her sewing skills for making her designs", "her choices of suitable colours and materials", "her drawings for her designs"], 2]]}], "dur": 207, "script": "1. you will hear an interview with two young teenagers, Ben Wright and\nSophie Carter, who design and make their own clothes. For each question, choose the correct answer (A, B, or C) which fits best. You will hear the text twice.\n Before listening, you will be given 2 minutes to look through the task.\n Then you will listen to the information for the first time.\n After that you will be given 2 minutes to check the task.\n Then you will listen to the information for the second time.\n After that you’ll be given 2 minutes to recheck the task.\n2. Study the tasks. You have 2 minutes.\nPause 2 minutes.\n3. Listen to the text.\nYou will hear an interview with two young teenagers, Ben Wright and Sophie Carter, who design and make their own clothes. For each question, choose the correct answer A, B or C.\nInterviewer: Today I'm with two teenagers, Ben Wright and Sophie Carter, who both design and make clothes. Ben, you design your own T-shirts. What gave you the idea?\nBen: Well, my grandma knew I loved art, so for my birthday she gave me some plain T-shirts, with special pens for drawing designs on them. But I didn't really use them until one day when I was watching my favourite rock star on TV. He was playing at a concert in a T-shirt he'd designed himself. So that made me get my T-shirts and pens out again. I looked on the Internet for ideas, and started experimenting!\nInterviewer: So how did you put your designs onto your T-shirt?\nBen: Well, I tried drawing them straight onto the T-shirt, but that didn't work very well as my designs were really complicated. Then I found out you can buy special paper that'll transfer your designs onto T-shirts if you iron over the top of it. It was great. as I was worried I might have to sew them on, and I'm not very good at that!\nInterviewer: And what did your school friends think of your T-shirts?\nBen: Well, I didn't think they'd like them, but in fact they immediately started getting some designs together and asking me how to produce the T-shirts. They did some really good ones, and we took a photo of us all wearing them. There was even an article about us in the school magazine!\nInterviewer: Great! Now turning to you, Sophie. You've made dresses for school parties, haven't you?\nSophie: That's right. Our school started an after-school class with a teacher who designs and makes clothes professionally. The classes are really popular - there are boys and girls of all ages in the school, including older students who'll soon be leaving. Some class members' parents come in too, as the class has got quite big for one teacher to handle.\nInterviewer: So why do why do so many people come to the class?\nSophie: Well, making your own clothes is cheaper than buying them, especially dresses, but the main thing is that no one else will be wearing the same as you at a school party! I like letting other students see what I've achieved too, though! Some students actually think I've bought the dresses I've made!\nInterviewer: So what will you do next, Sophie?\nSophie: Well, I've still got lots to learn about sewing, but I really enjoy designing too. I'd like to get better at doing the drawings I need for that. I'm pleased with the colours and materials I've chosen for my dresses, though-they've worked well.\nInterviewer: Well, good luck, Sophie and Ben!\n4. Do the task. You have 2 minutes.\nPause 2 minutes.\n5. Listen to the information for the second time.\nSecond listening.\n6. You have 2 minutes to recheck the task.\nPause 2 minute.\n7. You have 1 minute left to fulfill the tasks. Transfer all your answers to your answer sheet.\nPause 1 minute.\n8. Time is over. Put aside your pens."}, {"id": "l1-arh-24", "level": 1, "stage": "Municipal", "region": "Arkhangelsk region", "year": "2024/25", "grades": "7–8", "title": "What I love about London", "topics": ["Travel, food & places"], "time": "10 min", "plays": "twice", "about": "Five people explain why they like London so much.", "hack": "Matching speakers is about the MAIN idea, in other words. Speaker 1 never says “cosmopolitan” — she says “it’s like the whole world is here”. Speaker 2 mentions Regent’s Park, but his point is “never a dull moment”. One option is left over.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-7-8-pism-mun-arh-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-7-8-pism-mun-arh-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-7-8-pism-mun-arh-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-7-8-pism-mun-arh-24-25.pdf"]}, "parts": [{"t": "match", "instr": "Choose from A–F the reason each speaker gives for liking the city. There is one extra letter.", "opts": [["A", "There’s always something to do."], ["B", "I like its architecture."], ["C", "It’s very cosmopolitan."], ["D", "It reminds me of home."], ["E", "I like its parks."], ["F", "I like its general atmosphere."]], "items": [["Speaker 1", "C"], ["Speaker 2", "A"], ["Speaker 3", "F"], ["Speaker 4", "E"], ["Speaker 5", "B"]]}], "dur": 503, "script": "You will hear five different people talking about what they like about London. For questions 1-5 choose from the A-F the reason each speaker gives for why they like the city so much. There is one extra letter which you don’t need to use. You will hear the texts twice. You have 45 seconds to look at the task.\nSpeaker 1\nI remember the first time I went there it was the thing that stuck me most, and it still does to this day, and I’ve lived here nearly 10 years now. You can just walk down the street and there’s an\nIndian restaurant, next to a Lebanese restaurant, next to a Turkish restaurant… you name it. It’s like the whole world is here. I was in the butcher’s the other day and the guy behind the counter was speaking to me in English, to an elderly woman in Arabic and to some young Senegalese guys in French. Now , I’m from a small village up north and most people there have lived there for generations, I mean, I mean my teacher at school also taught my dad, so it’s a real contrast and something I think gives the place its verve.\nSpeaker 2\nNever a dull moment, that’s all I can say. If you have the time and the money, you’ll never be bored. On Monday I can go to the South Bank and see an exhibition. On Tuesday I can pop into the British Museum, Wednesday, maybe catch an opera. Thursday go out for a meal. Friday go on and see a film in one of the massive cinemas in Leicester Square. Saturday, go to a football match and then on Saturday just have a walk in Regent’s Park – it’s beautiful there, so many trees and flowers, so relaxing.\nSpeaker 3\nThere’s just this buzz about the place. Walking down the street you see a famous TV series pops in to buy his copy of the Guardian. There are always new restaurants or clubs opening. All the different parts of the city have their own special feeling. North London with its Irish community, and the West Indian parade in Notting Hill. I know some people get annoyed with how people rush about and the general mayhem on the tube, but for me it’s what London is all about, it’s electric.\nSpeaker 4\nWell, I have heard there are more green spaces in London per capita than anywhere else. I’m not sure if that’s true, but it’s certainly an improvement on the city I grew up in. In our local park you could walk every inch of it in about half an hour. In London though, you’re spoilt for choice.\nI’m not sure which park I would say was my favourite, it would depend on my mood. I do have a soft spot for Primrose Hil, you know the one you often see in films, that has a view all over\nLondon.\nSpeaker 5\nI remember people saying it was a monstrosity. I can’t believe they really think that, it just matches the skyline so beautifully. They call it Gherkin and I can say how it might be a bit modern for some tastes, but really, to call it ugly is insane. But I read that people complained about the Eiffel Tower when that was first built, and can anybody think of Paris now without it?\nI’m sure people will come to think of it in the same way as they do Saint Paul’s cathedral or the\nTower of London – as a beautiful building that could only be in London"}, {"id": "l1-kostroma-24", "level": 1, "stage": "Municipal", "region": "Kostroma region", "year": "2024/25", "grades": "7–8", "title": "Do rewards really motivate us?", "topics": ["School, work & careers"], "time": "10 min", "plays": "twice", "about": "A talk about experiments by Sam Glucksberg and Dan Ariely which show that rewards can make people perform worse.", "hack": "“You’d think…, right? Well, no.” Speakers often say the expected idea first and then reject it. In Glucksberg’s experiment the group with a reward was expected to be faster — but they took three and a half minutes LONGER.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-7-8-pism-mun-kostroma-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-7-8-pism-mun-kostroma-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-7-8-pism-mun-kostroma-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-7-8-pism-mun-kostroma-24-25.pdf"]}, "parts": [{"t": "judge", "opts": [["T", "True"], ["F", "False"]], "instr": "Task 1. Are the sentences true or false?", "items": [["We try to motivate workers in the same way that we try to motivate our children.", "T"], ["In the Glucksberg experiment, the people who were offered a reward finished faster than people who were not offered one.", "F"], ["The people who were offered smaller rewards in Ariely’s experiment performed better than those offered bigger rewards.", "T"], ["In Ariely’s experiment, people were more creative when they were concentrating on achieving a goal.", "F"], ["In the future, jobs will require workers to be more creative.", "T"], ["People always work better when they start the day later and work into the night.", "F"]]}, {"t": "match", "instr": "Task 2. Match the sentence halves.", "opts": [["A", "the experiment is repeated."], ["B", "they are not given an incentive."], ["C", "they can make choices about their work."], ["D", "they are doing a simple task."], ["E", "they are doing the jobs of the future."], ["F", "they are offered a bigger reward."]], "items": [["Glucksberg’s experiment shows that people solve a problem faster when", "B"], ["Ariely’s experiment shows that people are less creative when", "F"], ["The same results as Glucksberg’s experiment have been found when", "A"], ["An incentive works for people when", "D"], ["Incentives will no longer work for motivating people at work when", "E"], ["The example of the big tech companies shows that people work better when", "C"]]}], "dur": 499, "script": "So, we think we know how to motivate people, right? Offer them a reward. Do this and you’ll get this. Do this faster, earn more money. Do this better than everyone else, here’s a promotion. We offer incentives when we want people to do things. We do it at work, at school, even at home with our kids. Tidy your room and you can watch TV.\nBut when social psychologists test whether incentives work, they get surprising results.\nSam Glucksberg, from Princeton University, America, set people a problem to solve and told them he was going to time them to see how long they took. Then he put them in two groups. He offered one group a reward for finishing fast. Five dollars for anyone finishing in the top 25 per cent and 20 dollars for the person who finished the fastest of all. To the other group he offered no incentive, but he told them he was going to use their times to calculate an average time.\nThe first group, the ones with the reward, solved the problem faster, you’d think, right?\nWell, no, they actually took three and a half minutes longer than the group who just thought they were being timed. Incentive didn’t work. In fact, it made them slower. This experiment has been repeated, with the same results, many times. But in business we still offer bonuses, promotions and rewards to staff.\nThat’s fine if we want them to do something simple, like chop wood. We’ll pay you more if you chop the wood faster. An incentive works then. But if we want someone to do something complex, something creative, something where they have to think, rewards don’t work. They might even have the opposite result, and make people perform worse.\nAnother study, by Dan Ariely, showed that the bigger the reward, the worse the subjects performed on a complex task. The reward made them focus so hard on the result that they couldn’t think creatively any more.\nAnd this all matters because more and more simple jobs will become automated. We’ll be left with creative, problem-solving jobs that computers will never do. And we need to find a way to motivate people to do those jobs when we’ve proved the traditional incentives don’t work.\nSo what does work? Giving your workers freedom; freedom to work on the things they want to work on, freedom to choose when, where and how they work. Want to work from home three days a week, get up late and work into the night instead? Fine. Just do the job well. And evidence shows people who choose the way they work get results. Companies that give employees time during the week to work on things that interest them and are not part of their regular job achieve amazing things. Some of the big tech companies are good examples of this, with ping-pong tables and areas to relax in ..."}, {"id": "l2-tula-24", "level": 2, "stage": "Municipal", "region": "Tula region", "year": "2024/25", "grades": "9–11", "title": "How to study", "topics": ["School, work & careers"], "time": "20 min", "plays": "twice", "about": "A talk full of practical tips: timetables, the right place to study, breaks, notes and mind maps.", "hack": "Four options (a–d) make it tempting to guess. Cross out options that are never mentioned first (a diet, visiting relatives) — then choose between the two that are really in the talk.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-9-11-pism-mun-tula-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-9-11-pism-mun-tula-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-9-11-pism-mun-tula-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-9-11-pism-mun-tula-24-25.pdf"]}, "parts": [{"t": "mcq", "instr": "Choose the best option (a, b, c or d).", "items": [["The best way to study is …", ["to sleep more.", "to keep on a diet.", "to go in for sports.", "to have some kind of a plan."], 3], ["It is necessary to take into consideration …", ["your parents’ attitude towards your health.", "to think about your environment.", "to learn by heart everything.", "to visit relatives twice a month."], 1], ["The place where you are going to study must be …", ["comfortable with enough light and air.", "comfortable for your groupmates.", "comfortable with TV and computer.", "comfortable for your relatives and pets."], 0], ["It is better to work …", ["with your groupmates.", "away from a TV.", "using headphones.", "consulting dictionaries."], 1], ["It’s better to plan your study periods …", ["with your parents.", "in chunks with regular breaks.", "using social networks.", "following psychologists’ advice."], 1], ["Many people recommend …", ["half an hour of concentrated study, then a ten-minute break.", "an hour of concentrated study, then a fifteen-minute break.", "an hour of concentrated study, then a ten-minute break.", "half an hour of concentrated study, then a five-minute break."], 0], ["When you are studying it’s better …", ["to read through your notes.", "to learn by heart all the facts needed.", "to write notes of some kind.", "to use the Internet."], 2], ["They seem to work in the same way the brain works.", ["10-minute breaks", "important facts", "your notes", "mind maps"], 3], ["When you are studying the main two items to think about are …", ["information and how you are going to remember it.", "to make information more memorable and have a break.", "information and sources of it.", "the ways you can search for necessary information."], 0], ["A bad study habit is:", ["Take regular breaks", "Answer text messages immediately", "Make a study timetable", "Think long term"], 1]]}], "dur": 385, "script": "For items 1-10 listen to a part of an interview with volunteers. For questions 1-10, choose the best answer (A, B, C or D) according to the text you hear. You will hear the text twice.\nNow you have 30 seconds to look through the items.\n[pause 30 seconds]\nNow we begin.\nHow to study\nGood morning.\nToday I’m going to talk about how to study. Now, you probably think you know all about that, right? You’ve been studying for years. And I expect some of you are fantastic at studying, really organised and good at concentrating. But there’s always room for improvement, and your exams aren’t far away, so these tips are for all of you. Right, so, what’s the best way to study? Well, first of all, it’s a good idea to have some kind of plan or timetable. This could be for the week or a longer revision timetable for an exam, from one month to six months. Yes, if you’re studying for an important exam it’s important to think long term. Draw up a timetable, but revise it often. If it’s not going to plan, you may have to rethink it.\nNext, think about your environment. Make sure the place where you are going to study is comfortable with enough light, air, etc. Not too hot, not too cold. Make sure there are no distracting noises around, such as television. If you think you concentrate better listening to music, experiment and see if it’s really true. Some people really do seem to work better with music in the background, especially classical music, but for many people it spoils their concentration. However, if you have to work near a TV, you might have to use headphones to play music to drown out the sound of the TV. In this case, find out what kind of music works best for you, maybe something without words. By the way, you might think you work fine with the TV on, but, again, experiment. You might be surprised at how much better you work away from a TV. Oh, and the other thing is the internet, text messages, Twitter,\nFacebook, etc. Forget about all of that while you’re studying. No, really, you can ignore it for an hour or so; it won’t be the end of the world if you don’t reply to a message immediately.\nRight, planning breaks. Plan your study periods in chunks with regular breaks.\nMany people recommend half an hour of concentrated study, then a ten-minute break. But you can adjust this to suit you. If you study for too long at a stretch your mind will work less effectively, so be careful. In your short break, you can give yourself a treat, such as a cup of green tea. I wouldn’t advise a chocolate bar as a treat – a sugar rush is not great for concentration.\nOK, so next let’s think about what you do when you’re studying. Some people just read through their notes or textbooks and underline in pencil or highlight important bits. If this works for you, fine, but I’d suggest that it’s better to write notes of some kind, so your mind is processing the information more. This way you are also producing material which will be useful for last-minute revision. I don’t recommend very last minute revision, by the way, but we’ll come back to that later.\nHave a look at these examples of student notes. Which do you think are best? The first person has written important phrases at random, the next has a table with clear headings and boxes with notes, the next has summaries, and the last one has mind maps: you’ve got the main topic in the circle, then lines coming off the circle attached to subcategories, then more lines to further details. Mind maps are great for showing the connections between different bits of information. They seem to work in the same way the brain works.\nSo what do you think? To me, the first one wouldn’t be very useful to come back to and use in the future. But the others are all fine – it depends on your personal preference. Mine is for mind maps. I would suggest using colours, though, and even little drawings. They can make things much more memorable. Obviously, when you are studying, the first thing to think about is whether you understand the information, and the second thing is how you are going to remember it. Let’s look at some more ways of making information more memorable …\nNow you have 30 seconds to check your answers.\n[pause 30 seconds]\nNow listen to the text again.\n[Text repeated.]\nNow you have 30 seconds to complete the task and transfer your answers into the answer sheet.\n[pause 30 seconds]\nThis is the end of the Listening task."}, {"id": "l2-kaluga-24", "level": 2, "stage": "Municipal", "region": "Kaluga region", "year": "2024/25", "grades": "9–11", "title": "Is talent a myth?", "topics": ["Sport & health"], "time": "10 min", "plays": "twice", "about": "A radio interview with the author of “The Power of Practice”: talent, practice, coaching and why stars sometimes choke.", "hack": "B2 multiple choice tests attitude words. Mickey says “I have my critics” — so he realises some people disagree (B). He is sure others will reach the same conclusion, so it is NOT “not yet fully proved” (C).", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-9-11-pism-mun-kaluga-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-9-11-pism-mun-kaluga-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-9-11-pism-mun-kaluga-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-9-11-pism-mun-kaluga-24-25.pdf"]}, "parts": [{"t": "mcq", "instr": "Choose the best answer (A, B or C).", "items": [["When asked about his theory on talent, Mickey says that", ["he is doing further research with other people.", "he realises some people disagree with him.", "he has not yet fully proved his ideas."], 1], ["Mickey believes that outstanding football players", ["have better levels of concentration than other players.", "are aware of the positions of other players on the pitch.", "are faster runners than other players."], 1], ["How did Mickey feel when he first became successful at gymnastics?", ["convinced he had a natural aptitude for the sport", "conscious that others in his area didn’t have the same chances", "lucky to have had one of the best training routines"], 0], ["Mickey says that the motivation to continue training for long periods of time", ["develops at an early age in people who become experts.", "depends on your personal attitude towards success.", "does not come naturally to most people."], 1], ["Mickey says that coaches working with young people need to understand that", ["children and adults have different thought processes.", "young people have a built-in drive to succeed in areas like sport.", "it is important to focus on mental rather than physical techniques."], 2], ["Mickey says that many people who play sport don’t bother to try hard because", ["they feel incapable of reaching the same levels as sports stars.", "they don’t have time to put in the necessary effort.", "they are not confident in their ability to deal with success."], 0], ["According to Mickey, what can cause some sports people to fail at important events?", ["They haven’t trained enough.", "They are inexperienced at dealing with pressure.", "They can become too aware of their actions."], 2]]}], "dur": 563, "script": "You will hear part of a radio interview with an author called Mickey Smith, who is talking about becoming excellent at sport. For Questions 1–7, choose the best answer (A, B or C).\nYou now have 1 minute to look at this task.\nF: Today on the programme we have Mickey Smith, author of the book The Power of Practice.\nMickey, in your book you talk about what makes a champion sportsperson. Your argument is that talent – a natural aptitude or skill – doesn’t exist. Right?\nM: Right. I know that’s controversial because it’s thought that people are born with natural abilities. I have my critics but the evidence from research I’ve done backs up my argument. If you look at anyone who’s reached a high level in any complex task, you’ll find they’ve spent many years building up to it. This has started other people thinking and doing their own research. I’ve no doubt they’ll reach the same conclusions I have.\nF: What about physical abilities like speed? Isn’t that what makes one footballer better than another, for example?\nM: There are physical issues that are significant in some activities. However, in virtually all complex tasks the limiting factor is a mental thing. People don’t become the greatest footballers because they move around the pitch quickly. While he may not realise it, the way a great footballer understands where his teammates are around him on the field is what helps him score goals, rather than speed.\nF: In your book you also talk about geographical areas where lots of people become experts in the same activity. Gymnastics, for example.\nM: The town I grew up in produced the top gymnasts of my generation, myself included. My initial reaction when I got to the top was, ‘Wow’, I must have been born with this ability to do gymnastics. But what about the others? What I now understand is that this excellence was down to having access to a fantastic coach and a 7-day-a-week gymnastics club, where we transformed ourselves from ordinary to extraordinary. Opportunity’s another factor determining success.\nF: Your argument is that to become excellent you have to practise for thousands of hours. That’s a lot of training.\nM: That’s right. How successful you are is down to how long you’re prepared to work. Evidence suggests those who make it believe excellence relies on practice. If you believe being good at something is down to natural ability, when you fail, you’ll think you don’t have enough of it – and you’re more likely to give up. If you believe excellence is about effort, when you fail you’re going to see it as an opportunity to grow.\nF: What approach should coaches take when training youngsters in sport?\nM: The way to go about it is to ensure the child enjoys what they’re learning – that it becomes an internal desire to progress. Coaching young people is more about psychology than it is about the technical side of things – it’s making the young performer really care about where they’re going, motivating them in the right way, that will enable them to actually get there – little difference from how you encourage adults really.\nF: Why don’t more people who play sport try harder to improve?\nM: Well, they see sports stars and assume they were born brilliant, but there’s no evidence to suggest that. You just don’t see the painstaking process it took to get them there when they’re winning games on your TV screen. If you did, their brilliance wouldn’t seem so miraculous. The illusion is to think they got there quickly and think ‘Oh my goodness, I could never get up that slope.’\nF: Given everything you’ve said about top performers, why do they sometimes fail at crucial moments? That’s called ‘choking’, right?\nM: Yes. It’s to do with the expectation to succeed, no matter how many times they’ve done it before. When you first practise a skill you have to exert conscious control over it. When you become proficient you’re able to do it subconsciously. When you choke you become so anxious that instead of delivering your skill automatically, you become conscious of what you’re doing and it’s like you’ve never done it before.\nF: Thank you very much [FADE]"}, {"id": "l2-nn-24", "level": 2, "stage": "Municipal", "region": "Nizhny Novgorod region", "year": "2024/25", "grades": "9–11", "title": "Young writers who won a prize", "topics": ["Music, arts & books"], "time": "10 min", "plays": "twice", "about": "Five young writers remember entering a competition — how they felt then and what changed after they won.", "hack": "A double matching task: listen for TWO things in each speaker — a feeling BEFORE and a consequence AFTER. Make two columns on your paper and note both while the speaker is talking.", "src": {"audio": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/audio-engl-9-11-pism-mun-nn-24-25.mp3"], "tasks": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/tasks-engl-9-11-pism-mun-nn-24-25.pdf"], "ans": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/ans-engl-9-11-pism-mun-nn-24-25.pdf"], "script": ["https://tasks.olimpiada.ru/upload/files/tasks/88/2024/script-engl-9-11-pism-mun-nn-24-25.pdf"]}, "parts": [{"t": "match", "instr": "Questions 1–5: the feeling each writer had when they ENTERED the competition (A–H).", "opts": [["A", "hopeful of winning the cash prize"], ["B", "terrified at making a speech"], ["C", "convinced they would not win"], ["D", "amused by the reactions of friends"], ["E", "unhappy with the competition rules"], ["F", "worried about coping with failure"], ["G", "impressed by the other books"], ["H", "determined to learn from the experience"]], "items": [["Speaker 1", "G"], ["Speaker 2", "H"], ["Speaker 3", "F"], ["Speaker 4", "B"], ["Speaker 5", "E"]]}, {"t": "match", "instr": "Questions 6–10: the main CONSEQUENCE of winning for each writer (A–H).", "opts": [["A", "offers from overseas publishers"], ["B", "a change in writing style"], ["C", "opportunities to travel"], ["D", "contact with readers"], ["E", "difficulties finding inspiration"], ["F", "media intrusion"], ["G", "increased sales of previous work"], ["H", "a boost to confidence"]], "items": [["Speaker 1", "G"], ["Speaker 2", "B"], ["Speaker 3", "E"], ["Speaker 4", "A"], ["Speaker 5", "H"]]}], "dur": 233, "script": "TRANSCRIPT\nSpeaker 1\nI was thrilled when I heard I'd won first prize - a substantial amount of money! I'd had a sneaky look at all the novels that had been entered and I must admit every single one was a gripping read and well written. The ironic thing about winning the money was that I needed it less after I'd won. I'd spent a couple of years earning enough to live on, but not exactly living the high life. Then, once news was out about me winning, bookshops were overwhelmed with readers suddenly wanting anything and everything I'd ever written! Thankfully, my agent dealt with the emails that flooded in from fans and she also managed my social media presence.\nSpeaker 2\nI live in Australia and I was on a flight back from Europe when the news broke, so\nI'd no idea I'd won the competition until the next day. Sure, I remember the publicity that surrounded winning, but what marked the event for me was the mental switch I made from writing novels based on historical facts to more descriptive ,character-driven stories. I also recall, when I'd just sent off the entry form, thinking whatever the result, win or lose, it'd give me the chance to get feedback on my work and I'd take it on board. The judges were all highly respected writers and publishers, and even if they'd poured scorn on my work, it'd still have been useful.\nSpeaker 3\nWell, to be honest, winning the prize has been a double-edged sword. Yeah, it was great to be headline news, but after that all died down, I spent hours staring at a blank screen, thinking - what now? Obviously, I knew I was a good writer, I wouldn't have won otherwise, but it was hard for about a year. It's weird, because when I went in for the competition I had numerous sleepless nights thinking:\nwhat'll happen if I don't win? Would I go into some sort of decline and not want to face my friends and colleagues? Fortunately, I did win, so those anxieties never had to be faced.\nSpeaker 4\nThe minute I'd completed the form to enter the competition, the only thing I could think about was; what would I say when I accepted the prize? At that stage I had no idea whether I'd even win or not. I knew there'd be a big formal dinner and the winner would have to get up and come out with words of wisdom and the thought made me feel numb with fear! Anyway, I managed to mumble thanks to all my readers and the usual stuff when the time came. In contrast, afterwards there was no time to think at all –I was being asked to write a follow-up novel by companies in countries I knew little about!\nSpeaker 5\nI was so hacked off by all the criteria I had to meet for the competition that by the time I'd checked this, that and the other, sent endless confirmations of my ID, and read the competition style guide for the tenth time, I hoped I'd have nothing more to do with it all. Of course, having won, I can now see the funny side of all that.\nWinning has also made me a more assertive person, sure enough of myself to say,\n'No thank you, I won't be doing that interview or attending that party. The same's happened as far as writing goes - I know what works for me!"}, {"id": "l2-novgorod-24", "level": 2, "stage": "Municipal", "region": "Novgorod region", "year": "2024/25", "grades": "9–11", "title": "Living online", "topics": ["Technology & media"], "time": "10 min", "plays": "twice", "about": "Five people talk about mobiles, social networks, phubbing and the fear of missing out."
