3><ul>\n<li><b>Questions follow the order of the recording.<\/b> If you hear the answer to question 5, question 4 is already gone — move on.<\/li>\n<li><b>Never stop on a missed answer.<\/b> You will hear it again. Mark it with “?” and keep listening.<\/li>\n<li><b>Write short:<\/b> first letters, numbers, arrows. Tidy up in the pause.<\/li>\n<li><b>First listening — answer. Second listening — check.<\/b> Change an answer only if you really heard something new.<\/li>\n<li><b>No empty boxes.<\/b> A blank and a wrong answer both score 0 — so always guess.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Listen for signposts<\/h3><p>These words tell you that the answer is coming or that the speaker is changing direction:<\/p>\n<p class=\"chips\"><span>but<\/span><span>however<\/span><span>actually<\/span><span>in fact<\/span><span>to be honest<\/span><span>the main thing is<\/span><span>what I really…<\/span><span>not that…, it’s just that…<\/span><span>well, no<\/span><\/p>\n<p class=\"muted\">Sophie in <a class=\"tlink\" href=\"#t-l1-komi-25\">▶ Teenagers who design clothes<\/a>: “making your own clothes is cheaper…, <b>but the main thing is<\/b> that no one else will be wearing the same as you”.<\/p><\/div><\/div>"}, {"id": "traps", "kicker": "Lifehack 3", "title": "The seven traps", "html": "\n<table class=\"traps\">\n<tr><th>Trap<\/th><th>What it sounds like<\/th><th>Real example<\/th><\/tr>\n<tr><td><b>1 · Correction<\/b><\/td><td>“on Tuesday… no, actually…”<\/td><td>“You’re from Australia?” — “<b>Actually<\/b>, I’m a New Zealander.” <a class=\"tlink\" href=\"#t-l2-xakas-24\">▶ Prime Recruitment: a job as a nanny<\/a><\/td><\/tr>\n<tr><td><b>2 · Everything is mentioned<\/b><\/td><td>all three options are in the text<\/td><td>Mandy was a nurse, looked after elderly people and bought equipment — only one answers “when did she start as a DJ?” <a class=\"tlink\" href=\"#t-l1-xakas-25\">▶ Mandy: from DJ to singer<\/a><\/td><\/tr>\n<tr><td><b>3 · Then and now<\/b><\/td><td>“used to…, but now…”<\/td><td>Lindsey <i>started<\/i> in a test lab but <i>now<\/i> works in project management. <a class=\"tlink\" href=\"#t-l3-reg-21\">▶ A woman in engineering · The job interview<\/a><\/td><\/tr>\n<tr><td><b>4 · Expected vs real<\/b><\/td><td>“You’d think…, right? Well, no.”<\/td><td>The group with a reward was <i>slower<\/i>, not faster. <a class=\"tlink\" href=\"#t-l1-kostroma-24\">▶ Do rewards really motivate us?<\/a><\/td><\/tr>\n<tr><td><b>5 · Someone else’s opinion<\/b><\/td><td>“people think…, but I…”<\/td><td>“Everyone says Venice is expensive, but I didn’t think it was.” <a class=\"tlink\" href=\"#t-l1-nn-25\">▶ Travel experiences<\/a><\/td><\/tr>\n<tr><td><b>6 · Numbers<\/b><\/td><td>fifteen / fifty, several numbers together<\/td><td>5,000 years ago… 700 years ago… in 1726… 550 million tonnes. <a class=\"tlink\" href=\"#t-l1-kryar-25\">▶ Websites about food: rice and noodles<\/a><\/td><\/tr>\n<tr><td><b>7 · Same words, different idea<\/b><\/td><td>the option repeats words from the text<\/td><td>Speaker 3 talks about FOMO — but only heard about it on the radio. <a class=\"tlink\" href=\"#t-l2-novgorod-24\">▶ Living online<\/a><\/td><\/tr><\/table>"}, {"id": "tf", "kicker": "Lifehack 4", "title": "True / False / Not given", "html": "\n<div class=\"cols2\">\n<div class=\"card\"><h3>The difference that costs points<\/h3>\n<table class=\"mini\"><tr><td><b>True<\/b><\/td><td>the recording says the same thing in other words<\/td><\/tr>\n<tr><td><b>False<\/b><\/td><td>the recording says the <b>opposite<\/b> — you can point to the words<\/td><\/tr>\n<tr><td><b>Not given<\/b><\/td><td>the recording says <b>nothing<\/b> about it<\/td><\/tr><\/table>\n<p>In True/False tasks without “Not given”, anything that does not match is False.<\/p><\/div>\n<div class=\"card\"><h3>Four quick checks<\/h3><ul>\n<li><b>Extreme words<\/b> — <i>always, never, only, all, completely<\/i> — are usually False.<\/li>\n<li><b>Numbers:<\/b> do the maths. 100,000 → 3,000 tigers is not “ten times”. <a class=\"tlink\" href=\"#t-l1-tula-25\">▶ Hot topic: the environment<\/a><\/li>\n<li><b>Who?<\/b> Check which speaker says it. <a class=\"tlink\" href=\"#t-l1-kem-25\">▶ Brian, the classic first child<\/a><\/li>\n<li><b>Half-true = False.<\/b> Peñalosa did lead the reform, but the funds were saved by <i>other<\/i> mayors. <a class=\"tlink\" href=\"#t-l3-reg-23\">▶ How Bogotá was transformed · A nightmare train journey<\/a><\/li><\/ul><\/div><\/div>"}, {"id": "gaps", "kicker": "Lifehack 5", "title": "Gaps, notes and forms", "html": "\n<div class=\"cols2\">\n<div class=\"card\"><h3>Read the word limit<\/h3>\n<p>“NO MORE THAN TWO WORDS AND/OR A NUMBER” → <i>45 minutes<\/i> ✓, <i>about 45 minutes<\/i> ✗.<\/p>\n<p>“Write numbers in words” → <i>twenty-fourth<\/i> ✓, <i>24th<\/i> ✗. <a class=\"tlink\" href=\"#t-l1-vladimir-25\">▶ Singing for beginners<\/a><\/p>\n<p>The word you write is usually the <b>exact word from the recording<\/b> — you rarely need to change it.<\/p><\/div>\n<div class=\"card\"><h3>Spelling counts<\/h3><ul>\n<li>A spelling mistake = 0 points. Learn the tricky ones: <i>cuisine, reliable, accommodation, necessary, library, Wednesday, February<\/i>.<\/li>\n<li>Names and e-mails are spelt out letter by letter: E-D-W-I-N-A-R-I. <a class=\"tlink\" href=\"#t-l2-xakas-24\">▶ Prime Recruitment: a job as a nanny<\/a><\/li>\n<li>Check grammar: singular or plural? “make ___” → <i>presents<\/i>. <a class=\"tlink\" href=\"#t-l2-komi-24\">▶ Things to do in the school holidays<\/a><\/li>\n<li>Dates: <i>March 1994<\/i>, <i>the 24th of September<\/i>.<\/li><\/ul><\/div><\/div>"}, {"id": "match", "kicker": "Lifehack 6", "title": "Matching speakers", "html": "\n<div class=\"cols2\">\n<div class=\"card\"><h3>How to match<\/h3><ul>\n<li><b>Read the options first<\/b> and turn each into your own short idea: “cosmopolitan” = people from everywhere.<\/li>\n<li><b>Listen to the whole speaker<\/b> before you decide — the key idea often comes at the end.<\/li>\n<li><b>One or more options are extra.<\/b> Cross out an option once it is used.<\/li>\n<li>Speakers mention <b>several<\/b> options on purpose. Ask: what is the <i>main<\/i> point?<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Paraphrase is everything<\/h3>\n<table class=\"mini\"><tr><td>“It’s like the whole world is here.”<\/td><td>→ It’s very cosmopolitan.<\/td><\/tr>\n<tr><td>“Never a dull moment.”<\/td><td>→ There’s always something to do.<\/td><\/tr>\n<tr><td>“He doesn’t get stressed about things.”<\/td><td>→ He’s easygoing.<\/td><\/tr>\n<tr><td>“He always does what he says he will.”<\/td><td>→ He’s reliable.<\/td><\/tr><\/table>\n<p class=\"muted\"><a class=\"tlink\" href=\"#t-l1-arh-24\">▶ What I love about London<\/a> · <a class=\"tlink\" href=\"#t-l2-irk-25\">▶ Boyfriends · Beyoncé beyond the music<\/a> · <a class=\"tlink\" href=\"#t-l2-nn-24\">▶ Young writers who won a prize<\/a><\/p><\/div><\/div>"}, {"id": "mcq", "kicker": "Lifehack 7", "title": "Multiple choice and “choose several”", "html": "\n<div class=\"cols2\">\n<div class=\"card\"><h3>Multiple choice<\/h3><ul>\n<li><b>Cross out<\/b> options that are never mentioned — then choose between the rest.<\/li>\n<li><b>Questions with NOT / DIDN’T<\/b>: find the two that are true, the third is your answer. <a class=\"tlink\" href=\"#t-l3-reg-21\">▶ A woman in engineering · The job interview<\/a><\/li>\n<li><b>Feelings and attitudes<\/b> (B2+): listen to the tone and to words like <i>controversial, I have my critics, lucky<\/i>. <a class=\"tlink\" href=\"#t-l2-kaluga-24\">▶ Is talent a myth?<\/a><\/li>\n<li><b>Regional Task 2 is heard ONCE<\/b> — answer during the recording, do not wait.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>“Choose ALL / THREE that are mentioned”<\/h3><ul>\n<li>Every correct letter is a point, in any order.<\/li>\n<li>Tick only what you <b>heard<\/b>, not what is logical. <a class=\"tlink\" href=\"#t-l2-kem-25\">▶ A talk about home education<\/a><\/li>\n<li>Watch the number: “choose THREE” means exactly three.<\/li>\n<li>“Was the view expressed?” — Y if <b>anyone<\/b> says it, even if the other person disagrees. <a class=\"tlink\" href=\"#t-l2-vologda-24\">▶ From the city to the countryside · Sick buildings<\/a><\/li><\/ul><\/div><\/div>"}, {"id": "plan", "kicker": "Lifehack 8", "title": "How to train at home", "html": "\n<div class=\"cols2\">\n<div class=\"card\"><h3>One task, four passes<\/h3><ol class=\"steps\">\n<li><b>Exam mode.<\/b> Play it straight through, no pausing. Check. That is your real score.<\/li>\n<li><b>Practice mode.<\/b> Listen again, pause, rewind the places where you made mistakes.<\/li>\n<li><b>With the script.<\/b> Read and listen at the same time. Underline the words that gave the answer.<\/li>\n<li><b>Shadowing.<\/b> Choose one paragraph and repeat it after the speaker. It trains your ear for fast speech.<\/li><\/ol><\/div>\n<div class=\"card\"><h3>Every day, 10 minutes<\/h3><ul>\n<li>A short podcast: <a href=\"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english\" target=\"_blank\" rel=\"noopener\">BBC 6 Minute English<\/a> — with scripts.<\/li>\n<li>Numbers, dates and spelling dictations — they are in almost every gap task.<\/li>\n<li>Different accents: British, American, Australian, New Zealand — the olympiad uses them all.<\/li>\n<li>More real papers with audio: <a href=\"https://olimpiada.ru/activity/88/tasks\" target=\"_blank\" rel=\"noopener\">olimpiada.ru archive<\/a>.<\/li><\/ul><\/div><\/div>"}]};</script><script>/* Listening Lab · real olympiad listening tasks with audio, keys, scripts and lifehacks.
   DATA = {tasks, hacks} is embedded by build.py; audio files live in AUDIO_DIR next to the page. */
(() => {
'use strict';
const TG_USER = 'annasuhstuff', STUDENT = 'Julia', AUDIO_DIR = 'listening-audio/';
const {tasks: TASKS, hacks: HACKS} = DATA;
const LS = 'listening-lab-v1';
let ST = {res: {}, drafts: {}, mode: 'exam'};
try { Object.assign(ST, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(ST)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const LV = {1: ['Level 1', 'grades 7–8 · municipal', 'var(--l1)'], 2: ['Level 2', 'grades 9–11 · municipal', 'var(--l2)'], 3: ['Level 3', 'regional & final', 'var(--l3)']};
const BYID = Object.fromEntries(TASKS.map(t => [t.id, t]));

/* ---------- formats ---------- */
function fmt(p) {
  if (p.t === 'judge') { const k = p.opts.map(o => o[0]).join(''); return k === 'TF' ? 'True / False' : k === 'TFN' ? 'True / False / Not given' : 'Heard or not (Y/N)'; }
  return {mcq: 'Multiple choice', gap: 'Gaps & notes', match: 'Matching', multi: 'Choose several'}[p.t];
}
TASKS.forEach(t => {
  t.formats = [...new Set(t.parts.map(fmt))];
  t.once = /ONCE/.test(t.plays);
  let last = null; t.parts.forEach(p => { if (p.opts === 'same') p.opts = last; if (p.opts) last = p.opts; });
  t.max = t.parts.reduce((s, p) => s + (p.t === 'multi' ? p.answer.length : p.items.length), 0);
});
const FORMATS = [...new Set(TASKS.flatMap(t => t.formats))];
const TOPICS = [...new Set(TASKS.flatMap(t => t.topics))].sort();

/* ---------- routes ---------- */
const ROUTES = ['start', ...HACKS.map(h => 'hack-' + h.id), 'tasks', ...TASKS.map(t => 't-' + t.id), 'results'];
let cur = 'start';
function go(r) { if (!ROUTES.includes(r)) r = 'start'; if (location.hash.slice(1) !== r) history.replaceState(null, '', '#' + r); cur = r; stopAudio(); render(); $('.stage').scrollTop = 0; }
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
function navBtns() {
  const i = ROUTES.indexOf(cur), p = ROUTES[i - 1], n = ROUTES[i + 1];
  const name = r => r === 'start' ? 'Start' : r === 'tasks' ? 'All tasks' : r === 'results' ? 'My results' : r.startsWith('hack-') ? HACKS.find(h => 'hack-' + h.id === r).title : BYID[r.slice(2)].title;
  return `<div class="navbtns">${p ? `<a class="btn ghost" href="#${p}">← ${esc(name(p))}</a>` : '<span></span>'}${n ? `<a class="btn" href="#${n}">${esc(name(n))} →</a>` : ''}</div>`;
}
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const i = ROUTES.indexOf(cur);
  if (e.key === 'ArrowRight' && ROUTES[i + 1]) go(ROUTES[i + 1]);
  if (e.key === 'ArrowLeft' && ROUTES[i - 1]) go(ROUTES[i - 1]);
});

/* ---------- sidebar ---------- */
function scoreTag(t) { const r = ST.res[t.id]; return r ? `<span class="sc ${r.score === r.max ? 'ok' : ''}">${r.score}/${r.max}</span>` : ''; }
function desk() {
  const d = $('.desk');
  d.innerHTML = `<div class="brand"><span class="dot"></span><div><b>Listening Lab</b><small>olympiad audio · on air</small></div></div>
   <a class="nav ${cur === 'start' ? 'on' : ''}" href="#start">Start</a>
   <h4>Lifehacks</h4>${HACKS.map(h => `<a class="nav ${cur === 'hack-' + h.id ? 'on' : ''}" href="#hack-${h.id}">${esc(h.title)}</a>`).join('')}
   <h4>Tasks</h4><a class="nav ${cur === 'tasks' ? 'on' : ''}" href="#tasks">All tasks · filters</a>
   ${[1, 2, 3].map(l => `<h4 style="color:${LV[l][2]}">${LV[l][0]} · ${LV[l][1]}</h4>` + TASKS.filter(t => t.level === l).map(t => `<a class="nav ${cur === 't-' + t.id ? 'on' : ''}" href="#t-${t.id}"><span class="lv" style="background:${LV[l][2]}"></span>${esc(t.title)}${scoreTag(t)}</a>`).join('')).join('')}
   <h4>Results</h4><a class="nav ${cur === 'results' ? 'on' : ''}" href="#results">My results</a><a class="nav send" href="#results" data-quicksend>📨 Send results to Anya</a>`;
  const q = d.querySelector('[data-quicksend]'); q.onclick = e => { e.preventDefault(); sendSummary(); };
  const on = d.querySelector('.nav.on'); if (on) on.scrollIntoView({block: 'nearest'});
}

/* ---------- views ---------- */
function render() {
  desk();
  const v = $('.view');
  if (cur === 'start') v.innerHTML = startView();
  else if (cur.startsWith('hack-')) v.innerHTML = hackView(HACKS.find(h => 'hack-' + h.id === cur));
  else if (cur === 'tasks') { v.innerHTML = catalogue(); bindCatalogue(); }
  else if (cur === 'results') { v.innerHTML = results(); bindResults(); }
  else taskView(BYID[cur.slice(2)], v);
}
function startView() {
  const mins = Math.round(TASKS.reduce((s, t) => s + (t.dur || 0), 0) / 60);
  return `<div class="hero"><div><div class="kicker">All-Russian Olympiad in English · Listening</div><h1>Listening Lab</h1>
    <p class="lead">${TASKS.length} real listening tasks from the olympiad — municipal, regional and final stages — with the original audio, official keys, full scripts and the lifehacks that win points.</p>
    <div class="chips"><span>${TASKS.length} tasks</span><span>${TASKS.reduce((s, t) => s + t.max, 0)} questions</span><span>${mins} minutes of audio</span><span>${FORMATS.length} formats</span><span>${TOPICS.length} topics</span></div></div>
    <div class="wave">${Array.from({length: 26}, (_, i) => `<i style="height:${30 + Math.round(Math.abs(Math.sin(i * 1.7)) * 70)}%;animation-delay:${(i % 7) * .12}s"></i>`).join('')}</div></div>
    <div class="levels">${[1, 2, 3].map(l => { const n = TASKS.filter(t => t.level === l); return `<a class="lvcard" style="background:${LV[l][2]}" href="#tasks" data-lv="${l}"><b>${LV[l][0]}</b><span>${LV[l][1]}</span><em>${n.length} tasks · ${n.reduce((s, t) => s + t.max, 0)} questions</em></a>`; }).join('')}</div>
    <div class="cols2"><div class="card"><h3>How to use it</h3><ol class="steps"><li>Read the <b>lifehacks</b> first — they take ten minutes.</li><li>Open a task, read the questions, press ▶. Start in <b>Exam mode</b>: no pausing, no rewinding.</li><li>Press <b>Check</b>. Then read the <b>script</b> and find the words that gave each answer.</li><li>Press <b>Send to Anya</b> — your results go straight to her Telegram.</li></ol></div>
    <div class="card"><h3>Sorted three ways</h3><p><b>By level:</b> 7–8 municipal → 9–11 municipal → regional & final.</p><p><b>By format:</b> ${FORMATS.join(' · ')}.</p><p><b>By topic:</b> ${TOPICS.join(' · ')}.</p><p class="muted">Use the filters on the “All tasks” page.</p></div></div>` + navBtns();
}
function hackView(h) { return `<div class="kicker">${esc(h.kicker)}</div><h1>${esc(h.title)}</h1>${h.html}` + navBtns(); }

let FILTER = {level: 0, format: '', topic: ''};
function catalogue() {
  const list = TASKS.filter(t => (!FILTER.level || t.level === FILTER.level) && (!FILTER.format || t.formats.includes(FILTER.format)) && (!FILTER.topic || t.topics.includes(FILTER.topic)));
  const pills = (key, vals, label) => `<div class="grp"><span>${label}</span><button class="pill ${!FILTER[key] ? 'on' : ''}" data-k="${key}" data-v="">All</button>${vals.map(([v, n]) => `<button class="pill ${FILTER[key] === v ? 'on' : ''}" data-k="${key}" data-v="${esc(v)}">${esc(n)}</button>`).join('')}</div>`;
  return `<div class="kicker">${TASKS.length} tasks</div><h1>All tasks</h1><p class="lead">Filter by level, format and topic. A tick shows your best score.</p>
   <div class="filters">${pills('level', [[1, 'Level 1'], [2, 'Level 2'], [3, 'Level 3']], 'Level')}${pills('format', FORMATS.map(f => [f, f]), 'Format')}${pills('topic', TOPICS.map(f => [f, f]), 'Topic')}</div>
   <div class="grid">${list.map(card).join('') || '<p class="muted">Nothing matches — try another filter.</p>'}</div>` + navBtns();
}
function card(t) {
  const r = ST.res[t.id];
  return `<a class="tcard" style="--c:${LV[t.level][2]}" href="#t-${t.id}"><span class="meta">${LV[t.level][0]} · ${esc(t.stage)} · ${esc(t.region)} · ${t.year}</span><b>${esc(t.title)}</b>
    <span class="tags">${t.formats.map(f => `<span class="tag">${esc(f)}</span>`).join('')}${t.once ? '<span class="tag once">played once</span>' : ''}</span>
    <span class="tags">${t.topics.map(f => `<span class="tag">${esc(f)}</span>`).join('')}<span class="tag">${Math.round(t.dur / 60)} min audio</span></span>
    ${r ? `<span class="score">✓ best ${r.best}/${t.max}</span>` : ''}</a>`;
}
function bindCatalogue() {
  document.querySelectorAll('.pill').forEach(b => b.onclick = () => { const k = b.dataset.k; FILTER[k] = k === 'level' ? +b.dataset.v : b.dataset.v; render(); });
}
document.addEventListener('click', e => { const a = e.target.closest('.lvcard'); if (a) FILTER = {level: +a.dataset.lv, format: '', topic: ''}; });

/* ---------- task ---------- */
let audio = null, TIMER = null;
function stopAudio() { if (audio) { audio.pause(); audio = null; } clearInterval(TIMER); }
const fmtTime = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function taskView(t, v) {
  const d = ST.drafts[t.id] || (ST.drafts[t.id] = {a: {}, checked: false});
  const lv = LV[t.level];
  v.innerHTML = `<div class="thead"><div><div class="kicker" style="color:${lv[2]}">${lv[0]} · grades ${t.grades} · ${esc(t.stage)} stage · ${esc(t.region)} · ${t.year}</div><h1>${esc(t.title)}</h1><p class="lead">${esc(t.about)}</p></div>
     <span class="lvbadge" style="background:${lv[2]}">${lv[0]}</span></div>
    <div class="tags">${t.formats.map(f => `<span class="tag">${esc(f)}</span>`).join('')}${t.topics.map(f => `<span class="tag">${esc(f)}</span>`).join('')}<span class="tag">time: ${esc(t.time)}</span><span class="tag ${t.once ? 'once' : ''}">played ${esc(t.plays)}</span></div>
    <div class="player"><div class="prow"><button class="play" title="Play / pause">▶</button><div class="bar"><i></i></div><span class="time">0:00 / ${fmtTime(t.dur)}</span></div>
     <div class="prow" style="margin-top:10px"><div class="modes"><button data-m="exam">Exam mode</button><button data-m="practice">Practice mode</button></div>
     <button class="pbtn" data-j="-10">−10 s</button><button class="pbtn" data-j="10">+10 s</button><select class="pbtn" data-rate><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option></select></div>
     <div class="pinfo"></div></div>
    <div class="parts"></div>
    <div class="actions"></div><div class="after"></div>
    <p class="src">Source: the official paper and key — <a href="${esc(t.src.tasks[0])}" target="_blank" rel="noopener">tasks</a> · <a href="${esc((t.src.ans || [])[0] || '#')}" target="_blank" rel="noopener">key</a> · <a href="${esc((t.src.script || [])[0] || '#')}" target="_blank" rel="noopener">script</a> · olimpiada.ru archive.${t.id.startsWith('l3') ? ' The integrated listening-and-reading task that follows in the original recording is not included.' : ''}</p>` + navBtns();
  setupPlayer(t, v);
  drawParts(t, d);
}
function setupPlayer(t, v) {
  audio = new Audio(AUDIO_DIR + t.id + '.mp3'); audio.preload = 'metadata';
  const play = $('.play', v), bar = $('.bar', v), fill = $('.bar i', v), time = $('.time', v), info = $('.pinfo', v);
  const modeBtns = v.querySelectorAll('.modes button'), jumps = v.querySelectorAll('[data-j]'), rate = $('[data-rate]', v);
  const apply = () => {
    const exam = ST.mode === 'exam';
    modeBtns.forEach(b => b.classList.toggle('on', b.dataset.m === ST.mode));
    jumps.forEach(b => b.disabled = exam); rate.disabled = exam; bar.classList.toggle('locked', exam);
    if (exam) { audio.playbackRate = 1; rate.value = '1'; }
    info.innerHTML = exam ? `<b>Exam mode:</b> the recording runs like at the olympiad — with the reading time, the pauses and the repetition inside it. You can pause, but you cannot rewind. ${t.once ? '<b>Part of this recording is played only ONCE.</b>' : ''}`
      : '<b>Practice mode:</b> pause, rewind 10 s, click the bar to jump, slow down to 0.85×. Use it after you have done the task in exam mode.';
  };
  modeBtns.forEach(b => b.onclick = () => { ST.mode = b.dataset.m; save(); apply(); });
  play.onclick = () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
  audio.onplay = () => { play.textContent = '❚❚'; play.classList.add('on'); };
  audio.onpause = () => { play.textContent = '▶'; play.classList.remove('on'); };
  audio.onended = () => { play.textContent = '↺'; play.classList.remove('on'); };
  const tick = () => { const d = audio.duration || t.dur; fill.style.width = (audio.currentTime / d * 100) + '%'; time.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(d)}`; };
  audio.ontimeupdate = tick; audio.onloadedmetadata = tick;
  jumps.forEach(b => b.onclick = () => { audio.currentTime = Math.max(0, audio.currentTime + +b.dataset.j); });
  rate.onchange = () => { audio.playbackRate = +rate.value; };
  bar.onclick = e => { if (ST.mode === 'exam') return; const r = bar.getBoundingClientRect(); audio.currentTime = (e.clientX - r.left) / r.width * (audio.duration || t.dur); };
  apply();
}

function norm(s) { return String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,;:!]+$/g, '').replace(/\s+/g, ' ').replace(/\s*-\s*/g, '-').trim(); }
function isRight(p, i, v) {
  if (p.t === 'gap') return p.items[i][1].map(norm).includes(norm(v));
  if (p.t === 'mcq') return v === p.items[i][2];
  return v === p.items[i][1];
}
function drawParts(t, d) {
  const box = $('.parts'), checked = d.checked;
  let n = 0;
  box.innerHTML = t.parts.map((p, pi) => {
    const a = d.a[pi] || (d.a[pi] = p.t === 'multi' ? [] : {});
    let h = `<div class="part"><p class="instr">${t.parts.length > 1 ? `Part ${pi + 1}. ` : ''}${esc(p.instr)}</p>`;
    if (p.t === 'match' || p.t === 'multi') h += p.t === 'match' ? `<div class="legend">${p.opts.map(o => `<span><b>${esc(o[0])}</b>${esc(o[1])}</span>`).join('')}</div>` : '';
    if (p.t === 'multi') {
      h += `<div class="multi">${p.opts.map(([k, txt]) => { const sel = a.includes(k), key = p.answer.includes(k); const cls = checked ? (sel && key ? 'right' : sel ? 'wrong' : key ? 'missed' : '') : (sel ? 'sel' : ''); return `<button class="o ${cls}" data-p="${pi}" data-k="${k}"><b>${k}</b>${esc(txt)}</button>`; }).join('')}</div>
        <div class="count">chosen ${a.length} of ${p.count}${checked ? ` · correct: ${p.answer.join(', ')}` : ''}</div>`;
    } else {
      h += p.items.map((it, i) => {
        n++; const v = a[i], ok = checked ? isRight(p, i, v) : null, st = checked ? (ok ? 'ok' : 'bad') : '';
        const num = `<span class="n">${checked ? (ok ? '✓' : '✗') : n}</span>`;
        if (p.t === 'judge') return `<div class="q ${st}">${num}<span>${esc(it[0])}</span><span class="opts">${p.opts.map(([k, lab]) => `<button class="o ${checked ? (k === it[1] ? 'right' : k === v ? 'wrong' : '') : (v === k ? 'sel' : '')}" data-p="${pi}" data-i="${i}" data-v="${k}">${esc(lab)}</button>`).join('')}</span></div>`;
        if (p.t === 'mcq') return `<div class="q mc ${st}">${num}<div><div>${esc(it[0])}</div><div class="opts" style="margin-top:6px">${it[1].map((o, j) => `<button class="o ${checked ? (j === it[2] ? 'right' : j === v ? 'wrong' : '') : (v === j ? 'sel' : '')}" data-p="${pi}" data-i="${i}" data-v="${j}"><b>${'ABCD'[j]}</b>${esc(o)}</button>`).join('')}</div></div></div>`;
        if (p.t === 'gap') { const parts = it[0].split('___'); return `<div class="q ${st}">${num}<span>${esc(parts[0])}<input class="gap ${checked ? (ok ? 'right' : 'wrong') : ''}" data-p="${pi}" data-i="${i}" value="${esc(v || '')}" ${checked ? 'disabled' : ''} spellcheck="false" autocomplete="off">${esc(parts[1] || '')}</span><span></span>${checked && !ok ? `<span class="fix">→ ${esc(it[1][0])}${it[1].length > 1 ? ` <span class="muted">(also: ${esc(it[1].slice(1).join(', '))})</span>` : ''}</span>` : ''}</div>`; }
        if (p.t === 'match') return `<div class="q ${st}">${num}<span>${esc(it[0])}</span><select class="m ${checked ? (ok ? 'right' : 'wrong') : ''}" data-p="${pi}" data-i="${i}" ${checked ? 'disabled' : ''}><option value="">—</option>${p.opts.map(([k, txt]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${k} · ${esc(txt.length > 48 ? txt.slice(0, 46) + '…' : txt)}</option>`).join('')}</select>${checked && !ok ? `<span class="fix">→ ${esc(it[1])}</span>` : ''}</div>`;
      }).join('');
      if (p.note && checked) h += `<p class="count">${esc(p.note)}</p>`;
    }
    return h + '</div>';
  }).join('');
  if (!checked) {
    box.querySelectorAll('button.o').forEach(b => b.onclick = () => {
      const p = t.parts[+b.dataset.p], a = d.a[+b.dataset.p];
      if (p.t === 'multi') { const k = b.dataset.k; const j = a.indexOf(k); if (j >= 0) a.splice(j, 1); else a.push(k); }
      else { const i = +b.dataset.i, val = p.t === 'mcq' ? +b.dataset.v : b.dataset.v; a[i] = a[i] === val ? undefined : val; }
      save(); drawParts(t, d);
    });
    box.querySelectorAll('input.gap').forEach(inp => inp.oninput = () => { d.a[+inp.dataset.p][+inp.dataset.i] = inp.value; save(); });
    box.querySelectorAll('select.m').forEach(s => s.onchange = () => { d.a[+s.dataset.p][+s.dataset.i] = s.value || undefined; save(); });
  }
  actions(t, d);
}
function score(t, d) {
  let s = 0;
  t.parts.forEach((p, pi) => {
    const a = d.a[pi] || {};
    if (p.t === 'multi') { const good = a.filter(k => p.answer.includes(k)).length, extra = Math.max(0, a.length - p.count); s += Math.max(0, good - extra); }
    else p.items.forEach((_, i) => { if (isRight(p, i, a[i])) s++; });
  });
  return s;
}
function actions(t, d) {
  const act = $('.actions'), after = $('.after');
  if (!d.checked) {
    const answered = t.parts.reduce((s, p, pi) => s + (p.t === 'multi' ? (d.a[pi] || []).length : Object.values(d.a[pi] || {}).filter(x => x !== undefined && x !== '').length), 0);
    act.innerHTML = `<button class="btn amber" data-check>Check answers</button><button class="btn tg" data-checksend>📨 Check &amp; send to Anya</button><span class="muted">answered ${answered} · empty answers count as wrong, so always guess</span>`;
    after.innerHTML = `<details class="hack"><summary><b class="k" style="display:inline">Lifehack for this task</b> — open it only if you are stuck</summary><p style="margin:8px 0 0">${esc(t.hack)}</p></details>`;
    const doCheck = () => {
      d.checked = true; d.mode = ST.mode;
      const s = score(t, d), prev = ST.res[t.id];
      ST.res[t.id] = {score: s, max: t.max, mode: ST.mode, date: new Date().toISOString(), best: Math.max(s, prev ? prev.best || prev.score : 0)};
      save(); drawParts(t, d); desk();
      $('.result') && $('.result').scrollIntoView({behavior: 'smooth', block: 'center'});
    };
    $('[data-check]').onclick = doCheck;
    $('[data-checksend]').onclick = () => { doCheck(); send(report(t, d)); const b = $('[data-send]'); if (b) b.textContent = '📨 Sent? Send again'; };
    return;
  }
  const s = score(t, d), pct = s / t.max;
  act.innerHTML = `<div class="result" style="flex:1"><span class="big">${s}/${t.max}</span><div><b>${pct === 1 ? 'Perfect!' : pct >= .7 ? 'Strong result.' : pct >= .4 ? 'Not bad — now study the script.' : 'Tough one. Listen again in practice mode with the script.'}</b><div class="muted" style="color:var(--desk-muted)">${d.mode === 'exam' ? 'exam mode' : 'practice mode'} · best so far ${ST.res[t.id].best}/${t.max}</div></div></div>`;
  after.innerHTML = `<div class="actions"><button class="btn tg" data-send>📨 Send to Anya</button><button class="btn ghost" data-copy>Copy results</button><button class="btn ghost" data-script>Show the script</button><button class="btn ghost" data-again>Try again</button></div>
    <div class="hack"><b class="k">Lifehack for this task</b>${esc(t.hack)}</div><div class="scriptbox"></div>`;
  $('[data-send]').onclick = e => { send(report(t, d)); e.target.textContent = '📨 Sent? Send again'; };
  $('[data-copy]').onclick = e => { try { navigator.clipboard.writeText(report(t, d)).then(() => { e.target.textContent = 'Copied ✓'; }); } catch (x) {} };
  $('[data-again]').onclick = () => { ST.drafts[t.id] = {a: {}, checked: false}; save(); stopAudio(); render(); };
  $('[data-script]').onclick = e => { const b = $('.scriptbox'); if (b.innerHTML) { b.innerHTML = ''; e.target.textContent = 'Show the script'; return; } b.innerHTML = scriptHTML(t); e.target.textContent = 'Hide the script'; };
}
function scriptHTML(t) {
  return `<div class="script"><h3>Script</h3>${t.script.split('\n').map(l => {
    const dir = /^(\(|\[|pause|now (listen|we begin|you have)|you (will|now) (hear|have)|this is the end|text repeated|--|the recording is repeated|transfer|time is over|first,? you have|before (listening|you hear)|look at questions|that is the end|\d\.\s+(you|study|listen|do the|pause|time))/i.test(l.trim());
    const sp = l.match(/^([A-Z][A-Za-z.]{0,14}(?: [A-Z][a-z]+)?|Speaker \d|Int|[A-Z]{1,2})\s?[:–-]\s/);
    return `<p class="${dir ? 'dir' : ''}">${sp && !dir ? `<span class="sp">${esc(sp[1])}:</span> ${esc(l.slice(sp[0].length))}` : esc(l)}</p>`;
  }).join('')}</div>`;
}

/* ---------- report → Telegram ---------- */
function report(t, d) {
  const lines = [`🎧 Listening Lab · ${STUDENT}`, `${LV[t.level][0]} · ${t.stage} · ${t.region} ${t.year}`, `“${t.title}” · ${d.mode === 'exam' ? 'exam mode' : 'practice mode'}`, `Score: ${score(t, d)}/${t.max}`, ''];
  let n = 0;
  t.parts.forEach((p, pi) => {
    const a = d.a[pi] || {};
    if (t.parts.length > 1) lines.push(`— Part ${pi + 1} · ${fmt(p)}`);
    if (p.t === 'multi') {
      const chosen = a.length ? a.slice().sort().map(k => `${p.answer.includes(k) ? '✅' : '❌'}${k}`).join(' ') : '(nothing chosen)';
      const missed = p.answer.filter(k => !a.includes(k));
      lines.push(`${chosen}${missed.length ? ` · missed: ${missed.join(', ')}` : ''}`); return;
    }
    p.items.forEach((it, i) => {
      n++; const v = a[i], ok = isRight(p, i, v);
      const show = x => x === undefined || x === '' ? '—' : p.t === 'mcq' ? 'ABCD'[x] : p.t === 'gap' ? `“${x}”` : x;
      const right = p.t === 'mcq' ? 'ABCD'[it[2]] : p.t === 'gap' ? it[1][0] : it[1];
      const label = p.t === 'match' ? `${it[0].length > 30 ? n : it[0]}` : n;
      lines.push(`${ok ? '✅' : '❌'} ${label}. ${show(v)}${ok ? '' : ` → ${right}`}`);
    });
  });
  return lines.join('\n');
}
function send(text) { window.open(`https://t.me/${TG_USER}?text=${encodeURIComponent(text)}`, '_blank', 'noopener'); }

/* ---------- results ---------- */
function results() {
  const done = TASKS.filter(t => ST.res[t.id]);
  const tot = done.reduce((s, t) => s + ST.res[t.id].best, 0), max = done.reduce((s, t) => s + t.max, 0);
  return `<div class="kicker">Your progress</div><h1>My results</h1><p class="lead">${done.length} of ${TASKS.length} tasks done${done.length ? ` · best scores ${tot}/${max} (${Math.round(tot / max * 100)}%)` : ''}.</p>
    <table class="sum"><tr><th>Level</th><th>Task</th><th>Format</th><th>Best</th><th>Last</th></tr>${TASKS.map(t => { const r = ST.res[t.id]; return `<tr><td>${LV[t.level][0]}</td><td><a href="#t-${t.id}">${esc(t.title)}</a><div class="muted" style="font-size:12.5px">${esc(t.region)} · ${t.year}</div></td><td>${esc(t.formats.join(', '))}</td><td>${r ? `<b>${r.best}/${t.max}</b>` : '—'}</td><td>${r ? `${r.score}/${t.max} · ${r.mode}` : ''}</td></tr>`; }).join('')}</table>
    <div class="actions"><button class="btn tg" data-sendall ${done.length ? '' : 'disabled'}>📨 Send the summary to Anya</button><button class="btn ghost" data-reset>Reset all results</button></div>` + navBtns();
}
function bindResults() {
  const b = $('[data-sendall]'); if (b) b.onclick = sendSummary;
  $('[data-reset]').onclick = () => { if (confirm('Erase all your listening results and answers?')) { ST.res = {}; ST.drafts = {}; save(); render(); } };
}
function sendSummary() {
    const done = TASKS.filter(t => ST.res[t.id]);
    if (!done.length) { alert('Do at least one task first — press “Check answers”, then send.'); return; }
    const lines = [`🎧 Listening Lab · ${STUDENT} · summary`, `${done.length}/${TASKS.length} tasks done`, ''];
    [1, 2, 3].forEach(l => { const ts = done.filter(t => t.level === l); if (!ts.length) return; lines.push(`${LV[l][0]} · ${LV[l][1]}`); ts.forEach(t => { const r = ST.res[t.id]; lines.push(`${r.best === t.max ? '✅' : r.best / t.max >= .6 ? '🟡' : '❌'} ${t.title} (${t.region} ${t.year}) — best ${r.best}/${t.max}`); }); lines.push(''); });
    send(lines.join('\n'));
}

go(location.hash.slice(1) || 'start');
window.__lab = {TASKS, ST: () => ST, go, score, report, isRight};
})();
</script></body></html>
